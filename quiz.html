<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>AADYA — Quiz</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;

  font-family:
    Arial,
    "Noto Sans Devanagari",
    sans-serif;

  background:#f3f7fb;
  color:#172b4d;
}

.top{
  background:
    linear-gradient(
      135deg,
      #111,
      #17345f,
      #274d78
    );

  color:#fff;

  padding:12px;

  position:sticky;
  top:0;

  z-index:5;
}

.row{
  max-width:900px;
  margin:auto;

  display:flex;

  justify-content:space-between;
  align-items:center;

  gap:10px;
}

.brand{
  font-size:22px;
  font-weight:900;
}

.sub{
  font-size:13px;
  color:#dbe3ee;
}

.btn{
  border:0;

  border-radius:12px;

  padding:10px 13px;

  font-weight:900;

  cursor:pointer;
}

.home{
  background:#fff;
  color:#172b4d;
}

.wrap{
  max-width:900px;

  margin:auto;

  padding:
    15px 12px 45px;
}

.box,
.chapter,
.quiz{
  background:#fff;

  border-radius:20px;

  box-shadow:
    0 7px 22px
    rgba(23,43,77,.08);

  border:
    1px solid #e4ebf3;
}

.box{
  padding:18px;

  margin-bottom:15px;
}

.title{
  font-size:28px;
  font-weight:900;
}

.muted{
  color:#68768a;

  line-height:1.6;

  font-size:13px;
}

.select{
  width:100%;

  padding:13px;

  border:
    1px solid #dbe3ed;

  border-radius:12px;

  font-size:16px;

  margin-top:8px;

  background:#fff;
}

.chapter{
  margin:12px 0;

  overflow:hidden;
}

.ch{
  padding:15px;

  background:#f7fbff;

  font-weight:900;
}

.lesson{
  display:flex;

  gap:9px;

  align-items:center;

  padding:12px;

  border-bottom:
    1px solid #edf1f5;
}

.lesson:last-child{
  border-bottom:0;
}

.num{
  width:36px;
  height:36px;

  border-radius:11px;

  background:#172b4d;

  color:#fff;

  display:grid;

  place-items:center;

  font-weight:900;

  flex:none;
}

.lt{
  flex:1;

  font-size:14px;

  line-height:1.45;
}

.start{
  background:#f7c928;

  color:#172b4d;
}

.quiz{
  padding:20px;

  border-top:
    5px solid #52c7e8;
}

.q{
  font-size:20px;

  font-weight:900;

  line-height:1.55;

  margin:15px 0;
}

.option{
  display:block;

  width:100%;

  text-align:left;

  padding:14px;

  border:
    2px solid #e5e9ef;

  background:#fff;

  border-radius:14px;

  margin:9px 0;

  font-size:15px;

  cursor:pointer;
}

.option.selected{
  border-color:#35a9d1;

  background:#e8f9ff;
}

.nav{
  display:flex;

  gap:9px;

  margin-top:15px;
}

.nav .btn{
  flex:1;
}

.next{
  background:#172b4d;

  color:#fff;
}

.result{
  text-align:center;

  padding:15px;
}

.score{
  font-size:43px;

  font-weight:900;
}

.hidden{
  display:none!important;
}

.empty{
  padding:20px;

  text-align:center;

  color:#718096;

  background:#f8fafc;

  border-radius:15px;
}

@media(max-width:600px){

  .brand{
    font-size:19px;
  }

  .title{
    font-size:25px;
  }

  .q{
    font-size:18px;
  }

}

</style>

</head>

<body>

<header class="top">

<div class="row">

<div>

<div class="brand">
🎯 Quiz
</div>

<div
  class="sub"
  id="sub"
>
AADYA Digital Teacher
</div>

</div>

<button
  class="btn home"
  onclick="location.href='./index.html'"
>
⌂ होम
</button>

</div>

</header>


<main class="wrap">


<section class="box">

<div class="title">
🎯 अपनी तैयारी जाँचें
</div>

<div class="muted">
विषय चुनिए और किसी भी Lesson का Quiz शुरू कीजिए।
</div>


<label
  style="
    display:block;
    font-weight:900;
    margin-top:14px
  "
>

📘 विषय

</label>


<select
  id="subjectSelect"
  class="select"
>

<option value="">
सभी विषय
</option>

</select>

</section>


<section
  id="lessons"
>
</section>


<section
  id="quizBox"
  class="quiz hidden"
>
</section>


</main>


<script src="./js/aadya-core.js"></script>


<script>

"use strict";


let cls =
  AADYA.getClass();

let data =
  null;

let all =
  [];

let currentFile =
  "";

let questions =
  [];

let current =
  0;

let answers =
  [];


const $ =
  id =>
    document.getElementById(id);


const esc =
  AADYA.esc;


/* =====================================================
   LESSON LIST
===================================================== */

function buildList(){

  const subjectKey =
    $("subjectSelect")
      .value;


  const groups =
    {};


  all
    .filter(
      function(item){

        return (
          !subjectKey ||
          item.subjectKey ===
          subjectKey
        );

      }
    )
    .forEach(
      function(item){

        const key =
          item.subjectKey +
          "|" +
          item.chapterNumber;


        if(
          !groups[key]
        ){

          groups[key] = {

            subject:
              item.subjectName,

            chapter:
              item.chapterTitle,

            items:
              []

          };

        }


        groups[key]
          .items
          .push(item);

      }
    );


  let html =
    "";


  Object.values(
    groups
  ).forEach(
    function(group){

      html +=

        '<section class="chapter">' +

        '<div class="ch">' +

        '📘 ' +

        esc(
          group.subject
        ) +

        ' · अध्याय ' +

        esc(
          group.chapter
        ) +

        '</div>';


      group.items.forEach(
        function(lesson){

          html +=

            '<div class="lesson">' +

            '<div class="num">' +

            esc(
              lesson.number
            ) +

            '</div>' +

            '<div class="lt">' +

            esc(
              lesson.title
            ) +

            '</div>' +

            '<button ' +
            'class="btn start" ' +
            'data-file="' +
            esc(
              lesson.file
            ) +
            '">' +

            'Quiz' +

            '</button>' +

            '</div>';

        }
      );


      html +=
        '</section>';

    }
  );


  $("lessons").innerHTML =
    html ||

    '<div class="empty">' +
    'इस विषय में Quiz वाले Lessons उपलब्ध नहीं हैं।' +
    '</div>';


  document
    .querySelectorAll(
      ".start"
    )
    .forEach(
      function(button){

        button.onclick =
          function(){

            startQuiz(
              button.dataset.file
            );

          };

      }
    );

}


/* =====================================================
   START QUIZ
===================================================== */

async function startQuiz(
  file
){

  try{

    const lesson =
      await AADYA.lessonData(
        file
      );


    questions =
      AADYA.questions(
        lesson,
        false
      );


    if(
      !questions.length
    ){

      alert(
        "इस Lesson में अभी Quiz प्रश्न उपलब्ध नहीं हैं।"
      );

      return;

    }


    currentFile =
      file;


    current =
      0;


    answers =
      new Array(
        questions.length
      ).fill(null);


    $("lessons")
      .classList
      .add("hidden");


    $("quizBox")
      .classList
      .remove("hidden");


    renderQuestion();

  }
  catch(error){

    console.error(
      error
    );


    alert(
      "Quiz लोड नहीं हो पाया।"
    );

  }

}


/* =====================================================
   QUESTION
===================================================== */

function renderQuestion(){

  const q =
    questions[current];


  let html =

    '<div ' +
    'style="' +
    'display:flex;' +
    'justify-content:space-between;' +
    'gap:8px' +
    '">' +

    '<b>' +

    'प्रश्न ' +

    (
      current + 1
    ) +

    ' / ' +

    questions.length +

    '</b>' +

    '<button ' +
    'class="btn" ' +
    'onclick="backToLessons()">' +

    '← Lessons' +

    '</button>' +

    '</div>' +

    '<hr>' +

    '<div class="q">' +

    esc(
      q.question
    ) +

    '</div>';


  q.options.forEach(
    function(option,index){

      html +=

        '<button ' +

        'class="option ' +

        (
          answers[current] ===
          index
            ?
          'selected'
            :
          ''
        ) +

        '" ' +

        'data-i="' +
        index +
        '">' +

        String.fromCharCode(
          65 + index
        ) +

        '. ' +

        esc(
          option
        ) +

        '</button>';

    }
  );


  html +=

    '<div class="nav">' +

    '<button ' +
    'class="btn" ' +
    'onclick="backToLessons()">' +

    'बाद में' +

    '</button>' +

    '<button ' +
    'class="btn next" ' +
    'id="next">' +

    (
      current <
      questions.length - 1
        ?
      'अगला →'
        :
      'परिणाम देखें'
    ) +

    '</button>' +

    '</div>';


  $("quizBox")
    .innerHTML =
    html;


  $("quizBox")
    .querySelectorAll(
      ".option"
    )
    .forEach(
      function(button){

        button.onclick =
          function(){

            answers[current] =
              Number(
                button.dataset.i
              );


            renderQuestion();

          };

      }
    );


  $("next")
    .onclick =
    nextQuestion;

}


/* =====================================================
   NEXT
===================================================== */

function nextQuestion(){

  if(
    answers[current] ==
    null
  ){

    alert(
      "पहले एक उत्तर चुनिए।"
    );

    return;

  }


  if(
    current <
    questions.length - 1
  ){

    current++;

    renderQuestion();

  }
  else{

    finishQuiz();

  }

}


/* =====================================================
   FINISH
===================================================== */

function finishQuiz(){

  let score =
    0;


  questions.forEach(
    function(question,index){

      const correctIndex =
  AADYA.answerIndex(
    question.answer,
    question.options
  );

if(
  answers[index] === correctIndex
){
  score++;
    }

    }
  );


  const percentage =
    Math.round(
      score /
      questions.length *
      100
    );


  const result = {

        score: score,
    total: questions.length,
    percentage: percentage,
    date: new Date().toISOString()
  };

  localStorage.setItem(
    "aadya_last_quiz_score",
    JSON.stringify(result)
  );

  let history = [];

  try{
    history =
      JSON.parse(
        localStorage.getItem("aadya_quiz_history_v1")
      ) || [];
  }catch(e){
    history = [];
  }

  history.push(result);

  localStorage.setItem(
    "aadya_quiz_history_v1",
    JSON.stringify(history)
  );

  const resultBox =
    document.getElementById("result");

  let message = "";

  if(percentage >= 80){
    message = "🌟 बहुत बढ़िया! शानदार प्रदर्शन!";
  }else if(percentage >= 60){
    message = "👏 अच्छा प्रयास! थोड़ा और अभ्यास करें।";
  }else{
    message = "💪 कोई बात नहीं! दोबारा अभ्यास करें और फिर प्रयास करें।";
  }

  resultBox.innerHTML =
    '<div class="result-card">' +
      '<div class="result-emoji">🎉</div>' +
      '<h2>Quiz पूरा हुआ!</h2>' +
      '<div class="score">' +
        score + " / " + questions.length +
      '</div>' +
      '<div class="percentage">' +
        percentage + "%" +
      '</div>' +
      '<p>' + message + '</p>' +
      '<button onclick="location.reload()">' +
        '🔄 फिर से Quiz दें' +
      '</button>' +
      '<button onclick="location.href=\'index.html\'">' +
        '🏠 Home पर जाएँ' +
      '</button>' +
    '</div>';

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/* =========================================
   QUIZ START
========================================= */

async function startQuiz(){

  const subject =
    document.getElementById("subjectSelect").value;

  if(!subject){
    alert("कृपया पहले विषय चुनें।");
    return;
  }

  const classNumber =
    AADYA.getClassNumber();

  const curriculum =
    await AADYA.loadCurriculum(classNumber);

  if(!curriculum){
    document.getElementById("quizArea").innerHTML =
      '<div class="empty">⚠️ Curriculum लोड नहीं हो पाया।</div>';
    return;
  }

  const subjectData =
    AADYA.classData(
      curriculum,
      subject
    );

  if(!subjectData){
    document.getElementById("quizArea").innerHTML =
      '<div class="empty">⚠️ इस विषय की जानकारी उपलब्ध नहीं है।</div>';
    return;
  }

  const lessons =
    AADYA.buildLessons(
      subjectData,
      subject
    );

  if(!lessons.length){
    document.getElementById("quizArea").innerHTML =
      '<div class="empty">📚 इस विषय में अभी कोई lesson उपलब्ध नहीं है।</div>';
    return;
  }

  questions = [];

  /*
    सभी lessons से quiz questions इकट्ठे किए जाएंगे।
    इससे भविष्य में नए chapter/lesson जोड़ने पर
    Quiz अपने आप उन्हें पढ़ सकेगा।
  */

  for(
    let i = 0;
    i < lessons.length;
    i++
  ){

    try{

      const response =
        await fetch(
          lessons[i].file
        );

      if(!response.ok){
        continue;
      }

      const data =
        await response.json();

      const lessonQuestions =
        AADYA.questions(
          data,
          false
        );

      lessonQuestions.forEach(
        function(question){

          if(
            question &&
            Array.isArray(question.options) &&
            question.options.length >= 2
          ){

            questions.push({
              ...question,
              lessonTitle:
                lessons[i].title,
              lessonFile:
                lessons[i].file
            });

          }

        }
      );

    }catch(error){

      console.error(
        "Quiz lesson error:",
        lessons[i].file,
        error
      );

    }
  }


  if(!questions.length){

    document.getElementById("quizArea").innerHTML =
      '<div class="empty">' +
        '📚 इस विषय के lessons में अभी Quiz questions उपलब्ध नहीं हैं।' +
      '</div>';

    return;
  }


  /*
    हर बार Quiz शुरू होने पर
    questions को random order में दिखाएँ।
  */

  questions =
    questions
      .sort(
        () => Math.random() - 0.5
      )
      .slice(
        0,
        Math.min(10, questions.length)
      );


  answers =
    new Array(
      questions.length
    ).fill(null);

  currentQuestion = 0;

  document.getElementById(
    "quizArea"
  ).style.display = "block";

  document.getElementById(
    "quizStart"
  ).style.display = "none";

  renderQuestion();

}


/* =========================================
   RENDER QUESTION
========================================= */

function renderQuestion(){

  const area =
    document.getElementById("quizArea");

  if(
    !questions.length
  ){
    area.innerHTML =
      '<div class="empty">' +
        '⚠️ कोई प्रश्न उपलब्ध नहीं है।' +
      '</div>';

    return;
  }


  const question =
    questions[currentQuestion];


  let optionsHTML = "";


  question.options.forEach(
    function(option,index){

      const selected =
        answers[currentQuestion] === index
          ? "selected"
          : "";

      optionsHTML +=
        '<button class="option ' +
          selected +
          '" onclick="selectAnswer(' +
            index +
          ')">' +
          '<span class="option-letter">' +
            String.fromCharCode(65 + index) +
          '</span>' +
          '<span>' +
            option +
          '</span>' +
        '</button>';

    }
  );


  const progressPercent =
    Math.round(
      (
        (currentQuestion + 1) /
        questions.length
      ) * 100
    );


  area.innerHTML =

    '<div class="quiz-card">' +

      '<div class="quiz-top">' +

        '<span>' +
          'प्रश्न ' +
          (currentQuestion + 1) +
          ' / ' +
          questions.length +
        '</span>' +

        '<span>' +
          progressPercent +
          '%' +
        '</span>' +

      '</div>' +

      '<div class="progress-bar">' +
        '<div class="progress-fill" style="width:' +
          progressPercent +
        '%"></div>' +
      '</div>' +

      '<div class="lesson-name">' +
        (question.lessonTitle || "") +
      '</div>' +

      '<h2 class="question">' +
        question.question +
      '</h2>' +

      '<div class="options">' +
        optionsHTML +
      '</div>' +

      '<div class="quiz-navigation">' +

        '<button ' +
          (
            currentQuestion === 0
              ? 'disabled'
              : ''
          ) +
          ' onclick="previousQuestion()">' +
          '← पिछला' +
        '</button>' +

        (
          currentQuestion <
          questions.length - 1

            ?

          '<button ' +
            (
              answers[currentQuestion] === null
                ? 'disabled'
                : ''
            ) +
            ' onclick="nextQuestion()">' +
            'अगला →' +
          '</button>'

            :

          '<button ' +
            (
              answers[currentQuestion] === null
                ? 'disabled'
                : ''
            ) +
            ' onclick="finishQuiz()">' +
            '🏁 Quiz समाप्त करें' +
          '</button>'
        ) +

      '</div>' +

    '</div>';

}


/* =========================================
   SELECT ANSWER
========================================= */

function selectAnswer(index){

  answers[currentQuestion] =
    index;

  renderQuestion();

}


/* =========================================
   NEXT
========================================= */

function nextQuestion(){

  if(
    answers[currentQuestion] === null
  ){
    return;
  }

  if(
    currentQuestion <
    questions.length - 1
  ){

    currentQuestion++;

    renderQuestion();

  }

}


/* =========================================
   PREVIOUS
========================================= */

function previousQuestion(){

  if(
    currentQuestion > 0
  ){

    currentQuestion--;

    renderQuestion();

  }

}


/* =========================================
   INIT
========================================= */

async function init(){

  const select =
    document.getElementById(
      "subjectSelect"
    );

  const classNumber =
    AADYA.getClassNumber();


  const curriculum =
    await AADYA.loadCurriculum(
      classNumber
    );


  if(!curriculum){

    select.innerHTML =
      '<option value="">' +
        '⚠️ विषय लोड नहीं हुए' +
      '</option>';

    return;
  }


  const subjects =
    Object.keys(
      curriculum
    ).filter(
      function(key){

        return (
          curriculum[key] &&
          typeof curriculum[key] === "object" &&
          (
            curriculum[key].chapters ||
            curriculum[key].lessons
          );

      }
    );


  if(!subjects.length){

    select.innerHTML =
      '<option value="">' +
        'कोई विषय उपलब्ध नहीं' +
      '</option>';

    return;
  }


  select.innerHTML =
    '<option value="">' +
      '📚 विषय चुनें' +
    '</option>';


  subjects.forEach(
    function(subject){

      const data =
        curriculum[subject];

      const option =
        document.createElement(
          "option"
        );

      option.value =
        subject;

      option.textContent =
        (
          data.name ||
          AADYA.subjectName(subject)
        );

      select.appendChild(
        option
      );

    }
  );

}


document.addEventListener(
  "DOMContentLoaded",
  init
);

</script>

</body>
</html>
