<script>

const PROFILE_KEY =
"aadya_student_profile_v1";

const HISTORY_KEY =
"aadya_quiz_history_v1";

const LAST_KEY =
"aadya_last_quiz_score";


let cls="6";
let data=null;
let questions=[];
let current=0;
let answers=[];
let currentFile="";
/* =========================================================
   AADYA CUSTOM QUIZ NOTIFICATION
========================================================= */

let qaLastFocus = null;

function showQuizNotice(
  message,
  title="एक छोटी सी बात 😊",
  icon="💡"
){

  qaLastFocus =
    document.activeElement;

  let overlay =
    document.getElementById(
      "aadyaQuizNotice"
    );

  if(!overlay){

    overlay =
      document.createElement("div");

    overlay.id =
      "aadyaQuizNotice";

    overlay.className =
      "qa-overlay";

    overlay.setAttribute(
      "role",
      "alertdialog"
    );

    overlay.setAttribute(
      "aria-modal",
      "true"
    );

    overlay.setAttribute(
      "aria-labelledby",
      "qaNoticeTitle"
    );

    overlay.setAttribute(
      "aria-describedby",
      "qaNoticeMessage"
    );

    overlay.innerHTML = `

      <div class="qa-modal">

        <div class="qa-icon">
          ${icon}
        </div>

        <h2
          class="qa-title"
          id="qaNoticeTitle">
          ${title}
        </h2>

        <div
          class="qa-message"
          id="qaNoticeMessage">
          ${message}
        </div>

        <button
          type="button"
          class="qa-ok"
          id="qaNoticeOk">
          ठीक है 👍
        </button>

      </div>

    `;

    document.body.appendChild(
      overlay
    );

  }

  overlay.style.display =
    "flex";

  const ok =
    document.getElementById(
      "qaNoticeOk"
    );

  ok.onclick =
    closeQuizNotice;

  overlay.onclick =
    function(e){

      if(e.target === overlay){

        closeQuizNotice();

      }

    };

  document.onkeydown =
    function(e){

      if(
        e.key === "Escape"
      ){

        closeQuizNotice();

      }

    };

  requestAnimationFrame(
    function(){

      ok.focus();

    }
  );

}


function closeQuizNotice(){

  const overlay =
    document.getElementById(
      "aadyaQuizNotice"
    );

  if(!overlay)
    return;

  overlay.style.display =
    "none";

  document.onkeydown =
    null;

  if(
    qaLastFocus &&
    typeof qaLastFocus.focus ===
    "function"
  ){

    qaLastFocus.focus();

  }

}

function esc(v){

return String(v ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function profile(){

try{

return JSON.parse(
localStorage.getItem(PROFILE_KEY)||"{}"
);

}catch(e){

return {};

}

}


function curriculumUrl(c){

if(String(c)==="7")
return "./data/curriculum-class7.json";

if(String(c)==="8")
return "./data/curriculum-class8.json";

return "./data/curriculum.json";

}


function classData(){

return data?.classes?.["class"+cls] || null;

}


function normalizeQuestion(q){

if(typeof q==="string"){

return {
question:q,
options:[],
correct_answer:null
};

}

return {

question:
q?.question ||
q?.text ||
"",

options:
Array.isArray(q?.options)
?q.options
:[],

correct_answer:
q?.correct_answer ??
q?.answer ??
q?.correct ??
null

};

}


function allLessons(){

const result=[];

const subjects =
classData()?.subjects || {};

Object.keys(subjects)
.forEach(function(subjectKey){

const subject =
subjects[subjectKey];

(subject.chapters || [])
.forEach(function(chapter){

(chapter.lessons || [])
.forEach(function(lesson){

result.push({

...lesson,

subjectName:
subject.name ||
subjectKey,

chapterTitle:
chapter.title,

chapterNumber:
chapter.number

});

});

});

});

return result;

}


async function init(){

const p=profile();

cls=String(p.class || 6);

document.getElementById("intro")
.textContent =
(p.name
?"नमस्ते, "+p.name+"! "
:"")+
"कक्षा "+cls+
" के Lessons का Quiz यहाँ दें।";


try{

data =
await (
await fetch(
curriculumUrl(cls)+
"?v="+Date.now()
)
).json();

renderLessons();

}catch(e){

document.getElementById("lessons")
.innerHTML =
'<div class="empty">'+
'⚠️ Curriculum लोड नहीं हो पाया।'+
'</div>';

}

}


function renderLessons(){

const lessons=allLessons();

let html="";

let lastSubject="";
let lastChapter="";


lessons.forEach(function(lesson,index){

if(
lesson.subjectName !==
lastSubject
){

html +=
'<div style="margin:14px 0 8px;font-weight:800">'+
'📘 '+
esc(lesson.subjectName)+
'</div>';

lastSubject=
lesson.subjectName;

lastChapter="";

}


if(
lesson.chapterTitle !==
lastChapter
){

html +=
'<div class="chapter">'+
'<div class="chapter-head">'+
'अध्याय '+
esc(lesson.chapterNumber)+
' — '+
esc(lesson.chapterTitle || "")+
'</div>';

lastChapter=
lesson.chapterTitle;

}


html +=
'<div class="lesson">'+

'<div class="num">'+
esc(lesson.number)+
'</div>'+

'<div class="lt">'+
esc(
lesson.title ||
("पाठ "+lesson.number)
)+
'</div>'+

'<button '+
'class="start" '+
'data-file="'+
esc(lesson.file || "")+
'">'+

'Quiz'+

'</button>'+

'</div>';


const next=lessons[index+1];


if(
!next ||
next.chapterTitle !==
lastChapter
){

html +=
'</div>';

}

});


document.getElementById("lessons")
.innerHTML =
html ||
'<div class="empty">'+
'अभी कोई Lesson उपलब्ध नहीं है।'+
'</div>';


document
.querySelectorAll(".start")
.forEach(function(button){

button.onclick=function(){

startQuiz(
button.dataset.file
);

};

});

}


async function startQuiz(file){

if(!file)
return;

currentFile=file;


try{

const response =
await fetch(
file+"?v="+Date.now()
);

const lesson =
await response.json();


questions =
(
lesson.quiz?.questions ||
lesson.quiz_questions ||
[]
)
.map(normalizeQuestion);


if(!questions.length){

showQuizNotice(
  "इस Lesson में अभी Quiz प्रश्न उपलब्ध नहीं हैं ⏸️",
  "Quiz अभी तैयार नहीं है 📚",
  "📝"
);

return;

}


current=0;

answers=
new Array(
questions.length
).fill(null);


document
.getElementById("selector")
.classList.add("hidden");

document
.getElementById("quizBox")
.classList.remove("hidden");


renderQuestion();

}catch(e){

showQuizNotice(
  "Quiz लोड नहीं हो पाया। कृपया एक बार फिर प्रयास करें😊",
  "Quiz लोड नहीं हुआ ⚠️",
  "⚠️"
);

}

}


function renderQuestion(){

const q=
questions[current];

let html="";


html +=
'<div class="quiz-head">'+

'<strong>'+
'प्रश्न '+
(current+1)+
' / '+
questions.length+
'</strong>'+

'<button class="btn" '+
'onclick="backToLessons()">'+
'← Lessons'+
'</button>'+

'</div>';


html +=
'<hr style="border:0;border-top:1px solid #eee;margin:12px 0">';


html +=
'<div class="q">'+
esc(q.question)+
'</div>';


q.options.forEach(function(option,index){

html +=
'<button '+
'class="option" '+
'data-i="'+
index+
'">'+

String.fromCharCode(65+index)+
'. '+
esc(option)+

'</button>';

});


html +=
'<div class="nav">'+

'<button onclick="backToLessons()">'+
'बाद में'+
'</button>'+

'<button class="next" '+
'id="nextBtn">'+
'अगला →'+
'</button>'+

'</div>';


document.getElementById("quizBox")
.innerHTML=html;


document
.querySelectorAll(".option")
.forEach(function(button){

button.onclick=function(){

answers[current]=
Number(button.dataset.i);


document
.querySelectorAll(".option")
.forEach(function(b){

b.classList.toggle(
"selected",
Number(b.dataset.i) ===
answers[current]
);

});

};

});


document.getElementById("nextBtn")
.onclick=nextQuestion;

}


function nextQuestion(){

if(answers[current]===null){

showQuizNotice(
  "आगे बढ़ने से पहले अपना एक उत्तर चुनिए।",
  "एक उत्तर चुनिए 🎯",
  "🎯"
);

return;

}


if(
current <
questions.length-1
){

current++;

renderQuestion();

}else{

finishQuiz();

}

}


function finishQuiz(){

let score=0;


questions.forEach(function(q,index){

if(
String(answers[index]) ===
String(q.correct_answer)
){

score++;

}

});


const percentage =
Math.round(
score /
questions.length *
100
);


let history={};

try{

history=
JSON.parse(
localStorage.getItem(
HISTORY_KEY
)||"{}"
);

}catch(e){

history={};

}


const key=
String(currentFile)
.replace(/^\.\/+/,"");


const result={

score:score,

total:
questions.length,

percentage:
percentage,

timestamp:
new Date().toISOString()

};


history[key]=result;


localStorage.setItem(
HISTORY_KEY,
JSON.stringify(history)
);


localStorage.setItem(
LAST_KEY,
JSON.stringify({

...result,

lessonFile:
currentFile

})
);


document.getElementById("quizBox")
.innerHTML=

'<div class="result">'+

'<div style="font-size:42px">'+
'🎉'+
'</div>'+

'<div class="score">'+
score+
' / '+
questions.length+
'</div>'+

'<div style="margin-top:7px;font-weight:800">'+
percentage+
'% सही'+
'</div>'+

'<div class="muted" style="margin-top:10px">'+

(
percentage>=80
?"बहुत बढ़िया! 🌟"
:
percentage>=50
?"अच्छा प्रयास! फिर से अभ्यास करें।"
:
"कोई बात नहीं — Lesson दोबारा पढ़कर फिर प्रयास करें।"
)+

'</div>'+

'<div class="nav">'+

'<button onclick="backToLessons()">'+
'📚 दूसरा Quiz'+
'</button>'+

'<button class="next" '+
'onclick="startQuiz(currentFile)">'+
'🔁 फिर से दें'+
'</button>'+

'</div>'+

'</div>';

}


function backToLessons(){

document
.getElementById("quizBox")
.classList.add("hidden");

document
.getElementById("selector")
.classList.remove("hidden");

}


init();

</script>

</body>

</html>
