<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<meta
  name="theme-color"
  content="#111111"
>

<title>AADYA — Quiz</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;

  font-family:
    Arial,
    "Noto Sans Devanagari",
    sans-serif;

  background:#f3f7fb;
  color:#172b4d;
}


/* ===============================
   HEADER
================================ */

.top{
  background:
    linear-gradient(
      135deg,
      #111,
      #17345f,
      #274d78
    );

  color:#fff;

  padding:12px;

  position:sticky;
  top:0;

  z-index:10;
}

.row{
  max-width:900px;

  margin:auto;

  display:flex;

  justify-content:space-between;
  align-items:center;

  gap:10px;
}

.brand{
  font-size:22px;
  font-weight:900;
}

.sub{
  font-size:13px;
  color:#dbe3ee;
  margin-top:3px;
}

.btn{
  border:0;

  border-radius:12px;

  padding:10px 13px;

  font-weight:900;

  cursor:pointer;
}

.home{
  background:#fff;
  color:#172b4d;
}


/* ===============================
   PAGE
================================ */

.wrap{
  max-width:900px;

  margin:auto;

  padding:
    15px 12px 45px;
}

.box,
.chapter,
.quiz{
  background:#fff;

  border-radius:20px;

  border:
    1px solid #e4ebf3;

  box-shadow:
    0 7px 22px
    rgba(23,43,77,.08);
}

.box{
  padding:18px;

  margin-bottom:15px;
}


/* ===============================
   TITLE
================================ */

.title{
  font-size:28px;
  font-weight:900;
}

.muted{
  color:#68768a;

  line-height:1.6;

  font-size:13px;

  margin-top:6px;
}


/* ===============================
   SUBJECT SELECT
================================ */

.select-title{
  font-size:18px;

  font-weight:900;

  margin-bottom:8px;
}

.select{
  width:100%;

  padding:13px;

  border:
    1px solid #dbe3ed;

  border-radius:12px;

  font-size:16px;

  background:#fff;

  color:#172b4d;
}


/* ===============================
   LESSON LIST
================================ */

.chapter{
  margin:12px 0;

  overflow:hidden;
}

.ch{
  padding:15px;

  background:#f7fbff;

  font-weight:900;

  line-height:1.5;
}

.lesson{
  display:flex;

  gap:9px;

  align-items:center;

  padding:12px;

  border-bottom:
    1px solid #edf1f5;
}

.lesson:last-child{
  border-bottom:0;
}

.num{
  width:36px;
  height:36px;

  border-radius:11px;

  background:#172b4d;

  color:#fff;

  display:grid;

  place-items:center;

  font-weight:900;

  flex:none;
}

.lt{
  flex:1;

  font-size:14px;

  line-height:1.45;
}

.start{
  background:#f7c928;

  color:#172b4d;
}


/* ===============================
   QUIZ
================================ */

.quiz{
  padding:20px;

  border-top:
    5px solid #52c7e8;
}

.quiz-head{
  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:8px;
}

.q{
  font-size:20px;

  font-weight:900;

  line-height:1.55;

  margin:18px 0;
}

.option{
  display:block;

  width:100%;

  text-align:left;

  padding:14px;

  border:
    2px solid #e5e9ef;

  background:#fff;

  border-radius:14px;

  margin:9px 0;

  font-size:15px;

  cursor:pointer;

  transition:
    .15s ease;
}

.option:hover{
  background:#f8fbff;
}

.option.selected{
  border-color:#35a9d1;

  background:#e8f9ff;
}

.option.correct{
  border-color:#24ad69;

  background:#e5f8ed;
}

.option.wrong{
  border-color:#e05252;

  background:#ffe9e9;
}

.option:disabled{
  cursor:default;
}

.feedback{
  margin-top:12px;

  padding:12px;

  border-radius:12px;

  line-height:1.6;
}

.feedback.good{
  background:#e5f8ed;
  color:#176b3a;
}

.feedback.bad{
  background:#ffe9e9;
  color:#9d2020;
}


/* ===============================
   NAVIGATION
================================ */

.nav{
  display:flex;

  gap:9px;

  margin-top:18px;
}

.nav .btn{
  flex:1;
}

.next{
  background:#172b4d;

  color:#fff;
}


/* ===============================
   RESULT
================================ */

.result{
  text-align:center;

  padding:20px;
}

.score{
  font-size:43px;

  font-weight:900;

  margin:10px 0;
}

.result-message{
  line-height:1.7;

  color:#68768a;

  margin-bottom:15px;
}

.result button{
  margin:5px;

  padding:11px 15px;

  border:0;

  border-radius:11px;

  background:#172b4d;

  color:#fff;

  font-weight:900;
}


/* ===============================
   EMPTY
================================ */

.empty{
  padding:20px;

  text-align:center;

  color:#718096;

  background:#f8fafc;

  border-radius:15px;

  line-height:1.6;
}


/* ===============================
   PROGRESS
================================ */

.quiz-progress{
  height:9px;

  background:#e8edf3;

  border-radius:99px;

  overflow:hidden;

  margin:12px 0 18px;
}

.quiz-progress-fill{
  height:100%;

  background:
    linear-gradient(
      90deg,
      #f7c928,
      #56ccf2,
      #7b61ff
    );
}


/* ===============================
   MOBILE
================================ */

@media(max-width:600px){

  .brand{
    font-size:19px;
  }

  .title{
    font-size:25px;
  }

  .q{
    font-size:18px;
  }

  .lesson{
    gap:7px;
  }

  .lt{
    font-size:13px;
  }

  .start{
    padding:9px 10px;
  }

}

</style>

</head>


<body>


<header class="top">

<div class="row">

<div>

<div class="brand">
AADYA Digital Teacher
</div>

<div class="sub">
🧠 Quiz
</div>

</div>

<button
  class="btn home"
  onclick="location.href='./index.html'"
>
⌂ Home
</button>

</div>

</header>


<main class="wrap">


<section class="box">

<div class="title">
🧠 अपना Quiz चुनें
</div>

<div
  class="muted"
  id="intro"
>
विषय चुनें और फिर किसी Lesson का Quiz दें।
</div>

</section>


<section
  class="box"
  id="selector"
>

<div class="select-title">
📚 विषय चुनें
</div>

<select
  id="subjectSelect"
  class="select"
>
<option value="">
विषय लोड हो रहा है...
</option>
</select>

</section>


<section
  class="box"
  id="lessonsBox"
>

<div class="select-title">
📖 Lesson चुनें
</div>

<div id="lessons">

<div class="empty">
पहले विषय चुनें।
</div>

</div>

</section>


<section
  id="quizBox"
  class="quiz"
  style="display:none"
>
</section>


</main>


<script src="./js/aadya-core.js"></script>


<script>

"use strict";


let profile =
  {};

let curriculum =
  null;

let lessons =
  [];

let questions =
  [];

let current =
  0;

let answers =
  [];

let currentLesson =
  null;


const $ =
  id =>
    document.getElementById(id);


/* ==========================================
   LOAD SUBJECTS
========================================== */

async function init(){

  profile =
    AADYA.profile();


  const classNumber =
    AADYA.getClass();


  $("intro").textContent =
    (
      profile.name
        ? "नमस्ते, " +
          profile.name +
          "! "
        : ""
    ) +
    "कक्षा " +
    classNumber +
    " के Lessons का Quiz यहाँ दें।";


  try{

    curriculum =
      await AADYA.loadCurriculum(
        classNumber
      );


    const classData =
      AADYA.classData(
        curriculum,
        classNumber
      );


    const subjects =
      Object.entries(
        classData?.subjects || {}
      );


    const select =
      $("subjectSelect");


    select.innerHTML =
      '<option value="">' +
      '📚 विषय चुनें' +
      '</option>';


    subjects.forEach(
      function(entry){

        const key =
          entry[0];

        const subject =
          entry[1];


        const option =
          document.createElement(
            "option"
          );


        option.value =
          key;


        option.textContent =
          (
            AADYA.icon(key) +
            " " +
            (
              subject.name ||
              key
            )
          );


        select.appendChild(
          option
        );

      }
    );


    select.onchange =
      renderLessons;


  }
  catch(error){

    console.error(
      "Quiz curriculum error:",
      error
    );


    $("lessons").innerHTML =
      '<div class="empty">' +
      '⚠️ Curriculum लोड नहीं हो पाया।' +
      '</div>';

  }

}


/* ==========================================
   LESSON LIST
========================================== */

function renderLessons(){

  const subjectKey =
    $("subjectSelect").value;


  $("quizBox").style.display =
    "none";


  if(!subjectKey){

    $("lessons").innerHTML =
      '<div class="empty">' +
      'पहले विषय चुनें।' +
      '</div>';

    return;

  }


  const classNumber =
    AADYA.getClass();


  const classData =
    AADYA.classData(
      curriculum,
      classNumber
    );


  const subject =
    classData?.subjects?.[
      subjectKey
    ];


  if(!subject){

    $("lessons").innerHTML =
      '<div class="empty">' +
      'इस विषय की जानकारी उपलब्ध नहीं है।' +
      '</div>';

    return;

  }


  lessons =
    AADYA.buildLessons(
      {
        classes:{
          [
            "class" +
            classNumber
          ]:{
            subjects:{
              [subjectKey]:
                subject
            }
          }
        }
      },
      classNumber
    );


  if(!lessons.length){

    $("lessons").innerHTML =
      '<div class="empty">' +
      'इस विषय में अभी कोई Lesson उपलब्ध नहीं है।' +
      '</div>';

    return;

  }


  const groups =
    {};


  lessons.forEach(
    function(lesson){

      const key =
        String(
          lesson.chapterNumber
        );


      if(!groups[key]){

        groups[key] = {

          title:
            lesson.chapterTitle,

          items:
            []

        };

      }


      groups[key].items.push(
        lesson
      );

    }
  );


  let html =
    "";


  Object.values(
    groups
  ).forEach(
    function(group){

      html +=

        '<section class="chapter">' +

        '<div class="ch">' +

        '📘 ' +

        AADYA.esc(
          group.title
        ) +

        '</div>';


      group.items.forEach(
        function(lesson){

          html +=

            '<div class="lesson">' +

            '<div class="num">' +

            AADYA.esc(
              lesson.number
            ) +

            '</div>' +

            '<div class="lt">' +

            AADYA.esc(
              lesson.title
            ) +

            '</div>' +

            '<button ' +
            'class="btn start" ' +
            'data-file="' +
            AADYA.esc(
              lesson.file
            ) +
            '">' +

            'Quiz' +

            '</button>' +

            '</div>';

        }
      );


      html +=
        '</section>';

    }
  );


  $("lessons").innerHTML =
    html;


  document
    .querySelectorAll(
      ".start"
    )
    .forEach(
      function(button){

        button.onclick =
          function(){

            startQuiz(
              button.dataset.file
            );

          };

      }
    );

}


/* ==========================================
   START QUIZ
========================================== */

async function startQuiz(
  file
){

  try{

    currentLesson =
      AADYA.lessonMeta(
        lessons,
        file
      );


    const data =
      await AADYA.lessonData(
        file
      );


    questions =
      AADYA.questions(
        data,
        false
      );


    /*
      केवल वही questions जिनका
      सही उत्तर पहचाना जा सके।
    */

    questions =
      questions.filter(
        function(question){

          return (
            question.correctIndex >= 0 &&
            Array.isArray(
              question.options
            ) &&
            question.options.length >= 2
          );

        }
      );


    if(!questions.length){

      alert(
        "इस Lesson में अभी Quiz प्रश्न उपलब्ध नहीं हैं।"
      );

      return;

    }


    current =
      0;


    answers =
      new Array(
        questions.length
      ).fill(null);


    $("lessonsBox")
      .style.display =
      "none";


    $("quizBox")
      .style.display =
      "block";


    renderQuestion();


  }
  catch(error){

    console.error(
      "Quiz load error:",
      error
    );


    alert(
      "⚠️ Quiz लोड नहीं हो पाया।"
    );

  }

}


/* ==========================================
   RENDER QUESTION
========================================== */

function renderQuestion(){

  const question =
    questions[current];


  if(!question){

    return;

  }


  const percentage =
    Math.round(
      (
        (current + 1) /
        questions.length
      ) * 100
    );


  let html =

    '<div class="quiz-head">' +

      '<b>' +

      'प्रश्न ' +
      (current + 1) +
      ' / ' +
      questions.length +

      '</b>' +

      '<button ' +
        'class="btn" ' +
        'onclick="backToLessons()">' +

        '← Lessons' +

      '</button>' +

    '</div>' +


    '<div class="quiz-progress">' +

      '<div ' +
        'class="quiz-progress-fill" ' +
        'style="width:' +
        percentage +
        '%">' +
      '</div>' +

    '</div>' +


    '<div class="muted">' +

      AADYA.esc(
        currentLesson?.title ||
        ""
      ) +

    '</div>' +


    '<div class="q">' +

      AADYA.esc(
        question.question
      ) +

    '</div>';


  question.options.forEach(
    function(option,index){

      const selected =
        answers[current] === index;


      html +=

        '<button ' +

        'class="option ' +
        (
          selected
            ? "selected"
            : ""
        ) +
        '" ' +

        'data-index="' +
        index +
        '">' +

        '<b>' +
        String.fromCharCode(
          65 + index
        ) +
        '.</b> ' +

        AADYA.esc(
          option
        ) +

        '</button>';

    }
  );


  html +=

    '<div class="nav">' +

      '<button ' +
        'class="btn" ' +
        'onclick="previousQuestion()" ' +
        (
          current === 0
            ? "disabled"
            : ""
        ) +
      '>' +

        '← पिछला' +

      '</button>' +


      '<button ' +
        'class="btn next" ' +
        'id="nextButton" ' +
        (
          answers[current] === null
            ? "disabled"
            : ""
        ) +
      '>' +

        (
          current <
          questions.length - 1
            ? "अगला →"
            : "🏁 परिणाम देखें"
        ) +

      '</button>' +

    '</div>';


  $("quizBox").innerHTML =
    html;


  $("quizBox")
    .querySelectorAll(
      ".option"
    )
    .forEach(
      function(button){

        button.onclick =
          function(){

            answers[current] =
              Number(
                button.dataset.index
              );


            renderQuestion();

          };

      }
    );


  $("nextButton")
    .onclick =
    nextQuestion;

}


/* ==========================================
   NEXT
========================================== */

function nextQuestion(){

  if(
    answers[current] === null
  ){

    return;

  }


  if(
    current <
    questions.length - 1
  ){

    current++;

    renderQuestion();

  }
  else{

    finishQuiz();

  }

}


/* ==========================================
   PREVIOUS
========================================== */

function previousQuestion(){

  if(
    current > 0
  ){

    current--;

    renderQuestion();

  }

}


/* ==========================================
   FINISH
========================================== */

function finishQuiz(){

  let score =
    0;


  questions.forEach(
    function(question,index){

      /*
        Universal normalizer का सही उपयोग:
        answer / correct_answer / A-B-C-D /
        text / numeric सभी core संभालता है।
      */

      const correctIndex =
        question.correctIndex;


      if(
        answers[index] ===
        correctIndex
      ){

        score++;

      }

    }
  );


  const total =
    questions.length;


  const percentage =
    total
      ? Math.round(
          score /
          total *
          100
        )
      : 0;


  const result = {

    score:
      score,

    total:
      total,

    percentage:
      percentage,

    lesson:
      currentLesson?.file ||
      "",

    lessonTitle:
      currentLesson?.title ||
      "",

    subject:
      currentLesson?.subjectName ||
      "",

    timestamp:
      new Date().toISOString()

  };


  /*
    Last Quiz
  */

  AADYA.write(
    AADYA.KEYS.LAST_QUIZ,
    result
  );


  /*
    Quiz History
  */

  const history =
    AADYA.read(
      AADYA.KEYS.QUIZ,
      []
    );


  if(
    Array.isArray(history)
  ){

    history.push(
      result
    );

    AADYA.write(
      AADYA.KEYS.QUIZ,
      history
    );

  }


  let message;


  if(
    percentage >= 80
  ){

    message =
      "🌟 बहुत बढ़िया! शानदार प्रदर्शन!";

  }
  else if(
    percentage >= 60
  ){

    message =
      "👏 अच्छा प्रयास! थोड़ा और अभ्यास करें।";

  }
  else{

    message =
      "💪 कोई बात नहीं! Lesson दोबारा पढ़कर फिर प्रयास करें।";

  }


  $("quizBox").innerHTML =

    '<div class="result">' +

      '<div style="font-size:42px">🎉</div>' +

      '<h2>Quiz पूरा हुआ!</h2>' +

      '<div class="score">' +

        score +
        " / " +
        total +

      '</div>' +

      '<div>' +

        percentage +
        "% सही" +

      '</div>' +

      '<div class="result-message">' +

        message +

      '</div>' +

      '<button ' +
        'onclick="restartQuiz()">' +

        '🔄 फिर से दें' +

      '</button>' +

      '<button ' +
        'onclick="backToLessons()">' +

        '📚 दूसरा Lesson' +

      '</button>' +

      '<button ' +
        'onclick="location.href=\'./index.html\'">' +

        '🏠 Home' +

      '</button>' +

    '</div>';


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ==========================================
   RESTART
========================================== */

function restartQuiz(){

  if(
    currentLesson?.file
  ){

    startQuiz(
      currentLesson.file
    );

  }

}


/* ==========================================
   BACK TO LESSONS
========================================== */

function backToLessons(){

  $("quizBox")
    .style.display =
    "none";


  $("lessonsBox")
    .style.display =
    "block";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ==========================================
   START
========================================== */

document.addEventListener(
  "DOMContentLoaded",
  init
);

</script>


</body>

</html>
