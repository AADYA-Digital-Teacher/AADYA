<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<meta
  name="theme-color"
  content="#111111"
>

<title>AADYA | सभी कक्षाएँ</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;

  font-family:
    Arial,
    "Noto Sans Devanagari",
    sans-serif;

  background:#f3f7fb;
  color:#172b4d;
}

.top{
  background:
    linear-gradient(
      135deg,
      #111,
      #17345f,
      #274d78
    );

  color:#fff;

  padding:13px;

  position:sticky;
  top:0;

  z-index:10;
}

.row{
  max-width:950px;
  margin:auto;

  display:flex;

  justify-content:space-between;
  align-items:center;

  gap:10px;
}

.brand{
  font-size:22px;
  font-weight:900;
}

.sub{
  font-size:13px;
  color:#dbe3ee;

  margin-top:3px;
}

.btn{
  border:0;

  border-radius:12px;

  padding:10px 13px;

  font-weight:900;

  cursor:pointer;
}

.home{
  background:#fff;
  color:#172b4d;
}

.wrap{
  max-width:950px;

  margin:auto;

  padding:
    15px 12px 45px;
}

.intro,
.classbox,
.chapter,
.lesson{
  background:#fff;

  border-radius:18px;

  border:
    1px solid #e4ebf3;

  box-shadow:
    0 7px 22px
    rgba(23,43,77,.07);
}

.intro{
  padding:18px;

  margin-bottom:14px;
}

.intro h1{
  margin:0 0 6px;

  font-size:24px;
}

.muted{
  color:#68768a;

  font-size:13px;

  line-height:1.6;
}


/* ===============================
   CLASS TABS
================================ */

.class-tabs{
  display:grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(90px,1fr)
    );

  gap:9px;

  margin-bottom:15px;
}

.tab{
  border:0;

  border-radius:13px;

  padding:12px;

  background:#fff;

  color:#172b4d;

  font-weight:900;

  box-shadow:
    0 4px 13px
    rgba(23,43,77,.07);

  cursor:pointer;
}

.tab.active{
  background:#172b4d;

  color:#f7c928;
}


/* ===============================
   CONTENT
================================ */

.classbox{
  padding:16px;
}

.subject-title{
  font-size:20px;

  font-weight:900;

  margin:
    20px 2px 10px;
}

.chapter{
  margin:
    11px 0 17px;

  overflow:hidden;
}

.ch-head{
  padding:15px;

  background:
    linear-gradient(
      90deg,
      #f7fbff,
      #faf8ff
    );

  border-bottom:
    1px solid #e8edf3;

  font-weight:900;

  line-height:1.55;
}

.badge{
  display:inline-block;

  margin-top:7px;

  padding:5px 9px;

  border-radius:999px;

  background:#eef2f6;

  color:#667085;

  font-size:11px;
}

.lesson{
  margin:8px;

  padding:11px;

  display:flex;

  align-items:center;

  gap:10px;

  box-shadow:none;

  border:
    1px solid #e9eef4;
}

.num{
  width:34px;
  height:34px;

  border-radius:10px;

  background:#172b4d;

  color:#fff;

  display:grid;

  place-items:center;

  font-weight:900;

  flex:none;
}

.lt{
  flex:1;

  font-size:13px;

  line-height:1.5;
}

.open{
  border:0;

  border-radius:10px;

  padding:9px 11px;

  background:#172b4d;

  color:#fff;

  font-weight:900;

  cursor:pointer;
}

.locked{
  background:#e8edf2;

  color:#7b8794;
}

.lesson.disabled{
  opacity:.65;
}

.note{
  margin:
    8px 0 14px;

  padding:12px;

  border-radius:12px;

  background:#fff8df;

  color:#6a5700;

  font-size:12px;

  line-height:1.6;
}

.empty{
  text-align:center;

  color:#718096;

  padding:20px;

  background:#f8fafc;

  border-radius:14px;

  line-height:1.6;
}

.loading{
  text-align:center;

  padding:25px;

  color:#718096;
}


@media(max-width:600px){

  .brand{
    font-size:19px;
  }

  .subject-title{
    font-size:18px;
  }

  .lt{
    font-size:12px;
  }

  .open{
    padding:
      8px 9px;

    font-size:11px;
  }

}

</style>

</head>


<body>


<header class="top">

<div class="row">

<div>

<div class="brand">
AADYA Digital Teacher
</div>

<div class="sub">
📖 सभी कक्षाएँ
</div>

</div>

<button
  class="btn home"
  onclick="location.href='./index.html'"
>
⌂ Home
</button>

</div>

</header>


<main class="wrap">


<section class="intro">

<h1>
📖 सभी कक्षाएँ
</h1>

<div
  class="muted"
  id="intro"
>
उपलब्ध कक्षाओं के विषय, अध्याय और Lessons देखें।
</div>

</section>


<div
  class="class-tabs"
  id="classTabs"
>
</div>


<section class="classbox">

<div id="content">

<div class="loading">
⏳ Curriculum लोड हो रहा है...
</div>

</div>

</section>


</main>


<script src="./js/aadya-core.js"></script>


<script>

"use strict";


let profile =
  {};

let classes =
  [];

let selectedClass =
  6;


/* ==========================================
   ESCAPE
========================================== */

function esc(value){

  return AADYA.esc(
    value
  );

}


/* ==========================================
   LOAD CLASS REGISTRY
========================================== */

async function loadClasses(){

  try{

    const response =
      await fetch(
        "./data/classes.json?v=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );


    if(
      !response.ok
    ){

      throw new Error(
        "classes.json failed"
      );

    }


    const data =
      await response.json();


    if(
      Array.isArray(
        data.classes
      ) &&
      data.classes.length
    ){

      classes =
        data.classes;

    }
    else{

      throw new Error(
        "Invalid classes.json"
      );

    }

  }
  catch(error){

    /*
      Fallback:
      अगर registry file उपलब्ध न हो
      तो current 6–8 classes काम करती रहें।
    */

    classes = [

      {
        number:6,
        name:"कक्षा 6",
        file:"./data/curriculum.json"
      },

      {
        number:7,
        name:"कक्षा 7",
        file:"./data/curriculum-class7.json"
      },

      {
        number:8,
        name:"कक्षा 8",
        file:"./data/curriculum-class8.json"
      }

    ];

  }

}


/* ==========================================
   CLASS TABS
========================================== */

function renderTabs(){

  const box =
    document.getElementById(
      "classTabs"
    );


  box.innerHTML =
    "";


  classes.forEach(
    function(item){

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "tab";


      button.dataset.class =
        item.number;


      button.textContent =
        item.name ||
        (
          "कक्षा " +
          item.number
        );


      button.onclick =
        function(){

          loadClass(
            Number(
              item.number
            )
          );

        };


      box.appendChild(
        button
      );

    }
  );

}


/* ==========================================
   LOAD CLASS
========================================== */

async function loadClass(
  classNumber
){

  selectedClass =
    Number(
      classNumber
    );


  document
    .querySelectorAll(
      ".tab"
    )
    .forEach(
      function(button){

        button.classList.toggle(
          "active",
          Number(
            button.dataset.class
          ) ===
          selectedClass
        );

      }
    );


  const content =
    document.getElementById(
      "content"
    );


  content.innerHTML =
    '<div class="loading">' +
    '⏳ कक्षा ' +
    selectedClass +
    ' का Curriculum लोड हो रहा है...' +
    '</div>';


  try{

    const data =
      await AADYA.loadCurriculum(
        selectedClass
      );


    renderClass(
      data
    );

  }
  catch(error){

    console.error(
      error
    );


    content.innerHTML =
      '<div class="empty">' +
      '⚠️ इस कक्षा का Curriculum लोड नहीं हो पाया।' +
      '</div>';

  }

}


/* ==========================================
   RENDER CLASS
========================================== */

function renderClass(
  data
){

  const classData =
    AADYA.classData(
      data,
      selectedClass
    );


  if(!classData){

    document.getElementById(
      "content"
    ).innerHTML =
      '<div class="empty">' +
      'इस कक्षा का Curriculum उपलब्ध नहीं है।' +
      '</div>';

    return;

  }


  const own =
    Number(
      profile.class
    ) ===
    selectedClass;


  let html =

    '<div class="note">' +

    (
      own

        ?

      '✅ यह आपकी चुनी हुई कक्षा है। Lessons खोले जा सकते हैं।'

        :

      '🔒 यह आपकी चुनी हुई कक्षा नहीं है। यहाँ केवल विषय, अध्याय और Lesson नाम दिखेंगे।'

    ) +

    '</div>';


  Object.entries(
    classData.subjects || {}
  ).forEach(
    function(entry){

      const subjectKey =
        entry[0];

      const subject =
        entry[1];


      html +=

        '<div class="subject-title">' +

        AADYA.icon(
          subjectKey
        ) +

        ' ' +

        esc(
          subject.name ||
          subjectKey
        ) +

        '</div>';


      (
        subject.chapters ||
        []
      ).forEach(
        function(chapter){

          html +=

            '<section class="chapter">' +

            '<div class="ch-head">' +

            'अध्याय ' +

            esc(
              chapter.number
            ) +

            ' — ' +

            esc(
              chapter.title ||
              ""
            );


          if(
            chapter.source
          ){

            html +=

              '<br>' +

              '<span class="badge">' +

              (
                chapter.source ===
                "textbook"

                  ?

                "📖 पाठ्यपुस्तक आधारित"

                  :

                "✨ AADYA विशेष पाठ"

              ) +

              '</span>';

          }


          html +=
            '</div>';


          const chapterLessons =
            chapter.lessons ||
            [];


          if(
            !chapterLessons.length
          ){

            html +=

              '<div class="empty">' +

              'इस अध्याय के Lessons जल्द उपलब्ध होंगे।' +

              '</div>';

          }


          chapterLessons.forEach(
            function(lesson){

              const file =
                lesson.file ||
                "";


              html +=

                '<div class="lesson ' +

                (
                  own
                    ? ""
                    : "disabled"
                ) +

                '">' +

                '<div class="num">' +

                esc(
                  lesson.number
                ) +

                '</div>' +

                '<div class="lt">' +

                esc(
                  lesson.title ||
                  (
                    "पाठ " +
                    lesson.number
                  )
                ) +

                '</div>';


              if(
                own &&
                file
              ){

                html +=

                  '<button ' +

                  'class="open" ' +

                  'data-file="' +

                  esc(file) +

                  '">' +

                  'खोलें' +

                  '</button>';

              }
              else{

                html +=

                  '<button ' +

                  'class="open locked" ' +

                  'disabled>' +

                  '🔒' +

                  '</button>';

              }


              html +=
                '</div>';

            }
          );


          html +=
            '</section>';

        }
      );

    }
  );


  document.getElementById(
    "content"
  ).innerHTML =
    html;


  document
    .querySelectorAll(
      ".open[data-file]"
    )
    .forEach(
      function(button){

        button.onclick =
          function(){

            AADYA.goLesson(
              button.dataset.file
            );

          };

      }
    );

}


/* ==========================================
   INIT
========================================== */

async function init(){

  profile =
    AADYA.profile();


  selectedClass =
    Number(
      profile.class ||
      6
    );


  await loadClasses();


  renderTabs();


  /*
    अगर profile वाली class
    registry में नहीं है,
    तो पहली available class।
  */

  const exists =
    classes.some(
      function(item){

        return Number(
          item.number
        ) ===
        selectedClass;

      }
    );


  if(!exists){

    selectedClass =
      Number(
        classes[0]?.number ||
        6
      );

  }


  loadClass(
    selectedClass
  );

}


document.addEventListener(
  "DOMContentLoaded",
  init
);

</script>


</body>

</html>
