<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>AADYA – Your Own Digital Teacher</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .app {
      min-height: 100vh;
      background: linear-gradient(180deg, #111 0%, #222 42%, #f5f5f5 42%);
    }

    .header {
      padding: 55px 22px 35px;
      color: white;
      text-align: center;
    }

    .logo {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    .tagline {
      margin-top: 10px;
      font-size: 17px;
      line-height: 1.5;
    }

    .start-btn {
      margin-top: 25px;
      padding: 14px 28px;
      border: none;
      border-radius: 30px;
      background: #d4af37;
      color: #111;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .content {
      background: #f5f5f5;
      border-radius: 28px 28px 0 0;
      padding: 28px 18px;
      min-height: 58vh;
    }

    .welcome {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .card {
      background: white;
      padding: 22px 14px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      cursor: pointer;
    }

    .icon {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .card h3 {
      font-size: 16px;
      margin-bottom: 5px;
    }

    .card p {
      font-size: 12px;
      color: #666;
    }

    .footer {
      text-align: center;
      padding: 25px 10px;
      color: #777;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="app">

    <header class="header">
      <div class="logo">AADYA</div>

      <div class="tagline">
        आपका अपना Digital Teacher<br>
        हर बच्चे के लिए Free & Offline Learning
      </div>

      <button class="start-btn" onclick="startLearning()">
        चलो सीखना शुरू करें →
      </button>
    </header>

    <main class="content">

      <div class="welcome">
        नमस्ते! आज क्या सीखना है? 👋
      </div>

      <div class="cards">

        <div class="card" onclick="showMessage('मेरी कक्षा')">
          <div class="icon">🎓</div>
          <h3>मेरी कक्षा</h3>
          <p>अपनी Class चुनें</p>
        </div>

        <div class="card" onclick="showMessage('विषय')">
          <div class="icon">📚</div>
          <h3>विषय</h3>
          <p>अपने Subjects देखें</p>
        </div>

        <div class="card" onclick="showMessage('Quiz')">
          <div class="icon">🧠</div>
          <h3>Quiz</h3>
          <p>अपनी तैयारी जाँचें</p>
        </div>

        <div class="card" onclick="showMessage('मेरी प्रगति')">
          <div class="icon">📈</div>
          <h3>मेरी प्रगति</h3>
          <p>अपनी Learning देखें</p>
        </div>

      </div>

      <div class="footer">
        AADYA — Accessible, Adaptive, Digital Yatra for All
      </div>

    </main>

  </div>

  <script>
    function startLearning() {
      alert("बहुत बढ़िया! AADYA के साथ सीखना शुरू करें।");
    }

    function showMessage(section) {
      alert(section + " — यह सुविधा जल्द ही तैयार होगी।");
    }
  </script>

</body>
</html>
