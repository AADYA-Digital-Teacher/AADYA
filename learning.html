<script>


/* ==========================================
   AADYA LEARNING ENGINE
   Version: 2.0
   Old + New JSON compatible
========================================== */


let lessonData = null;

/* Commerce + Algebra Diagram Engine के लिए */
window.lessonData = null;

let quizScore = 0;

let answeredQuestions = 0;

let quizFinished = false;


/* ==========================================
   PROFILE / PROGRESS
========================================== */


const PROFILE_KEY =
  "aadya_student_profile_v1";

const PROGRESS_KEY =
  "aadya_progress_v1";

const QUIZ_KEY =
  "aadya_last_quiz_score";
  
  const SAVED_KEY =
  "aadya_saved_lessons_v1";


/* ==========================================
   LESSON PATH
========================================== */


const lessonParams =
  new URLSearchParams(
    window.location.search
  );


const requestedLesson =
  lessonParams.get("lesson") || "1";


let lessonFile =
  "./content/class6/mathematics/chapter01/lesson01.json";


if(
  requestedLesson.endsWith(".json")
){

  lessonFile =
    requestedLesson.startsWith("./")
      ? requestedLesson
      : "./" + requestedLesson;

}

else{

  const lessonNumber =
    String(requestedLesson)
      .padStart(2,"0");

  lessonFile =
    "./content/class6/mathematics/chapter01/lesson" +
    lessonNumber +
    ".json";

}


/* ==========================================
   BASIC HELPERS
========================================== */


function asArray(value){

  return Array.isArray(value)
    ? value
    : [];

}


function firstValue(
  obj,
  keys,
  fallback = ""
){

  for(
    const key of keys
  ){

    if(
      obj &&
      obj[key] !== undefined &&
      obj[key] !== null
    ){

      return obj[key];

    }

  }

  return fallback;

}


/* ==========================================
   HTML SAFETY
========================================== */


function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#39;");

}


/* ==========================================
   ANSWER INDEX
   Supports multiple JSON naming styles
========================================== */


function answerIndex(item){

  if(!item){
    return -1;
  }

  const value =
    item.correct_answer ??
    item.answer ??
    item.correctAnswer ??
    item.answer_index;

  if(
    typeof value === "number" &&
    Number.isFinite(value)
  ){

    return value;

  }

  if(
    typeof value === "string" &&
    value.trim() !== ""
  ){

    const n =
      Number(value.trim());

    if(
      Number.isFinite(n)
    ){

      return n;

    }

  }

  return -1;

}


/* ==========================================
   APP CHAPTER NUMBER
   Class 7:
   textbook01 = Chapter 1
   textbook02 = Chapter 2
   ...
   
   Class 6:
   textbook01 = Chapter 3
   textbook02 = Chapter 4
   ...
========================================== */

function getAppChapterNumber(
  data,
  filePath
){

  const match =
    filePath.match(
      /\/textbook(\d+)\/lesson\d+\.json$/
    );

  if(match){

    const textbookNumber =
      Number(match[1]);

    /*
     * Class 7:
     * textbook01 = Chapter 1
     * textbook02 = Chapter 2
     * ...
     */
    if(
      String(data?.class) === "7"
    ){

      return textbookNumber;

    }

    /*
     * Class 8:
     * textbook01 = Chapter 1
     * textbook02 = Chapter 2
     * ...
     */
    if(
      String(data?.class) === "8"
    ){

      return textbookNumber;

    }

    /*
     * Class 6:
     * पुराने custom Chapter 1–2
     * के कारण textbook01 से +2
     */
    return textbookNumber + 2;

  }


  /*
   * पुराने custom lessons
   */
  if(
    data &&
    data.chapter &&
    typeof data.chapter === "object"
  ){

    return (
      data.chapter.number ??
      data.chapter.book_number ??
      ""
    );

  }


  return (
    data?.chapter ?? ""
  );

}



/* ==========================================
   CHAPTER TITLE
========================================== */


function getChapterTitle(data){

  if(
    data &&
    typeof data.chapter === "object"
  ){

    return (
      data.chapter.title ||
      data.chapter.chapter_title ||
      data.chapter.name ||
      ""
    );

  }

  return (
    data?.chapter_title ||
    ""
  );

}


/* ==========================================
   LESSON TITLE
========================================== */


function getLessonTitle(data){

  if(
    data &&
    typeof data.lesson === "object"
  ){

    return (
      data.lesson.title ||
      data.lesson.name ||
      ""
    );

  }

  return (
    data?.title ||
    ""
  );

}


/* ==========================================
   LESSON NUMBER
========================================== */


function getLessonNumber(data){

  if(
    data &&
    typeof data.lesson === "object"
  ){

    return (
      data.lesson.number ??
      data.lesson.lesson ??
      ""
    );

  }

  return (
    data?.lesson ?? ""
  );

}


/* ==========================================
   INTRODUCTION
========================================== */


function getIntroduction(data){

  /*
   * New format
   */

  if(
    data?.concept
  ){

    return {

      question:
        "आज हम क्या सीखेंगे?",

      explanation:
        data.concept

    };

  }


  /*
   * Old format
   */

  if(
    data?.introduction
  ){

    return data.introduction;

  }


  return {

    question:
      "आज हम क्या सीखेंगे?",

    explanation:""

  };

}


/* ==========================================
   EXPLANATION NORMALIZER
========================================== */


function getExplanation(data){

  if(
    Array.isArray(
      data?.explanation
    )
  ){

    return data.explanation;

  }


  return asArray(
    data?.simple_explanation
  );

}


/* ==========================================
   EXAMPLE NORMALIZER
   OLD + NEW + FALLBACK COMPATIBLE
========================================== */

function getExamples(data){

  if(!data) return [];

  /* ------------------------------------------
     1. New format: examples[]
  ------------------------------------------ */

  if(Array.isArray(data.examples) &&
     data.examples.length > 0){

    return data.examples;

  }


  /* ------------------------------------------
     2. Single example object
  ------------------------------------------ */

  if(
    data.example &&
    typeof data.example === "object" &&
    !Array.isArray(data.example)
  ){

    return [data.example];

  }


  /* ------------------------------------------
     3. Old format: example[]
  ------------------------------------------ */

  if(
    Array.isArray(data.example) &&
    data.example.length > 0
  ){

    return data.example;

  }


  /* ------------------------------------------
     4. Very old format
  ------------------------------------------ */

  if(
    Array.isArray(data.example_questions) &&
    data.example_questions.length > 0
  ){

    return data.example_questions;

  }


  /* ------------------------------------------
     5. String example
  ------------------------------------------ */

  if(
    typeof data.example === "string" &&
    data.example.trim() !== ""
  ){

    return [
      data.example
    ];

  }


  /* ==========================================
     6. SMART FALLBACK
     यदि JSON में example नहीं है,
     तो पहले Practice से example लें
  ========================================== */

  const practiceQuestions =
    data?.practice?.questions;

  if(
    Array.isArray(practiceQuestions) &&
    practiceQuestions.length > 0
  ){

    const first =
      practiceQuestions[0];

    return [

      {
        question:
          first.question ||
          first.text ||
          "इस पाठ का उदाहरण",

        solution:
          first.answer ||
          first.solution ||
          first.explanation ||
          ""
      }

    ];

  }


  /* ==========================================
     7. दूसरा fallback:
     Quiz से worked example
  ========================================== */

  const quizQuestions =
    data?.quiz?.questions;

  if(
    Array.isArray(quizQuestions) &&
    quizQuestions.length > 0
  ){

    const q =
      quizQuestions[0];

    let solution = "";

    const correct =
      q.correct_answer;

    if(
      typeof correct === "number" &&
      Array.isArray(q.options) &&
      q.options[correct] !== undefined
    ){

      solution =
        q.options[correct];

    }
    else if(
      typeof correct === "boolean"
    ){

      solution =
        correct
          ? "सही"
          : "गलत";

    }
    else{

      solution =
        q.answer ||
        q.solution ||
        "";

    }

    return [

      {
        question:
          q.question ||
          "इस पाठ का उदाहरण",

        solution:
          solution
      }

    ];

  }


  return [];

}

/* ==========================================
   QUESTION NORMALIZER
========================================== */


function normalizeQuestion(item){

  if(
    typeof item === "string"
  ){

    return {

      question:item,

      options:[],

      correct_answer:-1,

      explanation:""

    };

  }


  if(!item){

    return {

      question:"",

      options:[],

      correct_answer:-1,

      explanation:""

    };

  }


  let options =
    item.options ??
    item.choices ??
    item.answers ??
    [];


  if(
    !Array.isArray(options)
  ){

    options = [];

  }


  return {

    question:
      item.question ||
      item.text ||
      item.statement ||
      "",

    options:

      options.map(
        option => {

          if(
            typeof option === "object"
          ){

            return (
              option.text ||
              option.label ||
              option.value ||
              ""
            );

          }

          return String(
            option
          );

        }
      ),

    correct_answer:
      answerIndex(item),

    explanation:
      item.explanation ||
      item.solution ||
      item.answer_explanation ||
      ""

  };

}


/* ==========================================
   PRACTICE QUESTION NORMALIZER
   OLD + NEW + FALLBACK COMPATIBLE
========================================== */

function getPracticeQuestions(data){

  if(!data) return [];


  /* ------------------------------------------
     1. New textbook format
  ------------------------------------------ */

  if(
    data.practice &&
    Array.isArray(data.practice.questions) &&
    data.practice.questions.length > 0
  ){

    return data.practice.questions.map(
      normalizeQuestion
    );

  }


  /* ------------------------------------------
     2. Old format
  ------------------------------------------ */

  if(
    Array.isArray(data.practice_questions) &&
    data.practice_questions.length > 0
  ){

    return data.practice_questions.map(
      normalizeQuestion
    );

  }


  /* ------------------------------------------
     3. practice[]
  ------------------------------------------ */

  if(
    Array.isArray(data.practice) &&
    data.practice.length > 0
  ){

    return data.practice.map(
      normalizeQuestion
    );

  }


  /* ==========================================
     4. SMART FALLBACK
     अगर Practice नहीं है तो Quiz के
     पहले 3 questions को Practice बनाएं
  ========================================== */

  const quizQuestions =
    data?.quiz?.questions;

  if(
    Array.isArray(quizQuestions) &&
    quizQuestions.length > 0
  ){

    return quizQuestions
      .slice(0,3)
      .map(
        normalizeQuestion
      );

  }


  return [];

}

/* ==========================================
   QUIZ QUESTIONS
   OLD + NEW JSON COMPATIBLE
========================================== */
function getQuizQuestions(data){

  /* New format:
     "quiz":{
       "questions":[ ... ]
     }
  */
  if(
    data?.quiz &&
    Array.isArray(data.quiz.questions)
  ){
    return data.quiz.questions.map(normalizeQuestion);
  }

  /* Old format */
  if(
    Array.isArray(data?.quiz_questions)
  ){
    return data.quiz_questions.map(normalizeQuestion);
  }

  return [];
}
  
/* ==========================================
   LOAD LESSON
========================================== */


async function loadLesson(){

  try{

    const response =
      await fetch(
        lessonFile +
        "?v=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "Lesson file नहीं मिला: " +
        response.status
      );

    }


    lessonData =
      await response.json();
    window.lessonData = lessonData;


    renderLesson(
      lessonData
    );
if (
  window.AADYACommerceAlgebraDiagramEngine &&
  typeof window.AADYACommerceAlgebraDiagramEngine.refresh === "function"
) {
  setTimeout(function () {
    window.AADYACommerceAlgebraDiagramEngine.refresh();
  }, 100);
}

    document.getElementById(
      "loading"
    ).style.display =
      "none";


    document.getElementById(
      "content"
    ).style.display =
      "block";


    updateProgressUI();
    updateSaveButton();

  }
  catch(error){

    document.getElementById(
      "loading"
    ).style.display =
      "none";


    const box =
      document.getElementById(
        "error"
      );


    box.style.display =
      "block";


    box.className =
      "error";


    box.innerHTML =
      "<strong>Lesson लोड नहीं हो पाया।</strong><br><br>" +
      escapeHTML(
        error.message ||
        "कृपया page को दोबारा खोलें।"
      );


    console.error(error);

  }

}


/* ==========================================
   RENDER LESSON
========================================== */


function renderLesson(data){

  const chapterNumber =
    getAppChapterNumber(
      data,
      lessonFile
    );


  const chapterTitle =
    getChapterTitle(data);


  const lessonTitle =
    getLessonTitle(data);


  const lessonNumber =
    getLessonNumber(data);


  const intro =
    getIntroduction(data);


  /* --------------------------------------
     HEADER / TITLE
  -------------------------------------- */


  document.getElementById(
    "lessonTitle"
  ).textContent =
    lessonTitle ||
    "AADYA Learning";


  document.getElementById(
    "chapterTitle"
  ).textContent =

    "कक्षा " +
    (data.class ?? "") +

    " • " +

    (data.subject ?? "") +

    " • अध्याय " +

    chapterNumber +

    (
      chapterTitle
        ? " : " + chapterTitle
        : ""
    );


  document.getElementById(
    "mainTitle"
  ).textContent =
    lessonTitle;


  document.getElementById(
    "subtitle"
  ).textContent =

    lessonNumber
      ? "पाठ " + lessonNumber
      : "";


  /* --------------------------------------
     OBJECTIVES
  -------------------------------------- */


  const objectives =
    document.getElementById(
      "objectives"
    );


  objectives.innerHTML =
    "";


  const objectiveData =

    Array.isArray(
      data.objectives
    )

      ? data.objectives

      : asArray(
          data.learning_objectives
        );


  objectiveData.forEach(
    item => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "objective";


      div.textContent =
        "✅ " + item;


      objectives.appendChild(
        div
      );

    }
  );


  /* --------------------------------------
     INTRODUCTION
  -------------------------------------- */


  document.getElementById(
    "introQuestion"
  ).textContent =

    intro.question
      ? "🤔 " + intro.question
      : "";


  document.getElementById(
    "introExplanation"
  ).textContent =

    intro.explanation ||
    "";


  /* --------------------------------------
     EXPLANATION
  -------------------------------------- */


  const explanation =
    document.getElementById(
      "explanation"
    );


  explanation.innerHTML =
    "";


  const explanationData =
    getExplanation(data);


  explanationData.forEach(
    item => {

      const box =
        document.createElement(
          "div"
        );


      box.className =
        "example";


      if(
        typeof item === "string"
      ){

        box.innerHTML =
          escapeHTML(item);

      }
      else{

        const title =
          item.heading ||
          item.title ||
          "";


        const text =
          item.content ||
          item.text ||
          item.explanation ||
          "";


        box.innerHTML =

          (
            title
              ? "<strong>" +
                escapeHTML(title) +
                "</strong><br><br>"
              : ""
          ) +

          escapeHTML(text);

      }


      explanation.appendChild(
        box
      );

    }
  );


  /* --------------------------------------
   EXAMPLES
-------------------------------------- */
const examples =
  document.getElementById("examples");

examples.innerHTML = "";

const exampleData =
  getExamples(data);

if(exampleData.length === 0){

  examples.innerHTML = `
    <div class="example">
      <strong>💡 उदाहरण:</strong><br><br>
      ऊपर समझाई गई अवधारणा को अपने शब्दों में
      दोहराकर एक छोटा उदाहरण स्वयं बनाइए।
    </div>
  `;

} else {

  exampleData.forEach(
    (item,index) => {

      const box =
        document.createElement("div");

      box.className = "example";

      /* String example */
      if(typeof item === "string"){

        box.innerHTML =
          "<strong>उदाहरण " +
          (index + 1) +
          ":</strong><br><br>" +
          escapeHTML(item);

      }

      /* Object example */
else{

  let html =
    "<strong>उदाहरण " +
    (index + 1) +
    ":</strong>";


  /* ------------------------------------------
     सामान्य question + solution format
  ------------------------------------------ */

  const question =
    item.question ??
    item.problem ??
    item.title ??

/* ==========================================
   RENDER QUESTIONS
========================================== */


function renderQuestions(
  items,
  container,
  isQuiz
){

  /*
   * VERY IMPORTANT:
   * Clear container before rendering.
   * Prevents duplicate Practice / Quiz.
   */

  container.innerHTML =
    "";


  if(
    !items ||
    items.length === 0
  ){

    container.innerHTML =

      "<p class='small-note'>" +

      (
        isQuiz
          ? "इस lesson का Quiz तैयार किया जा रहा है।"
          : "इस lesson का अभ्यास उपलब्ध नहीं है।"
      ) +

      "</p>";

    return;

  }


  items.forEach(
    (item,index) => {

      const questionBox =
        document.createElement(
          "div"
        );


      questionBox.className =
        "example";


      const question =
        document.createElement(
          "div"
        );


      question.className =
        "question";


      question.textContent =

        (index + 1) +
        ". " +
        item.question;


      questionBox.appendChild(
        question
      );


      if(
        item.options.length === 0
      ){

        const note =
          document.createElement(
            "div"
          );


        note.textContent =
          "✏️ इस प्रश्न को कॉपी/नोटबुक में हल करें।";


        questionBox.appendChild(
          note
        );


        container.appendChild(
          questionBox
        );


        return;

      }


      const feedback =
        document.createElement(
          "div"
        );


      feedback.className =
        "feedback";


      feedback.style.display =
        "none";


      item.options.forEach(
        (optionText,optionIndex) => {

          const button =
            document.createElement(
              "button"
            );


          button.className =
            "option";


          button.textContent =
            String.fromCharCode(
              65 + optionIndex
            ) +
            ". " +
            optionText;


          button.onclick =
            function(){

              handleQuestionAnswer(
                button,
                item,
                optionIndex,
                questionBox,
                feedback,
                isQuiz
              );

            };


          questionBox.appendChild(
            button
          );

        }
      );


      questionBox.appendChild(
        feedback
      );


      container.appendChild(
        questionBox
      );

    }
  );

}


/* ==========================================
   HANDLE QUESTION ANSWER
========================================== */


function handleQuestionAnswer(
  clickedButton,
  item,
  selectedIndex,
  questionBox,
  feedback,
  isQuiz
){

  const buttons =
    questionBox.querySelectorAll(
      ".option"
    );


  /* ==========================================
     PREVENT MULTIPLE ANSWERS
  ========================================== */

  if(
    Array.from(buttons)
      .some(
        button =>
          button.disabled
      )
  ){

    return;

  }


  buttons.forEach(
    button => {

      button.disabled =
        true;

    }
  );


  /* ==========================================
     CORRECT ANSWER INDEX
  ========================================== */

  const correctIndex =
    answerIndex(item);


  /* ==========================================
     CORRECT ANSWER TEXT
  ========================================== */

  let correctAnswerText =
    "सही उत्तर उपलब्ध नहीं है।";


  if(
    correctIndex >= 0 &&
    correctIndex < item.options.length
  ){

    correctAnswerText =
      item.options[correctIndex];

  }


  /* ==========================================
     USER ANSWER TEXT
  ========================================== */

  let userAnswerText =
    "कोई उत्तर नहीं";


  if(
    selectedIndex >= 0 &&
    selectedIndex < item.options.length
  ){

    userAnswerText =
      item.options[selectedIndex];

  }


  /* ==========================================
     CORRECT ANSWER
  ========================================== */

  if(
    selectedIndex ===
    correctIndex
  ){

    clickedButton.classList.add(
      "correct"
    );


    feedback.className =
      "feedback good";


    feedback.innerHTML =

      "✅ <strong>बिल्कुल सही!</strong>" +

      "<br><br>" +

      "🎯 आपका उत्तर: <strong>" +

      escapeHTML(
        userAnswerText
      ) +

      "</strong>";


    /* --------------------------------------
       EXPLANATION
    -------------------------------------- */

    if(
      item.explanation &&
      String(
        item.explanation
      ).trim() !== ""
    ){

      feedback.innerHTML +=

        "<br><br>" +

        "💡 <strong>क्यों?</strong><br>" +

        escapeHTML(
          item.explanation
        );

    }


    feedback.style.display =
      "block";


    /* --------------------------------------
       QUIZ SCORE
    -------------------------------------- */

    if(isQuiz){

      quizScore++;

    }

  }


  /* ==========================================
     WRONG ANSWER
  ========================================== */

  else{

    clickedButton.classList.add(
      "wrong"
    );


    /* --------------------------------------
       HIGHLIGHT CORRECT OPTION
    -------------------------------------- */

    if(
      correctIndex >= 0 &&
      correctIndex < buttons.length
    ){

      buttons[
        correctIndex
      ].classList.add(
        "correct"
      );

    }


    feedback.className =
      "feedback bad";


    feedback.innerHTML =

      "❌ <strong>अभी सही उत्तर नहीं।</strong>" +

      "<br><br>" +

      "👉 आपका उत्तर: " +

      "<strong>" +

      escapeHTML(
        userAnswerText
      ) +

      "</strong>" +

      "<br><br>" +

      "✅ सही उत्तर: " +

      "<strong>" +

      escapeHTML(
        correctAnswerText
      ) +

      "</strong>";


    /* --------------------------------------
       EXPLANATION
    -------------------------------------- */

    if(
      item.explanation &&
      String(
        item.explanation
      ).trim() !== ""
    ){

      feedback.innerHTML +=

        "<br><br>" +

        "💡 <strong>समझिए:</strong><br>" +

        escapeHTML(
          item.explanation
        );

    }


    feedback.style.display =
      "block";

  }


  /* ==========================================
     QUIZ COMPLETION
  ========================================== */

  if(isQuiz){

    answeredQuestions++;


    const total =
      getQuizQuestions(
        lessonData
      ).length;


    if(
      answeredQuestions >=
      total
    ){

      finishQuiz();

    }

  }

}


/* ==========================================
   FINISH QUIZ
========================================== */


function finishQuiz(){

  if(quizFinished){

    return;

  }


  quizFinished =
    true;


  const total =
    getQuizQuestions(
      lessonData
    ).length;


  const percentage =
    total > 0
      ? Math.round(
          (
            quizScore /
            total
          ) * 100
        )
      : 0;


  const result =
    document.getElementById(
      "quizResult"
    );


  result.innerHTML =

    "🎉 Quiz पूरा हुआ! " +

    "<br><br>" +

    "आपका Score: " +

    quizScore +

    " / " +

    total +

    " (" +

    percentage +

    "%)";


  localStorage.setItem(
    QUIZ_KEY,
    JSON.stringify({

      score:
        quizScore,

      total:
        total,

      percentage:
        percentage,

      lesson:
        lessonFile,

      timestamp:
        new Date().toISOString()

    })
  );


  /*
   * Small motivation
   */

  if(
    percentage >= 80
  ){

    result.innerHTML +=
      "<br><br>🌟 शानदार! आपकी समझ बहुत अच्छी है।";

  }
  else if(
    percentage >= 50
  ){

    result.innerHTML +=
      "<br><br>👍 बहुत अच्छा! एक बार lesson फिर से देखकर और बेहतर कर सकते हैं।";

  }
  else{

    result.innerHTML +=
      "<br><br>💪 कोई बात नहीं। Lesson दोबारा पढ़िए और फिर Quiz दीजिए।";

  }

}

    return JSON.parse(
      saved
    ) || {};

      error
    );


    return {};

  }

function getSavedLessons(){

  try{

    const raw =
      localStorage.getItem(
        SAVED_KEY
      );

    if(!raw){
      return [];
    }

    const data =
      JSON.parse(raw);

    return Array.isArray(data)
      ? data
      : [];

  }
  catch(error){

    console.error(
      "Saved Lessons read error:",
      error
    );

    return [];

  }

}


function isLessonSaved(){

  const saved =
    getSavedLessons();

  return saved.some(
    item =>
      item &&
      item.file === lessonFile
  );

}


function updateSaveButton(){

  const button =
    document.getElementById(
      "saveLessonButton"
    );

  if(!button){
    return;
  }


  /*
   * Lesson load होने के बाद ही button दिखाएँ
   */
  button.style.display =
    lessonData
      ? "block"
      : "none";


  if(isLessonSaved()){

    button.classList.add(
      "saved"
    );

    button.textContent =
      "✅ बाद में पढ़ने के लिए Saved";

  }
  else{

    button.classList.remove(
      "saved"
    );

    button.textContent =
      "🔖 बाद में पढ़ें";

  }

}


function toggleSaveLesson(){

  if(!lessonData){
    return;
  }


  let saved =
    getSavedLessons();


  const existingIndex =
    saved.findIndex(
      item =>
        item &&
        item.file === lessonFile
    );


  /*
   * अगर पहले से Saved है
   * तो Remove करें
   */
  if(existingIndex !== -1){

    saved.splice(
      existingIndex,
      1
    );

    localStorage.setItem(
      SAVED_KEY,
      JSON.stringify(saved)
    );

    updateSaveButton();

    return;

  }


  /*
   * नया Lesson Save करें
   */
  const savedLesson = {

    file:
      lessonFile,

    title:
      getLessonTitle(
        lessonData
      ),

    subject:
      lessonData.subject ||
      "",

    chapterTitle:
      getChapterTitle(
        lessonData
      ),

    savedAt:
      new Date().toISOString()

  };


  saved.unshift(
    savedLesson
  );


  localStorage.setItem(
    SAVED_KEY,
    JSON.stringify(saved)
  );


  updateSaveButton();


  /*
   * छोटा confirmation
   */
  setTimeout(
    function(){

      alert(
        "🔖 Lesson Saved!\n\n" +
        "अब आप इसे 'मेरी कक्षा → Saved Lessons' में बाद में पढ़ सकते हैं।"
      );

    },
    50
  );

}

      );

    document.body.appendChild(script);

  }


  const lessonPath =

    ){

      );
