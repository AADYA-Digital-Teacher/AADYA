<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">

  <title>AADYA – Learning</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .header {
      background: #111;
      color: white;
      padding: 16px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header img {
      width: 150px;
      max-width: 70%;
      height: auto;
    }

    .header h1 {
      margin: 10px 0 4px;
      font-size: 22px;
    }

    .header p {
      margin: 0;
      font-size: 14px;
      color: #ddd;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 16px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .chapter {
      font-size: 14px;
      color: #777;
      margin-bottom: 6px;
    }

    h2 {
      margin-top: 5px;
      font-size: 25px;
    }

    h3 {
      margin-bottom: 8px;
    }

    .objective {
      padding: 8px 0;
    }

    .example {
      background: #f7f7f7;
      border-left: 4px solid #111;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
    }

    .question {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .option {
      display: block;
      width: 100%;
      text-align: left;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: white;
      font-size: 16px;
      cursor: pointer;
    }

    .option:hover {
      background: #f0f0f0;
    }

    .option.correct {
      background: #dff5df;
      border-color: #2e8b57;
    }

    .option.wrong {
      background: #ffe0e0;
      border-color: #d33;
    }

    .feedback {
      margin-top: 10px;
      font-weight: bold;
    }

    .btn {
      display: block;
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #111;
      color: white;
      margin-top: 12px;
    }

    .success {
      text-align: center;
      background: #111;
      color: white;
    }

    .loading {
      text-align: center;
      padding: 40px 10px;
      font-size: 18px;
    }

    .error {
      background: #ffe5e5;
      color: #900;
      padding: 18px;
      border-radius: 12px;
    }

    .progress {
      height: 10px;
      background: #ddd;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #111;
      transition: width 0.4s;
    }
  </style>
</head>

<body>

  <header class="header">
    <img src="./assets/logo/aadya-logo-header-full.png"
         alt="AADYA">

    <h1 id="lessonTitle">AADYA Learning</h1>
    <p>आपका अपना Digital Teacher</p>
  </header>

  <main class="container">

    <div id="loading" class="card loading">
      📚 Lesson तैयार हो रहा है...
    </div>

    <div id="content" style="display:none;">

      <section class="card">
        <div class="chapter" id="chapterTitle"></div>
        <h2 id="mainTitle"></h2>
        <p id="subtitle"></p>
      </section>

      <section class="card">
        <h3>🎯 आज हम क्या सीखेंगे?</h3>
        <div id="objectives"></div>
      </section>

      <section class="card">
        <h3 id="introQuestion"></h3>
        <p id="introExplanation"></p>
      </section>

      <section class="card">
        <h3>💡 आसान भाषा में समझें</h3>
        <div id="explanation"></div>
      </section>

      <section class="card">
        <h3>🔢 उदाहरण देखें</h3>
        <div id="examples"></div>
      </section>

      <section class="card">
        <h3>✍️ खुद करके देखें</h3>
        <div id="tryYourself"></div>
      </section>

      <section class="card">
        <h3>📝 अभ्यास</h3>
        <div id="practice"></div>
      </section>

      <section class="card">
        <h3>🧠 Quiz – अपनी समझ जाँचें</h3>
        <div id="quiz"></div>
      </section>

      <section class="card">
        <h3>🌍 अपने आसपास पैटर्न खोजें</h3>
        <p id="activityInstruction"></p>
        <ul id="activityExamples"></ul>
      </section>

      <section class="card">
        <h3>⭐ आज की मुख्य बातें</h3>
        <ul id="keyPoints"></ul>
      </section>

      <section class="card success">
        <h2 id="completionMessage"></h2>
        <p id="nextLesson"></p>

        <div class="progress">
          <div class="progress-bar" id="progressBar"></div>
        </div>

        <button class="btn" onclick="completeLesson()">
          ✅ Lesson पूरा किया
        </button>
      </section>

    </div>

    <div id="error" style="display:none;"></div>

  </main>

<script>

let lessonData = null;
let quizScore = 0;
let answeredQuestions = 0;

const lessonFile =
  "./content/class6/mathematics/chapter01/lesson01.json";


async function loadLesson() {

  try {

    const response = await fetch(lessonFile);

    if (!response.ok) {
      throw new Error("Lesson file नहीं मिला");
    }

    lessonData = await response.json();

    renderLesson(lessonData);

    document.getElementById("loading").style.display = "none";
    document.getElementById("content").style.display = "block";

  } catch (error) {

    document.getElementById("loading").style.display = "none";

    const errorBox = document.getElementById("error");

    errorBox.style.display = "block";

    errorBox.className = "error";

    errorBox.innerHTML =
      "<strong>Lesson लोड नहीं हो पाया।</strong><br><br>" +
      "कृपया Internet connection जाँचें और फिर page खोलें।";

    console.error(error);
  }
}


function renderLesson(data) {

  document.getElementById("lessonTitle").textContent =
    data.lesson.title
}

loadLesson();
</script>

</body>
</html>
