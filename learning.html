<script>


/* ==========================================
   AADYA LEARNING ENGINE
   Version: 2.0
   Old + New JSON compatible
========================================== */


let lessonData = null;

/* Commerce + Algebra Diagram Engine के लिए */
window.lessonData = null;

let quizScore = 0;

let answeredQuestions = 0;

let quizFinished = false;


/* ==========================================
   PROFILE / PROGRESS
========================================== */


const PROFILE_KEY =
  "aadya_student_profile_v1";

const PROGRESS_KEY =
  "aadya_progress_v1";

const QUIZ_KEY =
  "aadya_last_quiz_score";


/* ==========================================
   LESSON PATH
========================================== */


const lessonParams =
  new URLSearchParams(
    window.location.search
  );


const requestedLesson =
  lessonParams.get("lesson") || "1";


let lessonFile =
  "./content/class6/mathematics/chapter01/lesson01.json";


if(
  requestedLesson.endsWith(".json")
){

  lessonFile =
    requestedLesson.startsWith("./")
      ? requestedLesson
      : "./" + requestedLesson;

}

else{

  const lessonNumber =
    String(requestedLesson)
      .padStart(2,"0");

  lessonFile =
    "./content/class6/mathematics/chapter01/lesson" +
    lessonNumber +
    ".json";

}


/* ==========================================
   BASIC HELPERS
========================================== */


function asArray(value){

  return Array.isArray(value)
    ? value
    : [];

}


function firstValue(
  obj,
  keys,
  fallback = ""
){

  for(
    const key of keys
  ){

    if(
      obj &&
      obj[key] !== undefined &&
      obj[key] !== null
    ){

      return obj[key];

    }

  }

  return fallback;

}


/* ==========================================
   HTML SAFETY
========================================== */


function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#39;");

}


/* ==========================================
   ANSWER INDEX
   Supports multiple JSON naming styles
========================================== */


function answerIndex(item){

  if(!item){
    return -1;
  }

  const value =
    item.correct_answer ??
    item.answer ??
    item.correctAnswer ??
    item.answer_index;

  if(
    typeof value === "number" &&
    Number.isFinite(value)
  ){

    return value;

  }

  if(
    typeof value === "string" &&
    value.trim() !== ""
  ){

    const n =
      Number(value.trim());

    if(
      Number.isFinite(n)
    ){

      return n;

    }

  }

  return -1;

}


/* ==========================================
   APP CHAPTER NUMBER
   Class 7:
   textbook01 = Chapter 1
   textbook02 = Chapter 2
   ...
   
   Class 6:
   textbook01 = Chapter 3
   textbook02 = Chapter 4
   ...
========================================== */

function getAppChapterNumber(
  data,
  filePath
){

  const match =
    filePath.match(
      /\/textbook(\d+)\/lesson\d+\.json$/
    );

  if(match){

    const textbookNumber =
      Number(match[1]);

    /*
     * Class 7:
     * textbook01 = Chapter 1
     * textbook02 = Chapter 2
     * ...
     */
    if(
      String(data?.class) === "7"
    ){

      return textbookNumber;

    }

    /*
     * Class 8:
     * textbook01 = Chapter 1
     * textbook02 = Chapter 2
     * ...
     */
    if(
      String(data?.class) === "8"
    ){

      return textbookNumber;

    }

    /*
     * Class 6:
     * पुराने custom Chapter 1–2
     * के कारण textbook01 से +2
     */
    return textbookNumber + 2;

  }


  /*
   * पुराने custom lessons
   */
  if(
    data &&
    data.chapter &&
    typeof data.chapter === "object"
  ){

    return (
      data.chapter.number ??
      data.chapter.book_number ??
      ""
    );

  }


  return (
    data?.chapter ?? ""
  );

}



/* ==========================================
   CHAPTER TITLE
========================================== */


function getChapterTitle(data){

  if(
    data &&
    typeof data.chapter === "object"
  ){

    return (
      data.chapter.title ||
      data.chapter.chapter_title ||
      data.chapter.name ||
      ""
    );

  }

  return (
    data?.chapter_title ||
    ""
  );

}


/* ==========================================
   LESSON TITLE
========================================== */


function getLessonTitle(data){

  if(
    data &&
    typeof data.lesson === "object"
  ){

    return (
      data.lesson.title ||
      data.lesson.name ||
      ""
    );

  }

  return (
    data?.title ||
    ""
  );

}


/* ==========================================
   LESSON NUMBER
========================================== */


function getLessonNumber(data){

  if(
    data &&
    typeof data.lesson === "object"
  ){

    return (
      data.lesson.number ??
      data.lesson.lesson ??
      ""
    );

  }

  return (
    data?.lesson ?? ""
  );

}


/* ==========================================
   INTRODUCTION
========================================== */


function getIntroduction(data){

  /*
   * New format
   */

  if(
    data?.concept
  ){

    return {

      question:
        "आज हम क्या सीखेंगे?",

      explanation:
        data.concept

    };

  }


  /*
   * Old format
   */

  if(
    data?.introduction
  ){

    return data.introduction;

  }


  return {

    question:
      "आज हम क्या सीखेंगे?",

    explanation:""

  };

}


/* ==========================================
   EXPLANATION NORMALIZER
========================================== */


function getExplanation(data){

  if(
    Array.isArray(
      data?.explanation
    )
  ){

    return data.explanation;

  }


  return asArray(
    data?.simple_explanation
  );

}


/* ==========================================
   EXAMPLE NORMALIZER
   OLD + NEW + FALLBACK COMPATIBLE
========================================== */

function getExamples(data){

  if(!data) return [];

  /* ------------------------------------------
     1. New format: examples[]
  ------------------------------------------ */

  if(Array.isArray(data.examples) &&
     data.examples.length > 0){

    return data.examples;

  }


  /* ------------------------------------------
     2. Single example object
  ------------------------------------------ */

  if(
    data.example &&
    typeof data.example === "object" &&
    !Array.isArray(data.example)
  ){

    return [data.example];

  }


  /* ------------------------------------------
     3. Old format: example[]
  ------------------------------------------ */

  if(
    Array.isArray(data.example) &&
    data.example.length > 0
  ){

    return data.example;

  }


  /* ------------------------------------------
     4. Very old format
  ------------------------------------------ */

  if(
    Array.isArray(data.example_questions) &&
    data.example_questions.length > 0
  ){

    return data.example_questions;

  }


  /* ------------------------------------------
     5. String example
  ------------------------------------------ */

  if(
    typeof data.example === "string" &&
    data.example.trim() !== ""
  ){

    return [
      data.example
    ];

  }


  /* ==========================================
     6. SMART FALLBACK
     यदि JSON में example नहीं है,
     तो पहले Practice से example लें
  ========================================== */

  const practiceQuestions =
    data?.practice?.questions;

  if(
    Array.isArray(practiceQuestions) &&
    practiceQuestions.length > 0
  ){

    const first =
      practiceQuestions[0];

    return [

      {
        question:
          first.question ||
          first.text ||
          "इस पाठ का उदाहरण",

        solution:
          first.answer ||
          first.solution ||
          first.explanation ||
          ""
      }

    ];

  }


  /* ==========================================
     7. दूसरा fallback:
     Quiz से worked example
  ========================================== */

  const quizQuestions =
    data?.quiz?.questions;

  if(
    Array.isArray(quizQuestions) &&
    quizQuestions.length > 0
  ){

    const q =
      quizQuestions[0];

    let solution = "";

    const correct =
      q.correct_answer;

    if(
      typeof correct === "number" &&
      Array.isArray(q.options) &&
      q.options[correct] !== undefined
    ){

      solution =
        q.options[correct];

    }
    else if(
      typeof correct === "boolean"
    ){

      solution =
        correct
          ? "सही"
          : "गलत";

    }
    else{

      solution =
        q.answer ||
        q.solution ||
        "";

    }

    return [

      {
        question:
          q.question ||
          "इस पाठ का उदाहरण",

        solution:
          solution
      }

    ];

  }


  return [];

}

/* ==========================================
   QUESTION NORMALIZER
========================================== */


function normalizeQuestion(item){

  if(
    typeof item === "string"
  ){

    return {

      question:item,

      options:[],

      correct_answer:-1,

      explanation:""

    };

  }


  if(!item){

    return {

      question:"",

      options:[],

      correct_answer:-1,

      explanation:""

    };

  }


  let options =
    item.options ??
    item.choices ??
    item.answers ??
    [];


  if(
    !Array.isArray(options)
  ){

    options = [];

  }


  return {

    question:
      item.question ||
      item.text ||
      item.statement ||
      "",

    options:

      options.map(
        option => {

          if(
            typeof option === "object"
          ){

            return (
              option.text ||
              option.label ||
              option.value ||
              ""
            );

          }

          return String(
            option
          );

        }
      ),

    correct_answer:
      answerIndex(item),

    explanation:
      item.explanation ||
      item.solution ||
      item.answer_explanation ||
      ""

  };

}


/* ==========================================
   PRACTICE QUESTION NORMALIZER
   OLD + NEW + FALLBACK COMPATIBLE
========================================== */

function getPracticeQuestions(data){

  if(!data) return [];


  /* ------------------------------------------
     1. New textbook format
  ------------------------------------------ */

  if(
    data.practice &&
    Array.isArray(data.practice.questions) &&
    data.practice.questions.length > 0
  ){

    return data.practice.questions.map(
      normalizeQuestion
    );

  }


  /* ------------------------------------------
     2. Old format
  ------------------------------------------ */

  if(
    Array.isArray(data.practice_questions) &&
    data.practice_questions.length > 0
  ){

    return data.practice_questions.map(
      normalizeQuestion
    );

  }


  /* ------------------------------------------
     3. practice[]
  ------------------------------------------ */

  if(
    Array.isArray(data.practice) &&
    data.practice.length > 0
  ){

    return data.practice.map(
      normalizeQuestion
    );

  }


  /* ==========================================
     4. SMART FALLBACK
     अगर Practice नहीं है तो Quiz के
     पहले 3 questions को Practice बनाएं
  ========================================== */

  const quizQuestions =
    data?.quiz?.questions;

  if(
    Array.isArray(quizQuestions) &&
    quizQuestions.length > 0
  ){

    return quizQuestions
      .slice(0,3)
      .map(
        normalizeQuestion
      );

  }


  return [];

}

/* ==========================================
   QUIZ QUESTIONS
   OLD + NEW JSON COMPATIBLE
========================================== */
function getQuizQuestions(data){

  /* New format:
     "quiz":{
       "questions":[ ... ]
     }
  */
  if(
    data?.quiz &&
    Array.isArray(data.quiz.questions)
  ){
    return data.quiz.questions.map(normalizeQuestion);
  }

  /* Old format */
  if(
    Array.isArray(data?.quiz_questions)
  ){
    return data.quiz_questions.map(normalizeQuestion);
  }

  return [];
}
  
/* ==========================================
   LOAD LESSON
========================================== */


async function loadLesson(){

  try{

    const response =
      await fetch(
        lessonFile +
        "?v=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "Lesson file नहीं मिला: " +
        response.status
      );

    }


    lessonData =
      await response.json();
    window.lessonData = lessonData;


    renderLesson(
      lessonData
    );
if (
  window.AADYACommerceAlgebraDiagramEngine &&
  typeof window.AADYACommerceAlgebraDiagramEngine.refresh === "function"
) {
  setTimeout(function () {
    window.AADYACommerceAlgebraDiagramEngine.refresh();
  }, 100);
}

    document.getElementById(
      "loading"
    ).style.display =
      "none";


    document.getElementById(
      "content"
    ).style.display =
      "block";


    updateProgressUI();


  }
  catch(error){

    document.getElementById(
      "loading"
    ).style.display =
      "none";


    const box =
      document.getElementById(
        "error"
      );


    box.style.display =
      "block";


    box.className =
      "error";


    box.innerHTML =
      "<strong>Lesson लोड नहीं हो पाया।</strong><br><br>" +
      escapeHTML(
        error.message ||
        "कृपया page को दोबारा खोलें।"
      );


    console.error(error);

  }

}


/* ==========================================
   RENDER LESSON
========================================== */


function renderLesson(data){

  const chapterNumber =
    getAppChapterNumber(
      data,
      lessonFile
    );


  const chapterTitle =
    getChapterTitle(data);


  const lessonTitle =
    getLessonTitle(data);


  const lessonNumber =
    getLessonNumber(data);


  const intro =
    getIntroduction(data);


  /* --------------------------------------
     HEADER / TITLE
  -------------------------------------- */


  document.getElementById(
    "lessonTitle"
  ).textContent =
    lessonTitle ||
    "AADYA Learning";


  document.getElementById(
    "chapterTitle"
  ).textContent =

    "कक्षा " +
    (data.class ?? "") +

    " • " +

    (data.subject ?? "") +

    " • अध्याय " +

    chapterNumber +

    (
      chapterTitle
        ? " : " + chapterTitle
        : ""
    );


  document.getElementById(
    "mainTitle"
  ).textContent =
    lessonTitle;


  document.getElementById(
    "subtitle"
  ).textContent =

    lessonNumber
      ? "पाठ " + lessonNumber
      : "";


  /* --------------------------------------
     OBJECTIVES
  -------------------------------------- */


  const objectives =
    document.getElementById(
      "objectives"
    );


  objectives.innerHTML =
    "";


  const objectiveData =

    Array.isArray(
      data.objectives
    )

      ? data.objectives

      : asArray(
          data.learning_objectives
        );


  objectiveData.forEach(
    item => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "objective";


      div.textContent =
        "✅ " + item;


      objectives.appendChild(
        div
      );

    }
  );


  /* --------------------------------------
     INTRODUCTION
  -------------------------------------- */


  document.getElementById(
    "introQuestion"
  ).textContent =

    intro.question
      ? "🤔 " + intro.question
      : "";


  document.getElementById(
    "introExplanation"
  ).textContent =

    intro.explanation ||
    "";


  /* --------------------------------------
     EXPLANATION
  -------------------------------------- */


  const explanation =
    document.getElementById(
      "explanation"
    );


  explanation.innerHTML =
    "";


  const explanationData =
    getExplanation(data);


  explanationData.forEach(
    item => {

      const box =
        document.createElement(
          "div"
        );


      box.className =
        "example";


      if(
        typeof item === "string"
      ){

        box.innerHTML =
          escapeHTML(item);

      }
      else{

        const title =
          item.heading ||
          item.title ||
          "";


        const text =
          item.content ||
          item.text ||
          item.explanation ||
          "";


        box.innerHTML =

          (
            title
              ? "<strong>" +
                escapeHTML(title) +
                "</strong><br><br>"
              : ""
          ) +

          escapeHTML(text);

      }


      explanation.appendChild(
        box
      );

    }
  );

function getTryYourselfItems(data){

  if(!data){

  if(
    Array.isArray(
      data.try_yourself
    ) &&
    data.try_yourself.length
  ){

    return data.try_yourself;

  /*

    data.activity &&

      data.activity.instruction ||
      data.activity.challenge
    )

      data.activity
    ];
  }

  /*

   */
  if(
    data.practice &&
    Array.isArray(
      data.practice.questions
    ) &&
    data.practice.questions.length

      .slice(0,3);

      data.practice_questions
    ) &&
    data.practice_questions.length
  ){

    return data.practice_questions
      .slice(0,3);

   */
  if(
    Array.isArray(data.practice) &&
    data.practice.length
  ){

    return data.practice
      .slice(0,3);
  }

  return [];
}

/* ==========================================
   RENDER QUESTIONS
========================================== */


function renderQuestions(
  items,
  container,
  isQuiz
){

  /*
   * VERY IMPORTANT:
   * Clear container before rendering.
   * Prevents duplicate Practice / Quiz.
   */

  container.innerHTML =
    "";


  if(
    !items ||
    items.length === 0
  ){

    container.innerHTML =

      "<p class='small-note'>" +

      (
        isQuiz
          ? "इस lesson का Quiz तैयार किया जा रहा है।"
          : "इस lesson का अभ्यास उपलब्ध नहीं है।"
      ) +

      "</p>";

    return;

  }


  items.forEach(
    (item,index) => {

      const questionBox =
        document.createElement(
          "div"
        );


      questionBox.className =
        "example";


      const question =
        document.createElement(
          "div"
        );


      question.className =
        "question";


      question.textContent =

        (index + 1) +
        ". " +
        item.question;


      questionBox.appendChild(
        question
      );


      if(
        item.options.length === 0
      ){

        const note =
          document.createElement(
            "div"
          );


        note.textContent =
          "✏️ इस प्रश्न को कॉपी/नोटबुक में हल करें।";


        questionBox.appendChild(
          note
        );


        container.appendChild(
          questionBox
        );


        return;

      }


      const feedback =
        document.createElement(
          "div"
        );


      feedback.className =
        "feedback";


      feedback.style.display =
        "none";


      item.options.forEach(
        (optionText,optionIndex) => {

          const button =
            document.createElement(
              "button"
            );


          button.className =
            "option";


          button.textContent =
            String.fromCharCode(
              65 + optionIndex
            ) +
            ". " +
            optionText;


          button.onclick =
            function(){

              handleQuestionAnswer(
                button,
                item,
                optionIndex,
                questionBox,
                feedback,
                isQuiz
              );

            };


          questionBox.appendChild(
            button
          );

        }
      );


      questionBox.appendChild(
        feedback
      );


      container.appendChild(
        questionBox
      );

    }
  );

}


/* ==========================================
   HANDLE QUESTION ANSWER
========================================== */


function handleQuestionAnswer(
  clickedButton,
  item,
  selectedIndex,
  questionBox,
  feedback,
  isQuiz
){

  const buttons =
    questionBox.querySelectorAll(
      ".option"
    );


  /* ==========================================
     PREVENT MULTIPLE ANSWERS
  ========================================== */

  if(
    Array.from(buttons)
      .some(
        button =>
          button.disabled
      )
  ){

    return;

  }


  buttons.forEach(
    button => {

      button.disabled =
        true;

    }
  );


  /* ==========================================
     CORRECT ANSWER INDEX
  ========================================== */

  const correctIndex =
    answerIndex(item);


  /* ==========================================
     CORRECT ANSWER TEXT
  ========================================== */

  let correctAnswerText =
    "सही उत्तर उपलब्ध नहीं है।";


  if(
    correctIndex >= 0 &&
    correctIndex < item.options.length
  ){

    correctAnswerText =
      item.options[correctIndex];

  }


  /* ==========================================
     USER ANSWER TEXT
  ========================================== */

  let userAnswerText =
    "कोई उत्तर नहीं";


  if(
    selectedIndex >= 0 &&
    selectedIndex < item.options.length
  ){

    userAnswerText =
      item.options[selectedIndex];

  }


  /* ==========================================
     CORRECT ANSWER
  ========================================== */

  if(
    selectedIndex ===
    correctIndex
  ){

    clickedButton.classList.add(
      "correct"
    );


    feedback.className =
      "feedback good";


    feedback.innerHTML =

      "✅ <strong>बिल्कुल सही!</strong>" +

      "<br><br>" +

      "🎯 आपका उत्तर: <strong>" +

      escapeHTML(
        userAnswerText
      ) +

      "</strong>";


    /* --------------------------------------
       EXPLANATION
    -------------------------------------- */

    if(
      item.explanation &&
      String(
        item.explanation
      ).trim() !== ""
    ){

      feedback.innerHTML +=

        "<br><br>" +

        "💡 <strong>क्यों?</strong><br>" +

        escapeHTML(
          item.explanation
        );

    }


    feedback.style.display =
      "block";


    /* --------------------------------------
       QUIZ SCORE
    -------------------------------------- */

    if(isQuiz){

      quizScore++;

    }

  }


  /* ==========================================
     WRONG ANSWER
  ========================================== */

  else{

    clickedButton.classList.add(
      "wrong"
    );


    /* --------------------------------------
       HIGHLIGHT CORRECT OPTION
    -------------------------------------- */

    if(
      correctIndex >= 0 &&
      correctIndex < buttons.length
    ){

      buttons[
        correctIndex
      ].classList.add(
        "correct"
      );

    }


    feedback.className =
      "feedback bad";


    feedback.innerHTML =

      "❌ <strong>अभी सही उत्तर नहीं।</strong>" +

      "<br><br>" +

      "👉 आपका उत्तर: " +

      "<strong>" +

      escapeHTML(
        userAnswerText
      ) +

      "</strong>" +

      "<br><br>" +

      "✅ सही उत्तर: " +

      "<strong>" +

      escapeHTML(
        correctAnswerText
      ) +

      "</strong>";


    /* --------------------------------------
       EXPLANATION
    -------------------------------------- */

    if(
      item.explanation &&
      String(
        item.explanation
      ).trim() !== ""
    ){

      feedback.innerHTML +=

        "<br><br>" +

        "💡 <strong>समझिए:</strong><br>" +

        escapeHTML(
          item.explanation
        );

    }


    feedback.style.display =
      "block";

  }


  /* ==========================================
     QUIZ COMPLETION
  ========================================== */

  if(isQuiz){

    answeredQuestions++;


    const total =
      getQuizQuestions(
        lessonData
      ).length;


    if(
      answeredQuestions >=
      total
    ){

      finishQuiz();

    }

  }

}


/* ==========================================
   FINISH QUIZ
========================================== */


function finishQuiz(){

  if(quizFinished){

    return;

  }


  quizFinished =
    true;


  const total =
    getQuizQuestions(
      lessonData
    ).length;


  const percentage =
    total > 0
      ? Math.round(
          (
            quizScore /
            total
          ) * 100
        )
      : 0;


  const result =
    document.getElementById(
      "quizResult"
    );


  result.innerHTML =

    "🎉 Quiz पूरा हुआ! " +

    "<br><br>" +

    "आपका Score: " +

    quizScore +

    " / " +

    total +

    " (" +

    percentage +

    "%)";


  localStorage.setItem(
    QUIZ_KEY,
    JSON.stringify({

      score:
        quizScore,

      total:
        total,

      percentage:
        percentage,

      lesson:
        lessonFile,

      timestamp:
        new Date().toISOString()

    })
  );


  /*
   * Small motivation
   */

  if(
    percentage >= 80
  ){

    result.innerHTML +=
      "<br><br>🌟 शानदार! आपकी समझ बहुत अच्छी है।";

  }
  else if(
    percentage >= 50
  ){

    result.innerHTML +=
      "<br><br>👍 बहुत अच्छा! एक बार lesson फिर से देखकर और बेहतर कर सकते हैं।";

  }
  else{

    result.innerHTML +=
      "<br><br>💪 कोई बात नहीं। Lesson दोबारा पढ़िए और फिर Quiz दीजिए।";

  }

}


/* ==========================================
   ACTIVITY
========================================== */


function renderActivity(data){

  const title =
    document.getElementById(
      "activityTitle"
    );


  const instruction =
    document.getElementById(
      "activityInstruction"
    );


  const list =
    document.getElementById(
      "activityExamples"
    );


  list.innerHTML =
    "";


  const activity =
    data.activity ||
    data.activity_section ||
    {};


  const activityTitle =
    activity.title ||
    data.activity_title ||
    "🌍 गतिविधि";


  const activityInstruction =
    activity.instruction ||
    data.activity_instruction ||
    "";


  const activityExamples =
    asArray(
      activity.examples ||
      data.activity_examples
    );


  title.textContent =
    activityTitle;


  instruction.textContent =
    activityInstruction;


  activityExamples.forEach(
    item => {

      const li =
        document.createElement(
          "li"
        );


      li.textContent =
        typeof item === "string"
          ? item
          : (
              item.text ||
              item.content ||
              item.example ||
              ""
            );


      list.appendChild(
        li
      );

    }
  );


  /*
   * If no activity exists,
   * keep section useful.
   */

  if(
    !activityInstruction &&
    activityExamples.length === 0
  ){

    instruction.textContent =
      "आज सीखी गई अवधारणा को अपने आसपास की किसी वस्तु या दैनिक जीवन की स्थिति से जोड़कर देखें।";

  }

}

function renderKeyPoints(data){

  const list =

    );


  list.innerHTML =

  let points =
    asArray(
      data.key_points
    );


  if(
    points.length === 0
  ){

    points =
      asArray(
        data.summary
      );

  }


  if(
    points.length === 0
  ){

    /*
     * New lessons:
     * objectives are a safe fallback.
     */

    points =
      asArray(
        data.objectives
      );

  }


  points.forEach(
    point => {

      const li =
        document.createElement(
          "li"
        );


      li.textContent =
        point;


      list.appendChild(
        li
      );

    }
  );


  if(
    points.length === 0
  ){

    const li =
      document.createElement(
        "li"
      );


    li.textContent =
      "आज की अवधारणा को एक बार अपने शब्दों में दोहराएँ।";


    list.appendChild(
      li
    );

  }

}

    "nextLesson"

/* ==========================================
   PROGRESS
========================================== */


function getProgressData(){

  try{

    const saved =
      localStorage.getItem(
        PROGRESS_KEY
      );


    if(!saved){

      return {};

    }


    return JSON.parse(
      saved
    ) || {};

  }
  catch(error){

    console.error(
      "Progress read error:",
      error
    );


    return {};

  }

}


/* ==========================================
   UPDATE PROGRESS UI
========================================== */


function updateProgressUI(){

  const progress =
    getProgressData();


  const completed =
    progress[lessonFile] === true ||
    (
      progress[lessonFile] &&
      progress[lessonFile].completed === true
    );


  const bar =
    document.getElementById(
      "progressBar"
    );


  if(bar){

    bar.style.width =
      completed
        ? "100%"
        : "0%";

  }


  const button =
    document.getElementById(
      "completeButton"
    );


  if(button){

    button.textContent =
      completed
        ? "✅ Lesson पूरा हो चुका है"
        : "✅ Lesson पूरा किया";

  }

}


/* ==========================================
   COMPLETE LESSON
========================================== */


function completeLesson(){

  const progress =
    getProgressData();


  progress[lessonFile] = {

    completed:true,

    timestamp:
      new Date().toISOString(),

    title:
      getLessonTitle(
        lessonData
      ),

    chapter:
      getAppChapterNumber(
        lessonData,
        lessonFile
      )

  };


  localStorage.setItem(
    PROGRESS_KEY,
    JSON.stringify(
      progress
    )
  );


  document.getElementById(
    "progressBar"
  ).style.width =
    "100%";


  document.getElementById(
    "completeButton"
  ).textContent =
    "✅ Lesson पूरा हो चुका है";


  document.getElementById(
    "completionMessage"
  ).textContent =
    "🎉 शानदार! आपने यह Lesson पूरा कर लिया।";


  document.getElementById(
    "nextLesson"
  ).textContent =
    "आपकी Learning Progress सेव हो गई है। 🚀";


  /*
   * Small notification
   */

  setTimeout(
    function(){

      alert(
        "🎉 बहुत बढ़िया!\n\n" +
        "यह Lesson आपकी Progress में सेव हो गया है।"
      );

    },
    100
  );

}
