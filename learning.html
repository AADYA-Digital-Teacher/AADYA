<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">

<title>AADYA – Learning</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #222;
}

/* HEADER */

.header {
  background: #111;
  color: white;
  padding: 22px 16px 26px;
  text-align: center;
}

.header img {
  width: 180px;
  max-width: 75%;
  height: auto;
  display: block;
  margin: 0 auto 12px;
}

.header h1 {
  margin: 8px 0;
  font-size: 27px;
}

.header p {
  margin: 0;
  font-size: 16px;
  color: #ddd;
}

/* MAIN */

.container {
  max-width: 800px;
  margin: auto;
  padding: 18px 16px 40px;
}

/* CARDS */

.card {
  background: white;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 3px 14px rgba(0,0,0,0.08);
}

.chapter {
  font-size: 14px;
  color: #777;
  margin-bottom: 8px;
}

h2 {
  margin: 6px 0 10px;
  font-size: 26px;
}

h3 {
  margin: 0 0 14px;
  font-size: 21px;
}

p {
  line-height: 1.7;
}

.objective {
  padding: 9px 0;
  line-height: 1.5;
}

/* EXAMPLES */

.example {
  background: #f7f7f7;
  border-left: 4px solid #111;
  padding: 14px;
  margin: 12px 0;
  border-radius: 10px;
  line-height: 1.6;
}

.question {
  font-weight: bold;
  margin-bottom: 12px;
  font-size: 17px;
}

/* BUTTONS */

.option {
  display: block;
  width: 100%;
  text-align: left;
  padding: 14px;
  margin: 9px 0;
  border: 1px solid #ddd;
  border-radius: 11px;
  background: white;
  font-size: 16px;
  cursor: pointer;
}

.option:hover {
  background: #f0f0f0;
}

.option.correct {
  background: #dff5df;
  border-color: #2e8b57;
}

.option.wrong {
  background: #ffe0e0;
  border-color: #d33;
}

.option:disabled {
  cursor: default;
}

.btn {
  display: block;
  width: 100%;
  border: none;
  border-radius: 12px;
  padding: 14px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  background: #111;
  color: white;
  margin-top: 12px;
}

.btn:hover {
  opacity: 0.9;
}

.answer {
  display: none;
  margin-top: 12px;
  padding: 12px;
  background: #eaf7ea;
  border-radius: 10px;
}

/* FEEDBACK */

.feedback {
  margin-top: 12px;
  padding: 10px;
  border-radius: 8px;
  font-weight: bold;
}

.feedback.good {
  background: #e5f6e5;
  color: #176b17;
}

.feedback.bad {
  background: #ffe7e7;
  color: #a00000;
}

/* SUCCESS */

.success {
  text-align: center;
  background: #111;
  color: white;
}

.progress {
  height: 12px;
  background: #555;
  border-radius: 10px;
  overflow: hidden;
  margin: 18px 0;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #d4af37;
  transition: width 0.4s;
}

/* LOADING */

.loading {
  text-align: center;
  padding: 40px 10px;
  font-size: 18px;
}

/* ERROR */

.error {
  background: #ffe5e5;
  color: #900;
  padding: 18px;
  border-radius: 12px;
}

/* LIST */

ul {
  padding-left: 24px;
}

li {
  margin: 9px 0;
  line-height: 1.5;
}

/* MOBILE */

@media (max-width: 600px) {

  .header {
    padding: 18px 12px 22px;
  }

  .header img {
    width: 165px;
  }

  .header h1 {
    font-size: 24px;
  }

  .header p {
    font-size: 15px;
  }

  .container {
    padding: 14px 12px 30px;
  }

  .card {
    padding: 17px;
    border-radius: 16px;
  }

  h2 {
    font-size: 23px;
  }

  h3 {
    font-size: 20px;
  }

}

</style>
</head>

<body>

<header class="header">

  <img
    src="./assets/logo/aadya-logo-header-full.png"
    alt="AADYA">

  <h1 id="lessonTitle">AADYA Learning</h1>

  <p>आपका अपना Digital Teacher</p>

</header>


<main class="container">

  <!-- LOADING -->

  <div id="loading" class="card loading">
    📚 Lesson तैयार हो रहा है...
  </div>


  <!-- MAIN CONTENT -->

  <div id="content" style="display:none;">


    <!-- LESSON HEADER -->

    <section class="card">

      <div
        class="chapter"
        id="chapterTitle">
      </div>

      <h2 id="mainTitle"></h2>

      <p id="subtitle"></p>

    </section>


    <!-- OBJECTIVES -->

    <section class="card">

      <h3>🎯 आज हम क्या सीखेंगे?</h3>

      <div id="objectives"></div>

    </section>


    <!-- INTRODUCTION -->

    <section class="card">

      <h3 id="introQuestion"></h3>

      <p id="introExplanation"></p>

    </section>


    <!-- SIMPLE EXPLANATION -->

    <section class="card">

      <h3>💡 आसान भाषा में समझें</h3>

      <div id="explanation"></div>

    </section>


    <!-- EXAMPLES -->

    <section class="card">

      <h3>🔢 उदाहरण देखें</h3>

      <div id="examples"></div>

    </section>


    <!-- TRY YOURSELF -->

    <section class="card">

      <h3>✍️ खुद करके देखें</h3>

      <div id="tryYourself"></div>

    </section>


    <!-- PRACTICE -->

    <section class="card">

      <h3>📝 अभ्यास</h3>

      <div id="practice"></div>

    </section>


    <!-- QUIZ -->

    <section class="card">

      <h3>🧠 Quiz – अपनी समझ जाँचें</h3>

      <div id="quiz"></div>

      <div
        id="quizResult"
        style="margin-top:15px;font-weight:bold;">
      </div>

    </section>


    <!-- ACTIVITY -->

    <section class="card">

      <h3>🌍 अपने आसपास पैटर्न खोजें</h3>

      <p id="activityInstruction"></p>

      <ul id="activityExamples"></ul>

    </section>


    <!-- KEY POINTS -->

    <section class="card">

      <h3>⭐ आज की मुख्य बातें</h3>

      <ul id="keyPoints"></ul>

    </section>


    <!-- COMPLETION -->

    <section class="card success">

      <h2 id="completionMessage"></h2>

      <p id="nextLesson"></p>

      <div class="progress">

        <div
          class="progress-bar"
          id="progressBar">
        </div>

      </div>

      <button
        class="btn"
        onclick="completeLesson()">

        ✅ Lesson पूरा किया

      </button>

    </section>


  </div>


  <!-- ERROR -->

  <div
    id="error"
    style="display:none;">
  </div>


</main>


<script>

let lessonData = null;

let quizScore = 0;

let answeredQuestions = 0;


/* LESSON FILE */

const lessonFile =
  "./content/class6/mathematics/chapter01/lesson01.json";


/* LOAD LESSON */

async function loadLesson() {

  try {

    const response =
      await fetch(lessonFile);

    if (!response.ok) {

      throw new Error(
        "Lesson file नहीं मिला"
      );

    }

    lessonData =
      await response.json();

    renderLesson(lessonData);

    document.getElementById(
      "loading"
    ).style.display = "none";

    document.getElementById(
      "content"
    ).style.display = "block";

  }

  catch (error) {

    document.getElementById(
      "loading"
    ).style.display = "none";

    const errorBox =
      document.getElementById("error");

    errorBox.style.display = "block";

    errorBox.className = "error";

    errorBox.innerHTML =
      "<strong>Lesson लोड नहीं हो पाया।</strong><br><br>" +
      "कृपया page को दोबारा खोलें।";

    console.error(error);

  }

}


/* RENDER LESSON */

function renderLesson(data) {


  /* HEADER */

  document.getElementById(
    "lessonTitle"
  ).textContent =
    data.lesson.title;


  /* CHAPTER */

  document.getElementById(
    "chapterTitle"
  ).textContent =
    "कक्षा " +
    data.class +
    " • " +
    data.subject +
    " • अध्याय " +
    data.chapter.number +
    " : " +
    data.chapter.title;


  document.getElementById(
    "mainTitle"
  ).textContent =
    data.lesson.title;


  document.getElementById(
    "subtitle"
  ).textContent =
    data.lesson.subtitle;


  /* OBJECTIVES */

  const objectives =
    document.getElementById(
      "objectives"
    );

  objectives.innerHTML = "";


  data.learning_objectives.forEach(
    item => {

      const div =
        document.createElement("div");

      div.className =
        "objective";

      div.textContent =
        "✅ " + item;

      objectives.appendChild(div);

    }
  );


  /* INTRODUCTION */

  document.getElementById(
    "introQuestion"
  ).textContent =
    "🤔 " +
    data.introduction.question;


  document.getElementById(
    "introExplanation"
  ).textContent =
    data.introduction.explanation;


  /* SIMPLE EXPLANATION */

  const explanation =
    document.getElementById(
      "explanation"
    );

  explanation.innerHTML = "";


  data.simple_explanation.forEach(
    item => {

      const box =
        document.createElement("div");

      box.className =
        "example";

      box.innerHTML =
        "<strong>" +
        item.title +
        "</strong><br><br>" +
        item.text;

      explanation.appendChild(box);

    }
  );


  /* EXAMPLES */

  const examples =
    document.getElementById(
      "examples"
    );

  examples.innerHTML = "";


  data.examples.forEach(
    item => {

      const box =
        document.createElement("div");

      box.className =
        "example";

      box.innerHTML =
        "<strong>" +
        item.question +
        "</strong><br><br>" +
        "उत्तर: <strong>" +
        item.answer +
        "</strong><br>" +
        item.reason;

      examples.appendChild(box);

    }
  );


  /* TRY YOURSELF */

  const tryBox =
    document.getElementById(
      "tryYourself"
    );

  tryBox.innerHTML = "";


  data.try_yourself.forEach(
    (item, index) => {

      const box =
        document.createElement("div");

      box.className =
        "example";


      box.innerHTML =
        "<strong>" +
        (index + 1) +
        ". " +
        item.question +
        "</strong>" +

        "<button class='btn' " +
        "onclick='showAnswer(this)'>" +
        "उत्तर देखें" +
        "</button>" +

        "<div class='answer'>" +
        "उत्तर: <strong>" +
        item.answer +
        "</strong>" +
        "</div>";


      tryBox.appendChild(box);

    }
  );


  /* PRACTICE */

  const practice =
    document.getElementById(
      "practice"
    );

  practice.innerHTML = "";


  data.practice.forEach(
    (item, index) => {

      const box =
        document.createElement("div");

      box.className =
        "example";


      let html =
        "<div class='question'>" +
        (index + 1) +
        ". " +
        item.question +
        "</div>";


      item.options.forEach(
        option => {

          html +=
            "<button class='option' " +
            "onclick='checkPractice(this)' " +
            "data-option='" +
            escapeAttribute(option) +
            "' " +
            "data-answer='" +
            escapeAttribute(item.answer) +
            "' " +
            "data-explanation='" +
            escapeAttribute(item.explanation) +
            "'>" +
            option +
            "</button>";

        }
      );


      html +=
        "<div class='feedback'></div>";


      box.innerHTML = html;

      practice.appendChild(box);

    }
  );


  /* QUIZ */

  const quiz =
    document.getElementById(
      "quiz"
    );

  quiz.innerHTML = "";

  quizScore = 0;

  answeredQuestions = 0;


  data.quiz.questions.forEach(
    (item, index) => {

      const box =
        document.createElement("div");

      box.className =
        "example";


      let html =
        "<div class='question'>" +
        (index + 1) +
        ". " +
        item.question +
        "</div>";


      item.options.forEach(
        option => {

          html +=
            "<button class='option' " +
            "onclick='checkQuiz(this)' " +
            "data-option='" +
            escapeAttribute(option) +
            "' " +
            "data-answer='" +
            escapeAttribute(item.correct_answer) +
            "' " +
            "data-correct='" +
            escapeAttribute(item.feedback_correct) +
            "' " +
            "data-wrong='" +
            escapeAttribute(item.feedback_wrong) +
            "'>" +
            option +
            "</button>";

        }
      );


      html +=
        "<div class='feedback'></div>";


      box.innerHTML = html;

      quiz.appendChild(box);

    }
  );


  /* ACTIVITY */

  document.getElementById(
    "activityInstruction"
  ).textContent =
    data.real_life_activity.instruction;


  const activityExamples =
    document.getElementById(
      "activityExamples"
    );

  activityExamples.innerHTML = "";


  data.real_life_activity.examples.forEach(
    item => {

      const li =
        document.createElement("li");

      li.textContent = item;

      activityExamples.appendChild(li);

    }
  );


  /* KEY POINTS */

  const keyPoints =
    document.getElementById(
      "keyPoints"
    );

  keyPoints.innerHTML = "";


  data.key_points.forEach(
    item => {

      const li =
        document.createElement("li");

      li.textContent = item;

      keyPoints.appendChild(li);

    }
  );


  /* COMPLETION */

  document.getElementById(
    "completionMessage"
  ).textContent =
    data.completion.message;


  document.getElementById(
    "nextLesson"
  ).textContent =
    "अगला पाठ: " +
    data.completion.next_lesson;

}


/* ESCAPE TEXT */

function escapeAttribute(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/'/g, "&#39;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

}


/* TRY YOURSELF ANSWER */

function showAnswer(button) {

  const answer =
    button.nextElementSibling;

  if (answer) {

    answer.style.display =
      "block";

    button.style.display =
      "none";

  }

}


/* PRACTICE CHECK */

function checkPractice(button) {

  const box =
    button.parentElement;

  const buttons =
    box.querySelectorAll(
      ".option"
    );

  const feedback =
    box.querySelector(
      ".feedback"
    );


  const selected =
    button.getAttribute(
      "data-option"
    );

  const answer =
    button.getAttribute(
      "data-answer"
    );

  const explanation =
    button.getAttribute(
      "data-explanation"
    );


  buttons.forEach(
    btn => {

      btn.disabled = true;

      if (
        btn.getAttribute(
          "data-option"
        ) === answer
      ) {

        btn.classList.add(
          "correct"
        );

      }

    }
  );


  if (selected === answer) {

    button.classList.add(
      "correct"
    );

    feedback.className =
      "feedback good";

    feedback.textContent =
      "✅ सही उत्तर! " +
      explanation;

  }

  else {

    button.classList.add(
      "wrong"
    );

    feedback.className =
      "feedback bad";

    feedback.textContent =
      "❌ सही उत्तर: " +
      answer +
      " — " +
      explanation;

  }

}


/* QUIZ CHECK */

function checkQuiz(button) {

  const box =
    button.parentElement;

  const buttons =
    box.querySelectorAll(
      ".option"
    );

  const feedback =
    box.querySelector(
      ".feedback"
    );


  if (
    box.dataset.answered === "true"
  ) {

    return;

  }


  box.dataset.answered =
    "true";

  answeredQuestions++;


  const selected =
    button.getAttribute(
      "data-option"
    );

  const answer =
    button.getAttribute(
      "data-answer"
    );

  const correctFeedback =
    button.getAttribute(
      "data-correct"
    );

  const wrongFeedback =
    button.getAttribute(
      "data-wrong"
    );


  buttons.forEach(
    btn => {

      btn.disabled = true;

      if (
        btn.getAttribute(
          "data-option"
        ) === answer
      ) {

        btn.classList.add(
          "correct"
        );

      }

    }
  );


  if (selected === answer) {

    quizScore++;

    button.classList.add(
      "correct"
    );

    feedback.className =
      "feedback good";

    feedback.textContent =
      "✅ " +
      correctFeedback;

  }

  else {

    button.classList.add(
      "wrong"
    );

    feedback.className =
      "feedback bad";

    feedback.textContent =
      "❌ " +
      wrongFeedback;

  }


  updateQuizResult();

}


/* QUIZ RESULT */

function updateQuizResult() {

  const result =
    document.getElementById(
      "quizResult"
    );

  const total =
    lessonData.quiz.questions.length;


  if (
    answeredQuestions === total
  ) {

    const percentage =
      Math.round(
        (quizScore / total) * 100
      );


    result.innerHTML =
      "🎉 Quiz पूरा! आपका स्कोर: " +
      quizScore +
      "/" +
      total +
      " (" +
      percentage +
      "%)";


    localStorage.setItem(
      "aadya_last_quiz_score",
      quizScore
    );

  }

  else {

    result.textContent =
      "प्रश्न हल किए: " +
      answeredQuestions +
      "/" +
      total;

  }

}


/* COMPLETE LESSON */

function completeLesson() {

  localStorage.setItem(
    "aadya_last_lesson",
    lessonData.id
  );


  const progressBar =
    document.getElementById(
      "progressBar"
    );


  progressBar.style.width =
    "100%";


  alert(
    "🎉 बहुत बढ़िया!\n\n" +
    "आपने यह Lesson पूरा कर लिया।"
  );

}


/* START */

loadLesson();
<script>

/* ================================
   AADYA PROGRESS SYSTEM
   ================================ */

const PROGRESS_KEY = "aadya_progress_v1";

/* Save completed lesson */
function saveLessonProgress() {

  const progress = JSON.parse(
    localStorage.getItem(PROGRESS_KEY) || "{}"
  );

  progress[lessonFile] = {
    completed: true,
    completedAt: new Date().toISOString()
  };

  localStorage.setItem(
    PROGRESS_KEY,
    JSON.stringify(progress)
  );
}


/* Check whether lesson is already completed */
function isLessonCompleted() {

  const progress = JSON.parse(
    localStorage.getItem(PROGRESS_KEY) || "{}"
  );

  return !!(
    progress[lessonFile] &&
    progress[lessonFile].completed
  );
}


/* Update completion screen */
function updateProgressUI() {

  const bar =
    document.getElementById("progressBar");

  const button =
    document.querySelector(".success .btn");

  if (!bar || !button) return;

  if (isLessonCompleted()) {

    bar.style.width = "100%";

    button.textContent =
      "✅ Lesson पहले ही पूरा किया गया";

    button.disabled = true;

    button.style.opacity = "0.75";

  } else {

    bar.style.width = "0%";

    button.textContent =
      "✅ Lesson पूरा किया";

    button.disabled = false;

    button.style.opacity = "1";
  }
}


/* New completion action */
window.completeLesson = function() {

  saveLessonProgress();

  const bar =
    document.getElementById("progressBar");

  const button =
    document.querySelector(".success .btn");

  if (bar) {
    bar.style.width = "100%";
  }

  if (button) {

    button.textContent =
      "✅ Lesson पूरा किया गया";

    button.disabled = true;

    button.style.opacity = "0.75";
  }

  alert(
    "🎉 बहुत बढ़िया!\n\n" +
    "आपने यह Lesson पूरा कर लिया।\n\n" +
    "आपकी Progress सुरक्षित कर ली गई है।"
  );
};


/* Restore progress whenever page opens */
document.addEventListener(
  "DOMContentLoaded",
  function() {

    setTimeout(
      updateProgressUI,
      500
    );

  }
);

</script>

</body>
</html>
