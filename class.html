<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>AADYA — मेरी कक्षा</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;

  font-family:
    Arial,
    "Noto Sans Devanagari",
    sans-serif;

  background:#f3f7fb;
  color:#172b4d;
}

.top{
  background:
    linear-gradient(
      135deg,
      #111,
      #172b4d,
      #263f68
    );

  color:#fff;

  padding:14px;

  position:sticky;
  top:0;

  z-index:5;
}

.toprow{
  max-width:980px;
  margin:auto;

  display:flex;

  justify-content:space-between;
  align-items:center;

  gap:10px;
}

.brand{
  font-size:24px;
  font-weight:900;
}

.sub{
  font-size:13px;
  color:#dbe3ee;
  margin-top:3px;
}

.btn{
  border:0;
  border-radius:12px;

  padding:10px 13px;

  font-weight:900;

  cursor:pointer;
}

.home{
  background:#fff;
  color:#172b4d;
}

.wrap{
  max-width:980px;
  margin:auto;

  padding:
    15px 12px 45px;
}

.hero,
.card{
  background:#fff;

  border-radius:20px;

  box-shadow:
    0 7px 22px
    rgba(23,43,77,.08);

  border:
    1px solid #e6edf5;
}

.hero{
  overflow:hidden;
  margin-bottom:15px;
}

.banner{
  height:125px;

  background:
    url("./assets/logo/aadya-home-banner.png")
    center/cover;
}

.heroText{
  padding:15px;
}

.hero h1{
  margin:0 0 5px;
  font-size:27px;
}

.muted{
  color:#68768a;
  line-height:1.6;
  font-size:13px;
}

.sectionTitle{
  font-size:19px;
  font-weight:900;

  margin:
    18px 2px 9px;
}

.card{
  padding:16px;
  margin:9px 0;
}

.lessonTitle{
  font-size:18px;
  font-weight:900;
  line-height:1.45;
}

.meta{
  font-size:12px;
  color:#68768a;
  margin-top:4px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;

  margin-top:12px;
}

.primary{
  background:#172b4d;
  color:#fff;
}

.secondary{
  background:#eef5ff;
  color:#20569c;
}

.grid{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:9px;
}

.stat{
  text-align:center;

  padding:14px;

  background:#f8fbff;

  border:
    1px solid #e3edf8;

  border-radius:15px;
}

.numStat{
  font-size:25px;
  font-weight:900;
}

.subject{
  border-left:
    5px solid #2f80ed;
}

.savedItem{
  display:flex;

  gap:9px;

  align-items:center;

  padding:10px 0;

  border-top:
    1px solid #eee;
}

.savedItem:first-child{
  border-top:0;
}

.savedMain{
  flex:1;
}

.remove{
  background:#f1f3f6;
  color:#667085;
}

.small{
  font-size:11px;
  color:#68768a;
}

.empty{
  padding:15px;

  color:#718096;

  background:#f8fafc;

  border-radius:13px;

  line-height:1.6;
}

@media(max-width:600px){

  .grid{
    grid-template-columns:
      repeat(3,1fr);
  }

  .brand{
    font-size:20px;
  }

  .banner{
    height:105px;
  }

  .hero h1{
    font-size:23px;
  }

  .savedItem{
    flex-wrap:wrap;
  }

}

</style>

</head>

<body>

<header class="top">

<div class="toprow">

<div>

<div class="brand">
🏫 मेरी कक्षा
</div>

<div
  class="sub"
  id="topSub"
>
आपकी अपनी learning space
</div>

</div>

<button
  class="btn home"
  onclick="location.href='./index.html'"
>
⌂ होम
</button>

</div>

</header>


<main class="wrap">


<section class="hero">

<div class="banner"></div>

<div class="heroText">

<h1 id="greeting">
नमस्ते! 👋
</h1>

<div
  class="muted"
  id="classLine"
>
</div>

</div>

</section>


<div
  id="loading"
  class="card"
>
📚 आपकी कक्षा तैयार हो रही है…
</div>


<div
  id="app"
  style="display:none"
>


<div class="sectionTitle">
▶️ जहाँ छोड़ा था, वहीं से शुरू करें
</div>

<section
  class="card"
  id="resume"
>
</section>


<div class="sectionTitle">
📊 मेरी सीखने की स्थिति
</div>

<section class="card">

<div
  class="grid"
  id="stats"
>
</div>

</section>


<div class="sectionTitle">
📚 मेरे विषय
</div>

<div id="subjects">
</div>


<div class="sectionTitle">
🏆 उपलब्धियाँ
</div>

<section
  class="card"
  id="achievements"
>
</section>


<div class="sectionTitle">
🔖 Saved Lessons
</div>

<section
  class="card"
  id="saved"
>
</section>


</div>

</main>


<script src="./js/aadya-core.js"></script>


<script>

"use strict";


let curriculum =
  null;

let lessons =
  [];

let progress =
  {};

let profile =
  {};


const $ =
  id =>
    document.getElementById(id);


const esc =
  AADYA.esc;


/* =====================================================
   OPEN LESSON
===================================================== */

function openLesson(
  file
){

  AADYA.goLesson(
    file
  );

}

window.openLesson =
  openLesson;


/* =====================================================
   REMOVE SAVED
===================================================== */

window.removeSaved =
  function(file){

    const saved =
      AADYA
        .saved()
        .filter(
          function(item){

            return (
              item.file !==
              file
            );

          }
        );


    AADYA.write(
      AADYA.KEYS.SAVED,
      saved
    );


    render();

  };


/* =====================================================
   RENDER
===================================================== */

function render(){

  const resume =
    AADYA.resumeLesson(
      lessons,
      progress
    );


  /* Resume */

  if(resume){

    $("resume").innerHTML =

      '<div class="lessonTitle">' +

      esc(
        resume.title
      ) +

      '</div>' +

      '<div class="meta">' +

      esc(
        resume.subjectName
      ) +

      ' · अध्याय ' +

      esc(
        resume.chapterNumber
      ) +

      ' — ' +

      esc(
        resume.chapterTitle
      ) +

      '</div>' +

      '<div class="actions">' +

      '<button ' +
      'class="btn primary" ' +
      'id="resumeBtn">' +

      (
        AADYA.isDone(
          resume.file,
          progress
        )
          ?
        "🔁 फिर से पढ़ें"
          :
        "▶️ जारी रखें"
      ) +

      '</button>' +

      '<button ' +
      'class="btn secondary" ' +
      'id="subjectsBtn">' +

      '📚 सभी विषय' +

      '</button>' +

      '</div>';


    $("resumeBtn")
      .onclick =
      function(){

        openLesson(
          resume.file
        );

      };


    $("subjectsBtn")
      .onclick =
      function(){

        location.href =
          "./subjects.html?class=" +
          profile.class;

      };

  }
  else{

    $("resume").innerHTML =
      '<div class="empty">' +
      'अभी कोई Lesson उपलब्ध नहीं है।' +
      '</div>';

  }


  /* =================================================
     TOTAL STATS
  ================================================= */

  const done =
    lessons.filter(
      function(lesson){

        return AADYA.isDone(
          lesson.file,
          progress
        );

      }
    ).length;


  const total =
    lessons.length;


  const percentage =
    total
      ? Math.round(
          done /
          total *
          100
        )
      : 0;


  $("stats").innerHTML =

    '<div class="stat">' +
    '<div class="numStat">' +
    done +
    '</div>' +
    '<div>पूरे Lesson</div>' +
    '</div>' +

    '<div class="stat">' +
    '<div class="numStat">' +
    total +
    '</div>' +
    '<div>कुल Lesson</div>' +
    '</div>' +

    '<div class="stat">' +
    '<div class="numStat">' +
    percentage +
    '%</div>' +
    '<div>Progress</div>' +
    '</div>';


  /* =================================================
     SUBJECTS
  ================================================= */

  const classData =
    AADYA.classData(
      curriculum,
      profile.class
    );


  let subjectHTML =
    "";


  Object.entries(
    classData?.subjects || {}
  ).forEach(
    function(entry){

      const key =
        entry[0];

      const subject =
        entry[1];


      const subjectLessons =
        AADYA.buildLessons(

          {
            classes: {

              [
                "class" +
                profile.class
              ]: {

                subjects: {

                  [key]:
                    subject

                }

              }

            }

          },

          Number(
            profile.class
          )

        );


      const subjectDone =
        subjectLessons.filter(
          function(item){

            return AADYA.isDone(
              item.file,
              progress
            );

          }
        ).length;


      subjectHTML +=

        '<section class="card subject">' +

        '<div class="lessonTitle">' +

        AADYA.icon(key) +

        ' ' +

        esc(
          subject.name ||
          key
        ) +

        '</div>' +

        '<div class="meta">' +

        subjectDone +

        ' / ' +

        subjectLessons.length +

        ' Lessons पूरे · ' +

        (
          subject.chapters ||
          []
        ).length +

        ' अध्याय' +

        '</div>' +

        '<div class="actions">' +

        '<button ' +
        'class="btn secondary subjectBtn" ' +
        'data-subject="' +
        esc(key) +
        '">' +

        'विषय खोलें →' +

        '</button>' +

        '</div>' +

        '</section>';

    }
  );


  $("subjects").innerHTML =
    subjectHTML ||

    '<div class="empty">' +
    'अभी कोई विषय उपलब्ध नहीं है।' +
    '</div>';


  document
    .querySelectorAll(
      ".subjectBtn"
    )
    .forEach(
      function(button){

        button.onclick =
          function(){

            location.href =
              "./subjects.html?class=" +
              profile.class +
              "&subject=" +
              encodeURIComponent(
                button.dataset.subject
              );

          };

      }
    );


  /* =================================================
     ACHIEVEMENTS
  ================================================= */

  const badges =
    [];


  if(done >= 1)
    badges.push(
      "🌱 पहला कदम"
    );


  if(done >= 10)
    badges.push(
      "🔥 10 Lessons"
    );


  if(done >= 25)
    badges.push(
      "🚀 25 Lessons"
    );


  if(
    done === total &&
    done
  ){

    badges.push(
      "🏆 Curriculum Complete"
    );

  }


  $("achievements").innerHTML =

    badges.length

      ?

    '<div class="grid">' +

    badges
      .map(
        function(b){

          return (
            '<div class="stat">' +
            b +
            '</div>'
          );

        }
      )
      .join("") +

    '</div>'

      :

    '<div class="empty">' +
    'पहला Lesson पूरा करते ही ' +
    'आपका पहला badge यहाँ दिखाई देगा।' +
    '</div>';


  /* =================================================
     SAVED LESSONS
  ================================================= */

  const saved =
    AADYA.saved();


  $("saved").innerHTML =

    saved.length

      ?

    saved
      .slice(0,10)
      .map(
        function(item){

          return (

            '<div class="savedItem">' +

            '<div class="savedMain">' +

            '<b>' +

            esc(
              item.title ||
              "Lesson"
            ) +

            '</b>' +

            '<div class="small">' +

            esc(
              item.subject ||
              ""
            ) +

            ' · ' +

            esc(
              item.chapterTitle ||
              ""
            ) +

            '</div>' +

            '</div>' +

            '<button ' +
            'class="btn remove" ' +
            'onclick="removeSaved(' +
            JSON.stringify(
              item.file
            ) +
            ')">' +

            'हटाएँ' +

            '</button>' +

            '<button ' +
            'class="btn primary" ' +
            'onclick="openLesson(' +
            JSON.stringify(
              item.file
            ) +
            ')">' +

            'खोलें' +

            '</button>' +

            '</div>'

          );

        }
      )
      .join("")

      :

    '<div class="empty">' +
    'अभी कोई Saved Lesson नहीं है।' +
    '</div>';

}


/* =====================================================
   INIT
===================================================== */

async function init(){

  profile =
    AADYA.profile();


  if(
    !profile.class
  ){

    location.href =
      "./profile.html";

    return;

  }


  try{

    curriculum =
      await AADYA.loadCurriculum(
        Number(
          profile.class
        )
      );


    lessons =
      AADYA.buildLessons(
        curriculum,
        Number(
          profile.class
        )
      );


    progress =
      AADYA.progress();


    $("greeting")
      .textContent =
      "नमस्ते, " +
      (
        profile.name ||
        "विद्यार्थी"
      ) +
      "! 👋";


    $("classLine")
      .textContent =
      "कक्षा " +
      profile.class +
      " में आपकी अपनी Learning Space";


    $("topSub")
      .textContent =
      "कक्षा " +
      profile.class +
      " · आज क्या सीखें?";


    $("loading")
      .style.display =
      "none";


    $("app")
      .style.display =
      "block";


    render();

  }
  catch(error){

    console.error(
      error
    );


    $("loading")
      .innerHTML =
      "⚠️ Curriculum लोड नहीं हो पाया।";

  }

}


document.addEventListener(
  "DOMContentLoaded",
  init
);

</script>

</body>

</html>
