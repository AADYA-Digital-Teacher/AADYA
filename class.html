<!DOCTYPE html>
<html lang="hi">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#111111"
  >

  <title>AADYA — मेरी कक्षा</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Arial,
        "Noto Sans Devanagari",
        sans-serif;
      background: #f5f6f8;
      color: #1d1d1f;
    }

    .top {
      background: #111;
      color: #fff;
      padding: 18px 16px 20px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: .2px;
    }

    .sub {
      font-size: 13px;
      opacity: .78;
      margin-top: 4px;
    }

    .home {
      border: 0;
      background: #fff;
      color: #111;
      border-radius: 10px;
      padding: 9px 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .wrap {
      max-width: 900px;
      margin: auto;
      padding: 18px 14px 45px;
    }

    .welcome {
      background: #fff;
      border-radius: 18px;
      padding: 18px;
      box-shadow:
        0 5px 18px rgba(0,0,0,.07);
      margin-bottom: 18px;
    }

    .welcome h1 {
      font-size: 22px;
      margin: 0 0 7px;
    }

    .welcome p {
      margin: 0;
      color: #666;
      font-size: 14px;
    }

    .subject {
      background: #111;
      color: #fff;
      border-radius: 16px;
      padding: 15px 16px;
      margin: 18px 0 12px;
      font-size: 19px;
      font-weight: 800;
    }

    .chapter {
      background: #fff;
      border-radius: 16px;
      margin: 12px 0;
      box-shadow:
        0 4px 14px rgba(0,0,0,.06);
      overflow: hidden;
    }

    .chapter-head {
      padding: 16px;
      border-bottom: 1px solid #eee;
    }

    .chapter-title {
      font-size: 17px;
      font-weight: 800;
      line-height: 1.5;
    }

    .badge {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 8px;
      border-radius: 8px;
      background: #f0f0f0;
      color: #555;
      font-size: 11px;
      font-weight: 700;
    }

    .lessons {
      padding: 7px;
    }

    .lesson {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 10px;
      border-radius: 12px;
      cursor: pointer;
      transition: background .15s;
    }

    .lesson:hover {
      background: #f5f5f5;
    }

    .lesson:active {
      background: #e9e9e9;
    }

    .num {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      background: #111;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      flex: none;
      font-size: 14px;
    }

    .lesson-title {
      font-size: 14px;
      line-height: 1.5;
      font-weight: 600;
      flex: 1;
    }

    .arrow {
      font-size: 22px;
      color: #777;
      flex: none;
    }

    .empty {
      padding: 16px;
      color: #777;
      font-size: 14px;
      line-height: 1.6;
    }

    .loading,
    .error {
      background: #fff;
      border-radius: 16px;
      padding: 22px;
      text-align: center;
      box-shadow:
        0 4px 14px rgba(0,0,0,.06);
      line-height: 1.6;
    }

    .error {
      color: #a40000;
    }

    .footer-note {
      text-align: center;
      color: #888;
      font-size: 12px;
      margin-top: 25px;
      line-height: 1.6;
    }

  </style>

</head>


<body>


  <!-- ==============================
       HEADER
  =============================== -->

  <header class="top">

    <div class="top-row">

      <div>

        <div class="brand">
          AADYA Digital Teacher
        </div>

        <div class="sub">
          मेरी कक्षा
        </div>

      </div>


      <button
        class="home"
        onclick="goHome()"
      >
        ⌂ होम
      </button>

    </div>

  </header>



  <!-- ==============================
       MAIN
  =============================== -->

  <main class="wrap">


    <section class="welcome">

      <h1 id="studentWelcome">
        नमस्ते! 👋
      </h1>

      <p id="classText">
        आपकी Learning Journey यहाँ से शुरू होती है।
      </p>

    </section>



    <div
      id="curriculumBox"
      class="loading"
    >
      📚 आपका Curriculum लोड हो रहा है...
    </div>


    <div class="footer-note">

      AADYA — आपका अपना Digital Teacher<br>

      हर बच्चे तक, हर जगह, हर समय —
      सीखने की आज़ादी।

    </div>


  </main>



  <!-- ==============================
       JAVASCRIPT
  =============================== -->

  <script>


    /* --------------------------------
       PROFILE
    -------------------------------- */

    const PROFILE_KEY =
      "aadya_student_profile_v1";



    /* --------------------------------
       HOME
    -------------------------------- */

    function goHome() {

      window.location.href =
        "./index.html";

    }



    /* --------------------------------
       LOAD STUDENT
    -------------------------------- */

    function loadStudent() {

      try {

        const saved =
          localStorage.getItem(
            PROFILE_KEY
          );


        if (!saved) {

          return "6";

        }


        const profile =
          JSON.parse(saved);


        const name =
          profile.name ||
          profile.studentName ||
          "";


        const cls =
          profile.class ||
          profile.studentClass ||
          profile.selectedClass ||
          "6";


        const welcome =
          document.getElementById(
            "studentWelcome"
          );


        const classText =
          document.getElementById(
            "classText"
          );


        if (name) {

          welcome.textContent =
            "नमस्ते, " +
            name +
            "! 👋";

        }


        classText.textContent =
          "कक्षा " +
          cls +
          " • आपकी Learning Journey में स्वागत है";


        return String(cls);

      }


      catch (error) {

        console.error(
          "Profile error:",
          error
        );

        return "6";

      }

    }



    /* --------------------------------
       OPEN LESSON
    -------------------------------- */

    function openLesson(file) {

      if (!file) {

        return;

      }


      window.location.href =
        "./learning.html?lesson=" +
        encodeURIComponent(file);

    }



    /* --------------------------------
       ESCAPE HTML
       सुरक्षा के लिए
    -------------------------------- */

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }



    /* --------------------------------
       RENDER CURRICULUM
    -------------------------------- */

    function renderCurriculum(
      data,
      classNumber
    ) {


      const box =
        document.getElementById(
          "curriculumBox"
        );


      const classKey =
        "class" +
        classNumber;


      const classData =
        data &&
        data.classes
          ? data.classes[classKey]
          : null;


      if (!classData) {

        box.className =
          "error";


        box.innerHTML =
          "⚠️ कक्षा " +
          escapeHtml(classNumber) +
          " का Curriculum नहीं मिला।";


        return;

      }



      const subjects =
        classData.subjects || {};


      let html = "";


      let subjectCount = 0;



      /* --------------------------------
         SUBJECTS
      -------------------------------- */

      Object.keys(subjects)
        .forEach(
          function(subjectKey) {


            const subject =
              subjects[subjectKey] || {};


            const chapters =
              Array.isArray(
                subject.chapters
              )
                ? subject.chapters
                : [];


            subjectCount++;



            html +=
              '<div class="subject">' +
              "📘 " +
              escapeHtml(
                subject.name ||
                subjectKey
              ) +
              "</div>";



            /* --------------------------------
               NO CHAPTER
            -------------------------------- */

            if (!chapters.length) {

              html +=
                '<div class="empty">' +
                "अभी इस विषय के पाठ " +
                "तैयार किए जा रहे हैं।" +
                "</div>";

              return;

            }



            /* --------------------------------
               CHAPTERS
            -------------------------------- */

            chapters.forEach(
              function(chapter) {


                html +=
                  '<section class="chapter">';



                /* CHAPTER HEADER */

                html +=
                  '<div class="chapter-head">';


                html +=
                  '<div class="chapter-title">' +
                  "अध्याय " +
                  escapeHtml(
                    chapter.number ??
                    ""
                  ) +
                  " — " +
                  escapeHtml(
                    chapter.title ||
                    "अध्याय"
                  ) +
                  "</div>";



                /* SOURCE BADGE */

                if (chapter.source) {

                  const badgeText =
                    chapter.source ===
                    "textbook"

                      ? "📖 पाठ्यपुस्तक आधारित"

                      : "✨ AADYA विशेष पाठ";


                  html +=
                    '<span class="badge">' +
                    badgeText +
                    "</span>";

                }


                html +=
                  "</div>";



                /* LESSON CONTAINER */

                html +=
                  '<div class="lessons">';



                const lessons =
                  Array.isArray(
                    chapter.lessons
                  )
                    ? chapter.lessons
                    : [];



                /* --------------------------------
                   EMPTY LESSONS
                -------------------------------- */

                if (!lessons.length) {

                  html +=
                    '<div class="empty">' +
                    "इस अध्याय के पाठ " +
                    "जल्द उपलब्ध होंगे।" +
                    "</div>";

                }



                /* --------------------------------
                   LESSONS
                -------------------------------- */

                else {

                  lessons.forEach(
                    function(lesson) {


                      const file =
                        lesson.file ||
                        "";


                      const title =
                        lesson.title ||
                        (
                          "पाठ " +
                          (
                            lesson.number ??
                            ""
                          )
                        );


                      const number =
                        lesson.number ??
                        "";



                      html +=
                        '<div class="lesson" ' +
                        'data-file="' +
                        escapeHtml(file) +
                        '">';



                      html +=
                        '<div class="num">' +
                        escapeHtml(number) +
                        "</div>";



                      html +=
                        '<div class="lesson-title">' +
                        escapeHtml(title) +
                        "</div>";



                      html +=
                        '<div class="arrow">' +
                        "›" +
                        "</div>";


                      html +=
                        "</div>";

                    }
                  );

                }



                html +=
                  "</div>";


                html +=
                  "</section>";

              }
            );

          }
        );



      /* --------------------------------
         NO SUBJECT
      -------------------------------- */

      if (!subjectCount) {

        box.className =
          "error";


        box.textContent =
          "⚠️ इस कक्षा का Curriculum " +
          "अभी उपलब्ध नहीं है।";


        return;

      }



      /* --------------------------------
         DISPLAY
      -------------------------------- */

      box.className = "";

      box.innerHTML =
        html;



      /* --------------------------------
         LESSON CLICK EVENTS
      -------------------------------- */

      const lessonElements =
        box.querySelectorAll(
          ".lesson"
        );


      lessonElements.forEach(
        function(element) {


          element.addEventListener(
            "click",
            function() {


              const file =
                element.getAttribute(
                  "data-file"
                );


              openLesson(file);

            }
          );

        }
      );

    }



    /* --------------------------------
       LOAD CURRICULUM
    -------------------------------- */

    async function loadCurriculum() {


      const box =
        document.getElementById(
          "curriculumBox"
        );


      try {


        /* STUDENT CLASS */

        const cls =
          loadStudent() ||
          "6";



        /* CURRICULUM FILE */

        const url =
          "./data/curriculum.json?v=" +
          Date.now();



        /* FETCH */

        const response =
          await fetch(
            url,
            {
              cache: "no-store"
            }
          );



        /* HTTP ERROR */

        if (!response.ok) {

          throw new Error(
            "HTTP " +
            response.status +
            " — curriculum.json नहीं मिला"
          );

        }



        /* JSON */

        const data =
          await response.json();



        /* RENDER */

        renderCurriculum(
          data,
          cls
        );

      }


      catch (error) {


        console.error(
          "Curriculum error:",
          error
        );


        box.className =
          "error";


        box.innerHTML =
          "⚠️ Curriculum लोड नहीं हो पाया।" +
          "<br>" +
          "<small>" +
          "कृपया Internet चालू करके " +
          "पेज Refresh करें।" +
          "</small>";

      }

    }



    /* --------------------------------
       START AADYA CLASS PAGE
       यही हिस्सा पिछली बार छूट गया था
    -------------------------------- */

    document.addEventListener(
      "DOMContentLoaded",
      function() {


        loadStudent();


        loadCurriculum();


      }
    );


  </script>


</body>

</html>
