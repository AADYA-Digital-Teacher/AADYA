<!DOCTYPE html>
<html lang="hi">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"

  >

  <meta
    name="theme-color"

  >

  <title>AADYA — मेरी कक्षा</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Arial,
        "Noto Sans Devanagari",
        sans-serif;
      background: #f5f6f8;
      color: #1d1d1f;
    }

      background: #111;
      color: #fff;
      padding: 18px 16px 20px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: .2px;
    }

    .sub {
      font-size: 13px;
      opacity: .78;
      margin-top: 4px;
    }

    .home {
      border: 0;
      background: #fff;
      color: #111;
      border-radius: 10px;
      padding: 9px 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .wrap {
      max-width: 900px;
      margin: auto;
      padding: 18px 14px 45px;
    }

    .welcome {
      background: #fff;
      border-radius: 18px;
      padding: 18px;

      margin: 0 0 7px;
    }

    .welcome p {
      margin: 0;
      color: #666;
      font-size: 14px;
    }

    .subject {
      background: #111;
      color: #fff;
      border-radius: 16px;
      padding: 15px 16px;
      margin: 18px 0 12px;
      font-size: 19px;

    }

    .chapter {

      border-radius: 16px;
      margin: 12px 0;
      box-shadow:
        0 4px 14px rgba(0,0,0,.06);
      overflow: hidden;
    }

    .chapter-head {
      padding: 16px;
      border-bottom: 1px solid #eee;
    }

    .chapter-title {
      font-size: 17px;
      font-weight: 800;
      line-height: 1.5;
    }

    .badge {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 8px;
      border-radius: 8px;
      background: #f0f0f0;
      color: #555;
      font-size: 11px;
      font-weight: 700;
    }

    .lessons {
      padding: 7px;
    }

    .lesson {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 10px;
      border-radius: 12px;
      cursor: pointer;
      transition: background .15s;
    }

    .lesson:hover {
      background: #f5f5f5;
    }

    .lesson:active {
      background: #e9e9e9;
    }

    .num {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      background: #111;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      flex: none;
      font-size: 14px;
    }

    .lesson-title {
      font-size: 14px;
      line-height: 1.5;
      font-weight: 600;
      flex: 1;
    }

    .arrow {
      font-size: 22px;
      color: #777;
      flex: none;
    }

    .empty {
      padding: 16px;
      color: #777;
      font-size: 14px;
      line-height: 1.6;
    }

    .loading,
    .error {
      background: #fff;
      border-radius: 16px;
      padding: 22px;
      text-align: center;
      box-shadow:
        0 4px 14px rgba(0,0,0,.06);
      line-height: 1.6;
    }

    .error {
      color: #a40000;
    }

    .footer-note {
      text-align: center;
      color: #888;
      font-size: 12px;
      margin-top: 25px;
      line-height: 1.6;

/* =========================================================
   AADYA — MY CLASS
   PREMIUM COLORFUL LEARNING JOURNEY
   CSS ONLY
   CONTENT + JAVASCRIPT + LESSON LINKS UNTOUCHED
========================================================= */


/* ---------------------------------------------------------
   DESIGN VARIABLES
--------------------------------------------------------- */

:root {
  --aadya-navy: #172b4d;
  --aadya-blue: #2f80ed;
  --aadya-sky: #56ccf2;
  --aadya-purple: #7b61ff;
  --aadya-pink: #ff6b9d;
  --aadya-yellow: #f7c928;
  --aadya-orange: #f2994a;
  --aadya-green: #27ae60;

  --page-bg: #f3f7fb;
  --card-bg: #ffffff;

  --shadow-soft:
    0 8px 25px rgba(23,43,77,.08);

  --shadow-card:
    0 10px 28px rgba(23,43,77,.10);
}


/* ---------------------------------------------------------
   PAGE
--------------------------------------------------------- */

body {
  background:
    radial-gradient(
      circle at 10% 0%,
      rgba(86,204,242,.12),
      transparent 28%
    ),
    radial-gradient(
      circle at 90% 15%,
      rgba(123,97,255,.10),
      transparent 30%
    ),
    var(--page-bg) !important;

  color: #172b4d !important;

  overflow-x: hidden;
}


/* ---------------------------------------------------------
   TOP HEADER
--------------------------------------------------------- */

.top {
  background:
    linear-gradient(
      135deg,
      #111111 0%,
      #172b4d 58%,
      #243b63 100%
    ) !important;

  padding:
    16px
    max(16px, env(safe-area-inset-right))
    18px
    max(16px, env(safe-area-inset-left))
    !important;

  box-shadow:
    0 5px 22px rgba(0,0,0,.20);

  border-bottom:
    1px solid rgba(255,255,255,.08);

  position: sticky;
  top: 0;
  z-index: 50;
}


/* ---------------------------------------------------------
   HEADER BRAND
--------------------------------------------------------- */

.brand {
  font-size:
    clamp(20px, 5.5vw, 27px) !important;

  font-weight: 900 !important;

  letter-spacing:
    -.3px !important;

  line-height: 1.15;

  color: #ffffff !important;
}

.sub {
  font-size:
    13px !important;

  margin-top:
    5px !important;

  color:
    rgba(255,255,255,.72) !important;
}


/* ---------------------------------------------------------
   HOME BUTTON
--------------------------------------------------------- */

.home {
  min-height: 46px !important;

  padding:
    9px 15px !important;

  border-radius:
    14px !important;

  background:
    linear-gradient(
      135deg,
      #ffffff,
      #f5f8ff
    ) !important;

  color:
    #172b4d !important;

  font-size:
    14px !important;

  font-weight:
    900 !important;

  box-shadow:
    0 5px 15px rgba(0,0,0,.18);

  transition:
    transform .15s ease,
    box-shadow .15s ease;
}

.home:active {
  transform:
    scale(.96);

  box-shadow:
    0 3px 9px rgba(0,0,0,.15);
}


/* ---------------------------------------------------------
   MAIN WRAPPER
--------------------------------------------------------- */

.wrap {
  width:
    min(100%, 980px) !important;

  padding:
    16px 14px 50px !important;
}


/* ---------------------------------------------------------
   WELCOME / AADYA BANNER
--------------------------------------------------------- */

.welcome {
  position: relative;

  padding:
    0 !important;

  overflow:
    hidden !important;

  border-radius:
    24px !important;

  background:
    #ffffff !important;

  box-shadow:
    var(--shadow-card) !important;

  margin-bottom:
    22px !important;

  border:
    1px solid rgba(23,43,77,.06);

  isolation: isolate;
}


/* Colorful AADYA banner */

.welcome::before {
  content: "";

  display:
    block;

  width:
    100%;

  aspect-ratio:
    3 / 1;

  min-height:
    105px;

  background-image:
    url("./assets/logo/aadya-home-banner.png");

  background-size:
    cover;

  background-position:
    center;

  background-repeat:
    no-repeat;
}


/* Soft decorative glow */

.welcome::after {
  content: "";

  position: absolute;

  width: 170px;
  height: 170px;

  right: -75px;
  top: -70px;

  border-radius:
    50%;

  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.38),
      transparent 70%
    );

  pointer-events:
    none;
}


/* ---------------------------------------------------------
   WELCOME TEXT
--------------------------------------------------------- */

.welcome h1 {
  position: relative;

  margin:
    0 !important;

  padding:
    18px 18px 5px !important;

  font-size:
    clamp(23px, 6vw, 31px) !important;

  line-height:
    1.25 !important;

  font-weight:
    900 !important;

  color:
    var(--aadya-navy) !important;
}

.welcome p {
  position: relative;

  margin:
    0 !important;

  padding:
    0 18px 19px !important;

  font-size:
    clamp(13px, 3.8vw, 16px) !important;

  line-height:
    1.55 !important;

  color:
    #667085 !important;

  font-weight:
    600;
}


/* ---------------------------------------------------------
   CURRICULUM CONTAINER
--------------------------------------------------------- */

#curriculumBox {
  width:
    100%;

  background:
    transparent !important;

  box-shadow:
    none !important;

  padding:
    0 !important;

  border-radius:
    0 !important;
}


/* ---------------------------------------------------------
   SUBJECT CARD
   Works automatically for ANY future subject
--------------------------------------------------------- */

.subject {
  position: relative;

  margin:
    24px 0 14px !important;

  padding:
    18px 20px !important;

  min-height:
    68px;

  display:
    flex;

  align-items:
    center;

  border-radius:
    20px !important;

  background:
    linear-gradient(
      135deg,
      #172b4d 0%,
      #28558e 55%,
      #2f80ed 100%
    ) !important;

  color:
    #ffffff !important;

  font-size:
    clamp(19px, 5vw, 24px) !important;

  font-weight:
    900 !important;

  letter-spacing:
    .1px;

  box-shadow:
    0 10px 25px rgba(23,43,77,.20) !important;

  overflow:
    hidden;

  border:
    1px solid rgba(255,255,255,.10);
}


/* Decorative shine */

.subject::after {
  content: "";

  position: absolute;

  width:
    120px;

  height:
    120px;

  right:
    -45px;

  top:
    -55px;

  border-radius:
    50%;

  background:
    rgba(255,255,255,.13);

  pointer-events:
    none;
}


/* ---------------------------------------------------------
   CHAPTER CARD
   Works automatically for every future chapter
--------------------------------------------------------- */

.chapter {
  position: relative;

  background:
    rgba(255,255,255,.98) !important;

  border-radius:
    20px !important;

  margin:
    12px 0 !important;

  overflow:
    hidden !important;

  border:
    1px solid rgba(23,43,77,.07);

  box-shadow:
    var(--shadow-soft) !important;

  transition:
    transform .18s ease,
    box-shadow .18s ease;
}


/* Tiny colored accent */

.chapter::before {
  content: "";

  position: absolute;

  left:
    0;

  top:
    0;

  bottom:
    0;

  width:
    5px;

  background:
    linear-gradient(
      180deg,
      #56ccf2,
      #7b61ff,
      #ff6b9d
    );
}


/* Desktop hover only */

@media (hover: hover) {

  .chapter:hover {
    transform:
      translateY(-2px);

    box-shadow:
      0 14px 30px rgba(23,43,77,.12) !important;
  }

}


/* ---------------------------------------------------------
   DIFFERENT CHAPTER ACCENT COLORS
   Automatically cycles for future chapters
--------------------------------------------------------- */

.chapter:nth-of-type(6n + 1)::before {
  background:
    linear-gradient(
      180deg,
      #56ccf2,
      #2f80ed
    );
}

.chapter:nth-of-type(6n + 2)::before {
  background:
    linear-gradient(
      180deg,
      #f7c928,
      #f2994a
    );
}

.chapter:nth-of-type(6n + 3)::before {
  background:
    linear-gradient(
      180deg,
      #27ae60,
      #6fcf97
    );
}

.chapter:nth-of-type(6n + 4)::before {
  background:
    linear-gradient(
      180deg,
      #ff6b9d,
      #eb5757
    );
}

.chapter:nth-of-type(6n + 5)::before {
  background:
    linear-gradient(
      180deg,
      #7b61ff,
      #9b51e0
    );
}

.chapter:nth-of-type(6n + 6)::before {
  background:
    linear-gradient(
      180deg,
      #00b8a9,
      #2f80ed
    );
}


/* ---------------------------------------------------------
   CHAPTER HEADER
--------------------------------------------------------- */

.chapter-head {
  padding:
    18px 17px 15px 21px !important;

  border-bottom:
    1px solid #edf0f5 !important;

  background:
    linear-gradient(
      180deg,
      #ffffff,
      #fbfdff
    );
}

.chapter-title {
  font-size:
    clamp(17px, 4.7vw, 21px) !important;

  line-height:
    1.5 !important;

  font-weight:
    900 !important;

  color:
    #172b4d !important;

  overflow-wrap:
    anywhere;
}


/* ---------------------------------------------------------
   SOURCE BADGE
--------------------------------------------------------- */

.badge {
  display:
    inline-flex !important;

  align-items:
    center;

  margin-top:
    10px !important;

  padding:
    6px 10px !important;

  border-radius:
    999px !important;

  background:
    linear-gradient(
      135deg,
      #eef5ff,
      #f5f1ff
    ) !important;

  color:
    #53627a !important;

  font-size:
    11px !important;

  font-weight:
    800 !important;

  border:
    1px solid #e1e8f2;
}


/* ---------------------------------------------------------
   LESSON AREA
--------------------------------------------------------- */

.lessons {
  padding:
    7px !important;

  background:
    #ffffff;
}


/* ---------------------------------------------------------
   LESSON TILE
   Works automatically for every lesson added later
--------------------------------------------------------- */

.lesson {
  position: relative;

  display:
    flex !important;

  align-items:
    center !important;

  gap:
    12px !important;

  min-height:
    62px;

  padding:
    10px 10px !important;

  margin:
    2px 0;

  border-radius:
    15px !important;

  cursor:
    pointer;

  background:
    #ffffff;

  transition:
    transform .14s ease,
    background .14s ease,
    box-shadow .14s ease;
}


/* subtle separator */

.lesson + .lesson {
  border-top:
    1px solid #f1f3f6;
}


/* Touch feedback */

.lesson:active {
  transform:
    scale(.985);

  background:
    #f5f9ff !important;

  box-shadow:
    0 3px 10px rgba(47,128,237,.08);
}


/* Desktop hover */

@media (hover: hover) {

  .lesson:hover {
    background:
      linear-gradient(
        90deg,
        #f7fbff,
        #ffffff
      ) !important;

    transform:
      translateX(2px);
  }

}


/* ---------------------------------------------------------
   LESSON NUMBER CIRCLE
--------------------------------------------------------- */

.num {
  width:
    42px !important;

  height:
    42px !important;

  min-width:
    42px !important;

  border-radius:
    14px !important;

  display:
    flex !important;

  align-items:
    center;

  justify-content:
    center;

  background:
    linear-gradient(
      135deg,
      #172b4d,
      #2f80ed
    ) !important;

  color:
    #ffffff !important;

  font-size:
    15px !important;

  font-weight:
    900 !important;

  box-shadow:
    0 4px 10px rgba(47,128,237,.18);
}


/* ---------------------------------------------------------
   LESSON NUMBER COLOR CYCLE
--------------------------------------------------------- */

.lesson:nth-child(4n + 1) .num {
  background:
    linear-gradient(
      135deg,
      #2f80ed,
      #56ccf2
    ) !important;
}

.lesson:nth-child(4n + 2) .num {
  background:
    linear-gradient(
      135deg,
      #f2994a,
      #f7c928
    ) !important;
}

.lesson:nth-child(4n + 3) .num {
  background:
    linear-gradient(
      135deg,
      #27ae60,
      #6fcf97
    ) !important;
}

.lesson:nth-child(4n + 4) .num {
  background:
    linear-gradient(
      135deg,
      #7b61ff,
      #ff6b9d
    ) !important;
}


/* ---------------------------------------------------------
   LESSON TITLE
--------------------------------------------------------- */

.lesson-title {
  font-size:
    clamp(14px, 3.9vw, 16px) !important;

  line-height:
    1.55 !important;

  font-weight:
    700 !important;

  color:
    #202b3c !important;

  flex:
    1;

  min-width:
    0;

  overflow-wrap:
    anywhere;
}


/* ---------------------------------------------------------
   LESSON ARROW
--------------------------------------------------------- */

.arrow {
  flex:
    none !important;

  width:
    28px;

  height:
    28px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  border-radius:
    50%;

  background:
    #f1f5fa;

  color:
    #4b6079 !important;

  font-size:
    23px !important;

  font-weight:
    700;

  transition:
    transform .15s ease,
    background .15s ease;
}

.lesson:active .arrow {
  background:
    #dcecff;

  transform:
    translateX(2px);
}


/* ---------------------------------------------------------
   EMPTY / FUTURE CONTENT
--------------------------------------------------------- */

.empty {
  margin:
    10px 0 !important;

  padding:
    18px !important;

  border-radius:
    15px !important;

  background:
    linear-gradient(
      135deg,
      #f8fbff,
      #f7f4ff
    ) !important;

  color:
    #667085 !important;

  font-size:
    13px !important;

  line-height:
    1.6 !important;

  text-align:
    center;

  border:
    1px dashed #d7dfeb;
}


/* ---------------------------------------------------------
   LOADING / ERROR
--------------------------------------------------------- */

.loading,
.error {
  background:
    #ffffff !important;

  border-radius:
    20px !important;

  padding:
    25px 18px !important;

  box-shadow:
    var(--shadow-soft) !important;

  color:
    #53627a;
}


/* ---------------------------------------------------------
   FOOTER
--------------------------------------------------------- */

.footer-note {
  margin-top:
    32px !important;

  padding:
    22px 10px !important;

  border-radius:
    20px;

  background:
    linear-gradient(
      135deg,
      #172b4d,
      #243b63
    );

  color:
    rgba(255,255,255,.78) !important;

  font-size:
    12px !important;

  line-height:
    1.8 !important;

  box-shadow:
    0 8px 24px rgba(23,43,77,.16);
}

.footer-note::first-line {
  color:
    #ffffff;
}


/* ---------------------------------------------------------
   MOBILE — SMALL SCREENS
--------------------------------------------------------- */

@media (max-width: 600px) {

  .top {
    padding:
      14px 14px 16px !important;
  }

  .top-row {
    gap:
      9px;
  }

  .brand {
    font-size:
      20px !important;
  }

  .home {
    min-height:
      44px !important;

    padding:
      8px 12px !important;

    font-size:
      13px !important;
  }

  .wrap {
    padding:
      14px 12px 42px !important;
  }

  .welcome {
    border-radius:
      21px !important;

    margin-bottom:
      18px !important;
  }

  .welcome::before {
    min-height:
      92px;
  }

  .welcome h1 {
    padding:
      15px 16px 4px !important;

    font-size:
      22px !important;
  }

  .welcome p {
    padding:
      0 16px 16px !important;

    font-size:
      13px !important;
  }

  .subject {
    min-height:
      62px;

    margin:
      20px 0 12px !important;

    padding:
      15px 17px !important;

    border-radius:
      18px !important;

    font-size:
      19px !important;
  }

  .chapter {
    border-radius:
      18px !important;
  }

  .chapter-head {
    padding:
      16px 15px 14px 18px !important;
  }

  .chapter-title {
    font-size:
      17px !important;
  }

  .lesson {
    min-height:
      60px;

    gap:
      10px !important;

    padding:
      9px 7px !important;
  }

  .num {
    width:
      40px !important;

    height:
      40px !important;

    min-width:
      40px !important;

    border-radius:
      13px !important;
  }

  .lesson-title {
    font-size:

  }

  }

/* ---------------------------------------------------------
   VERY SMALL PHONES
--------------------------------------------------------- */

@media (max-width: 380px) {

  .brand {
    font-size:
      18px !important;
  }

  .sub {
    font-size:
      12px !important;
  }

  .home {
    padding:
      8px 10px !important;

    font-size:
      12px !important;
  }

  .wrap {
    padding-left:
      9px !important;

    padding-right:
      9px !important;
  }

  .welcome::before {
    min-height:
      82px;
  }

  .welcome h1 {
    font-size:
      20px !important;
  }

  .subject {
    font-size:
      18px !important;

    min-height:
      58px;
  }

  .chapter-title {
    font-size:
      16px !important;
  }

  .lesson-title {
    font-size:
      13.5px !important;
  }

  .num {
    width:
      38px !important;

    height:
      38px !important;

    min-width:
      38px !important;
  }

}


/* ---------------------------------------------------------
   ACCESSIBILITY / REDUCED MOTION
--------------------------------------------------------- */

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {
    scroll-behavior:
      auto !important;

    transition:
      none !important;

    animation:
      none !important;
  }

      }
  </style>

</head>

       HEADER
  =============================== -->

  <header class="top">

    <div class="top-row">

      <div>

        <div class="brand">
          AADYA Digital Teacher
        </div>

        <div class="sub">
          मेरी कक्षा
        </div>

      </div>


      <button
        class="home"
        onclick="goHome()"
      >
        ⌂ होम
      </button>

    </div>

  </header>



  <!-- ==============================
       MAIN
  =============================== -->

  <main class="wrap">


    <section class="welcome">

      <h1 id="studentWelcome">
        नमस्ते! 👋
      </h1>

      <p id="classText">
        आपकी Learning Journey यहाँ से शुरू होती है।
      </p>

    </section>



    <div
      id="curriculumBox"
      class="loading"
    >
      📚 आपका Curriculum लोड हो रहा है...
    </div>


    <div class="footer-note">

      AADYA — आपका अपना Digital Teacher<br>

      हर बच्चे तक, हर जगह, हर समय —
      सीखने की आज़ादी।

    </div>


  </main>



  <!-- ==============================
       JAVASCRIPT
  =============================== -->

  <script>


    /* --------------------------------
       PROFILE
    -------------------------------- */

    const PROFILE_KEY =
      "aadya_student_profile_v1";



    /* --------------------------------
       HOME
    -------------------------------- */

    function goHome() {

      window.location.href =
        "./index.html";

    }



    /* --------------------------------
       LOAD STUDENT
    -------------------------------- */

    function loadStudent() {

      try {

        const saved =
          localStorage.getItem(
            PROFILE_KEY
          );


        if (!saved) {

          return "6";

        }


        const profile =
          JSON.parse(saved);


        const name =
          profile.name ||
          profile.studentName ||
          "";


        const cls =
          profile.class ||
          profile.studentClass ||
          profile.selectedClass ||
          "6";


        const welcome =
          document.getElementById(
            "studentWelcome"
          );


        const classText =
          document.getElementById(
            "classText"
          );


        if (name) {

          welcome.textContent =
            "नमस्ते, " +
            name +
            "! 👋";

        }


        classText.textContent =
          "कक्षा " +
          cls +
          " • आपकी Learning Journey में स्वागत है";


        return String(cls);

      }


      catch (error) {

        console.error(
          "Profile error:",
          error
        );

        return "6";

      }

    }



    /* --------------------------------
       OPEN LESSON
    -------------------------------- */

    function openLesson(file) {

      if (!file) {

        return;

      }


      window.location.href =
        "./learning.html?lesson=" +
        encodeURIComponent(file);

    }



    /* --------------------------------
       ESCAPE HTML
       सुरक्षा के लिए
    -------------------------------- */

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }



    /* --------------------------------
       RENDER CURRICULUM
    -------------------------------- */

    function renderCurriculum(
      data,
      classNumber
    ) {


      const box =
        document.getElementById(
          "curriculumBox"
        );


      const classKey =
        "class" +
        classNumber;


      const classData =
        data &&
        data.classes
          ? data.classes[classKey]
          : null;


      if (!classData) {

        box.className =
          "error";


        box.innerHTML =
          "⚠️ कक्षा " +
          escapeHtml(classNumber) +
          " का Curriculum नहीं मिला।";


        return;

      }



      const subjects =
        classData.subjects || {};


      let html = "";


      let subjectCount = 0;



      /* --------------------------------
         SUBJECTS
      -------------------------------- */

      Object.keys(subjects)
        .forEach(
          function(subjectKey) {


            const subject =
              subjects[subjectKey] || {};


            const chapters =
              Array.isArray(
                subject.chapters
              )
                ? subject.chapters
                : [];


            subjectCount++;



            html +=
              '<div class="subject">' +
              "📘 " +
              escapeHtml(
                subject.name ||
                subjectKey
              ) +
              "</div>";



            /* --------------------------------
               NO CHAPTER
            -------------------------------- */

            if (!chapters.length) {

              html +=
                '<div class="empty">' +
                "अभी इस विषय के पाठ " +
                "तैयार किए जा रहे हैं।" +
                "</div>";

              return;

            }



            /* --------------------------------
               CHAPTERS
            -------------------------------- */

            chapters.forEach(
              function(chapter) {


                html +=
                  '<section class="chapter">';



                /* CHAPTER HEADER */

                html +=
                  '<div class="chapter-head">';


                html +=
                  '<div class="chapter-title">' +
                  "अध्याय " +
                  escapeHtml(
                    chapter.number ??
                    ""
                  ) +
                  " — " +
                  escapeHtml(
                    chapter.title ||
                    "अध्याय"
                  ) +
                  "</div>";



                /* SOURCE BADGE */

                if (chapter.source) {

                  const badgeText =
                    chapter.source ===
                    "textbook"

                      ? "📖 पाठ्यपुस्तक आधारित"

                      : "✨ AADYA विशेष पाठ";


                  html +=
                    '<span class="badge">' +
                    badgeText +
                    "</span>";

                }


                html +=
                  "</div>";



                /* LESSON CONTAINER */

                html +=
                  '<div class="lessons">';



                const lessons =
                  Array.isArray(
                    chapter.lessons
                  )
                    ? chapter.lessons
                    : [];



                /* --------------------------------
                   EMPTY LESSONS
                -------------------------------- */

                if (!lessons.length) {

                  html +=
                    '<div class="empty">' +
                    "इस अध्याय के पाठ " +
                    "जल्द उपलब्ध होंगे।" +
                    "</div>";

                }



                /* --------------------------------
                   LESSONS
                -------------------------------- */

                else {

                  lessons.forEach(
                    function(lesson) {


                      const file =
                        lesson.file ||
                        "";


                      const title =
                        lesson.title ||
                        (
                          "पाठ " +
                          (
                            lesson.number ??
                            ""
                          )
                        );


                      const number =
                        lesson.number ??
                        "";



                      html +=
                        '<div class="lesson" ' +
                        'data-file="' +
                        escapeHtml(file) +
                        '">';



                      html +=
                        '<div class="num">' +
                        escapeHtml(number) +
                        "</div>";



                      html +=
                        '<div class="lesson-title">' +
                        escapeHtml(title) +
                        "</div>";



                      html +=
                        '<div class="arrow">' +
                        "›" +
                        "</div>";


                      html +=
                        "</div>";

                    }
                  );

                }



                html +=
                  "</div>";


                html +=
                  "</section>";

              }
            );

          }
        );



      /* --------------------------------
         NO SUBJECT
      -------------------------------- */

      if (!subjectCount) {

        box.className =
          "error";


        box.textContent =
          "⚠️ इस कक्षा का Curriculum " +
          "अभी उपलब्ध नहीं है।";


        return;

      }



      /* --------------------------------
         DISPLAY
      -------------------------------- */

      box.className = "";

      box.innerHTML =
        html;



      /* --------------------------------
         LESSON CLICK EVENTS
      -------------------------------- */

      const lessonElements =
        box.querySelectorAll(
          ".lesson"
        );


      lessonElements.forEach(
        function(element) {


          element.addEventListener(
            "click",
            function() {


              const file =
                element.getAttribute(
                  "data-file"
                );


              openLesson(file);

            }
          );

        }
      );

    }



    /* --------------------------------
       LOAD CURRICULUM
    -------------------------------- */

    async function loadCurriculum() {


      const box =
        document.getElementById(
          "curriculumBox"
        );


      try {


        /* STUDENT CLASS */

        const cls =
          loadStudent() ||
          "6";



        /* CURRICULUM FILE */

        const curriculumFile =
  String(cls) === "7"
    ? "./data/curriculum-class7.json"
    : String(cls) === "8"
      ? "./data/curriculum-class8.json"
      : "./data/curriculum.json";

const url =
  curriculumFile + "?v=" + Date.now();



        /* FETCH */

        const response =
          await fetch(
            url,
            {
              cache: "no-store"
            }
          );



        /* HTTP ERROR */

        if (!response.ok) {

          throw new Error(
            "HTTP " +
            response.status +
            " — curriculum.json नहीं मिला"
          );

        }



        /* JSON */

        const data =
          await response.json();



        /* RENDER */

        renderCurriculum(
          data,
          cls
        );

      }


      catch (error) {


        console.error(
          "Curriculum error:",
          error
        );


        box.className =
          "error";


        box.innerHTML =
          "⚠️ Curriculum लोड नहीं हो पाया।" +
          "<br>" +
          "<small>" +
          "कृपया Internet चालू करके " +
          "पेज Refresh करें।" +
          "</small>";

      }

    }



    /* --------------------------------
       START AADYA CLASS PAGE
       यही हिस्सा पिछली बार छूट गया था
    -------------------------------- */

    document.addEventListener(
      "DOMContentLoaded",
      function() {


        loadStudent();


        loadCurriculum();


      }
    );


  </script>


</body>

</html>
