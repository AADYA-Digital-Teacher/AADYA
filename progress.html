<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>AADYA — मेरी Progress</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;

  font-family:
    Arial,
    "Noto Sans Devanagari",
    sans-serif;

  background:#f3f7fb;
  color:#172b4d;
}

.wrap{
  max-width:900px;

  margin:auto;

  padding:
    10px 12px 40px;
}

.header{
  height:125px;

  border-radius:19px;

  background:
    url("./assets/logo/aadya-home-banner.png")
    center/cover;

  position:relative;
}

.home{
  position:absolute;

  right:10px;
  bottom:9px;

  border:0;

  border-radius:18px;

  background:
    rgba(17,17,17,.86);

  color:#f7c928;

  padding:8px 12px;

  font-weight:900;

  cursor:pointer;
}

.card{
  background:#fff;

  border-radius:19px;

  padding:16px;

  margin-top:10px;

  box-shadow:
    0 7px 22px
    rgba(23,43,77,.07);

  border:
    1px solid #e5ecf4;
}

.student{
  border-left:
    5px solid #f1c40f;
}

.student h1{
  margin:0 0 4px;
  font-size:23px;
}

.muted{
  color:#68768a;

  font-size:13px;

  line-height:1.6;
}

.stats{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:8px;
}

.stat{
  text-align:center;

  padding:13px;

  background:#f8fbff;

  border-radius:14px;
}

.num{
  font-size:25px;
  font-weight:900;
}

.bar{
  height:10px;

  background:#e5e9ef;

  border-radius:99px;

  overflow:hidden;
}

.fill{
  height:100%;

  background:
    linear-gradient(
      90deg,
      #f7c928,
      #56ccf2,
      #7b61ff
    );
}

.subject{
  padding:12px;

  border:
    1px solid #e5ebf3;

  border-radius:14px;

  margin:8px 0;
}

.row{
  display:flex;

  justify-content:space-between;

  gap:8px;
}

.small{
  font-size:11px;
  color:#68768a;
}

.btn{
  display:inline-block;

  border:0;

  border-radius:11px;

  padding:10px 12px;

  background:#172b4d;

  color:#fff;

  font-weight:900;

  text-decoration:none;

  cursor:pointer;
}

.empty{
  padding:15px;

  background:#f8fafc;

  border-radius:13px;

  color:#718096;

  line-height:1.6;
}

@media(max-width:600px){

  .header{
    height:112px;
  }

  .stats{
    gap:5px;
  }

  .num{
    font-size:21px;
  }

}

</style>

</head>

<body>

<main class="wrap">


<header class="header">

<button
  class="home"
  onclick="location.href='./index.html'"
>
⌂ होम
</button>

</header>


<section class="card student">

<h1 id="name">
मेरी Progress
</h1>

<div
  class="muted"
  id="classLine"
>
</div>

</section>


<section class="card">

<h2
  style="margin:0 0 10px"
>
📊 कुल Progress
</h2>

<div
  class="stats"
  id="stats"
>
</div>

<div
  style="margin-top:13px"
  class="bar"
>

<div
  id="fill"
  class="fill"
  style="width:0"
>
</div>

</div>

<div
  id="message"
  class="muted"
  style="margin-top:7px"
>
</div>

</section>


<section class="card">

<h2
  style="margin:0 0 10px"
>
📚 विषयवार Progress
</h2>

<div
  id="subjects"
>
</div>

</section>


<section class="card">

<h2
  style="margin:0 0 10px"
>
▶️ जारी रखें
</h2>

<div
  id="resume"
>
</div>

</section>


<section class="card">

<h2
  style="margin:0 0 10px"
>
🎯 Last Quiz
</h2>

<div
  id="quiz"
>
</div>

</section>


</main>


<script src="./js/aadya-core.js"></script>


<script>

"use strict";


let profile =
  {};

let data =
  null;

let lessons =
  [];

let progress =
  {};


const $ =
  id =>
    document.getElementById(id);


const esc =
  AADYA.esc;


/* =====================================================
   RENDER
===================================================== */

function render(){

  const done =
    lessons.filter(
      function(item){

        return AADYA.isDone(
          item.file,
          progress
        );

      }
    ).length;


  const total =
    lessons.length;


  const percentage =
    total
      ? Math.round(
          done /
          total *
          100
        )
      : 0;


  /* TOTAL */

  $("stats").innerHTML =

    '<div class="stat">' +

    '<div class="num">' +
    done +
    '</div>' +

    '<div>पूरे</div>' +

    '</div>' +


    '<div class="stat">' +

    '<div class="num">' +
    total +
    '</div>' +

    '<div>कुल</div>' +

    '</div>' +


    '<div class="stat">' +

    '<div class="num">' +
    percentage +
    '%</div>' +

    '<div>Progress</div>' +

    '</div>';


  $("fill")
    .style.width =
    percentage +
    "%";


  $("message")
    .textContent =

    percentage === 100 &&
    total

      ?

    "🎉 सभी उपलब्ध Lessons पूरे हो गए!"

      :

    percentage

      ?

    done +
    " Lessons पूरे हो चुके हैं।"

      :

    "अभी सीखना शुरू करें।";


  /* =================================================
     SUBJECTS
  ================================================= */

  const classData =
    AADYA.classData(
      data,
      profile.class
    );


  let html =
    "";


  Object.entries(
    classData?.subjects || {}
  ).forEach(
    function(entry){

      const key =
        entry[0];

      const subject =
        entry[1];


      const subjectLessons =
        AADYA.buildLessons(

          {
            classes: {

              [
                "class" +
                profile.class
              ]: {

                subjects: {

                  [key]:
                    subject

                }

              }

            }

          },

          Number(
            profile.class
          )

        );


      const subjectDone =
        subjectLessons.filter(
          function(item){

            return AADYA.isDone(
              item.file,
              progress
            );

          }
        ).length;


      const subjectPercentage =
        subjectLessons.length
          ? Math.round(
              subjectDone /
              subjectLessons.length *
              100
            )
          : 0;


      html +=

        '<div class="subject">' +

        '<div class="row">' +

        '<b>' +

        AADYA.icon(key) +

        ' ' +

        esc(
          subject.name ||
          key
        ) +

        '</b>' +

        '<span class="small">' +

        subjectDone +
        ' / ' +
        subjectLessons.length +

        '</span>' +

        '</div>' +


        '<div ' +
        'class="bar" ' +
        'style="margin-top:7px">' +

        '<div ' +
        'class="fill" ' +
        'style="width:' +
        subjectPercentage +
        '%">' +

        '</div>' +

        '</div>' +


        '<div ' +
        'class="small" ' +
        'style="margin-top:4px">' +

        subjectPercentage +
        '% पूर्ण' +

        '</div>' +

        '</div>';

    }
  );


  $("subjects").innerHTML =
    html ||

    '<div class="empty">' +
    'अभी विषय उपलब्ध नहीं हैं।' +
    '</div>';


  /* =================================================
     RESUME
  ================================================= */

  const resume =
    AADYA.resumeLesson(
      lessons,
      progress
    );


  if(resume){

    $("resume").innerHTML =

      '<b>' +

      esc(
        resume.title
      ) +

      '</b>' +

      '<div class="small">' +

      esc(
        resume.subjectName
      ) +

      ' · ' +

      esc(
        resume.chapterTitle
      ) +

      '</div>' +

      '<div style="margin-top:8px">' +

      '<a ' +
      'class="btn" ' +
      'href="' +
      AADYA.lessonUrl(
        resume.file
      ) +
      '">' +

      (
        AADYA.isDone(
          resume.file,
          progress
        )
          ?
        "🔁 फिर से पढ़ें"
          :
        "▶️ जारी रखें"
      ) +

      '</a>' +

      '</div>';

  }
  else{

    $("resume").innerHTML =
      '<div class="empty">' +
      'अभी कोई Lesson नहीं है।' +
      '</div>';

  }


  /* =================================================
     LAST QUIZ
  ================================================= */

  const quiz =
    AADYA.read(
      AADYA.KEYS.LAST_QUIZ,
      null
    );


  $("quiz").innerHTML =

    quiz

      ?

    '<b>' +

    quiz.score +

    ' / ' +

    quiz.total +

    '</b> · ' +

    quiz.percentage +

    '% सही'

      :

    'अभी Quiz नहीं दिया गया है।';

}


/* =====================================================
   INIT
===================================================== */

async function init(){

  profile =
    AADYA.profile();


  if(
    !profile.class
  ){

    location.href =
      "./profile.html";

    return;

  }


  try{

    data =
      await AADYA.loadCurriculum(
        Number(
          profile.class
        )
      );


    lessons =
      AADYA.buildLessons(
        data,
        Number(
          profile.class
        )
      );


    progress =
      AADYA.progress();


    $("name")
      .textContent =
      "📈 " +
      (
        profile.name ||
        "विद्यार्थी"
      ) +
      " की Progress";


    $("classLine")
      .textContent =
      "कक्षा " +
      profile.class;


    render();

  }
  catch(error){

    console.error(
      error
    );


    $("subjects").innerHTML =
      '<div class="empty">' +
      '⚠️ Progress लोड नहीं हो सकी।' +
      '</div>';

  }

}


init();

</script>

</body>

</html>
