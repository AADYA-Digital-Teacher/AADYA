<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<meta
  name="theme-color"
  content="#111"
>

<title>AADYA — विषय</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    Arial,
    "Noto Sans Devanagari",
    sans-serif;

  background:#f3f7fb;
  color:#172b4d;
}

.top{
  background:
    linear-gradient(
      135deg,
      #111,
      #17345f,
      #274d78
    );

  color:#fff;

  padding:12px;

  position:sticky;
  top:0;

  z-index:5;
}

.row{
  max-width:900px;
  margin:auto;

  display:flex;

  justify-content:space-between;
  align-items:center;

  gap:10px;
}

.brand{
  font-size:22px;
  font-weight:900;
}

.sub{
  font-size:13px;
  color:#dbe3ee;
  margin-top:3px;
}

.btn{
  border:0;
  border-radius:12px;
  padding:10px 13px;
  font-weight:900;
  cursor:pointer;
}

.home{
  background:#fff;
  color:#172b4d;
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:15px 12px 45px;
}

.intro,
.chapter,
.selectBox{
  background:#fff;

  border-radius:20px;

  box-shadow:
    0 7px 22px
    rgba(23,43,77,.08);

  border:
    1px solid #e4ebf3;
}

.intro{
  padding:19px;
  margin-bottom:15px;
}

.intro h1{
  margin:0 0 5px;
  font-size:27px;
}

.muted{
  color:#68768a;
  font-size:13px;
  line-height:1.6;
}

.selectBox{
  padding:17px;
  margin-bottom:17px;
}

.selectBox label{
  display:block;
  font-weight:900;
  margin-bottom:8px;
}

.select{
  width:100%;

  padding:13px;

  border:
    1px solid #dbe3ed;

  border-radius:12px;

  font-size:16px;

  background:#fff;

  color:#172b4d;
}

.subjectHeading{
  font-size:22px;
  font-weight:900;

  margin:
    18px 2px 10px;
}

.chapter{
  margin:12px 0;
  overflow:hidden;
}

.chHead{
  padding:16px;

  background:
    linear-gradient(
      90deg,
      #f7fbff,
      #faf8ff
    );

  border-bottom:
    1px solid #e7edf5;
}

.chTitle{
  font-size:18px;
  font-weight:900;
  line-height:1.5;
}

.badge{
  display:inline-block;

  margin-top:7px;

  padding:5px 9px;

  border-radius:999px;

  background:#eef2f6;

  color:#667085;

  font-size:11px;
}

.lesson{
  display:flex;

  align-items:center;

  gap:9px;

  padding:12px;

  border-bottom:
    1px solid #eef2f6;

  cursor:pointer;
}

.lesson:last-child{
  border-bottom:0;
}

.lesson:active{
  background:#f7fbff;
}

.num{
  width:36px;
  height:36px;

  border-radius:11px;

  background:#172b4d;

  color:#fff;

  display:grid;
  place-items:center;

  font-weight:900;

  flex:none;
}

.lt{
  flex:1;

  font-size:14px;

  line-height:1.5;
}

.done{
  color:#198754;

  font-size:12px;

  font-weight:800;

  margin-top:3px;
}

.arrow{
  width:34px;
  height:34px;

  border-radius:50%;

  background:#f0f4f8;

  display:grid;
  place-items:center;

  font-size:22px;
}

.empty{
  padding:20px;

  text-align:center;

  color:#718096;

  background:#f8fafc;

  border-radius:15px;

  line-height:1.6;
}

@media(max-width:600px){

  .brand{
    font-size:19px;
  }

  .intro h1{
    font-size:24px;
  }

  .lt{
    font-size:13px;
  }

}

</style>

</head>

<body>

<header class="top">

  <div class="row">

    <div>

      <div class="brand">
        📚 मेरे विषय
      </div>

      <div
        class="sub"
        id="sub"
      >
        AADYA Digital Teacher
      </div>

    </div>

    <button
      class="btn home"
      onclick="location.href='./index.html'"
    >
      ⌂ होम
    </button>

  </div>

</header>


<main class="wrap">


<section class="intro">

  <h1>
    📚 विषय चुनें
  </h1>

  <div class="muted">
    पहले विषय चुनिए। उसके बाद उसी विषय के
    अध्याय और सभी Lessons दिखाई देंगे।
  </div>

</section>


<section class="selectBox">

  <label for="subjectSelect">
    📘 विषय
  </label>

  <select
    id="subjectSelect"
    class="select"
  >

    <option value="">
      विषय चुनें…
    </option>

  </select>

</section>


<section id="content">

  <div class="empty">
    ऊपर से कोई विषय चुनिए।
  </div>

</section>


</main>


<script src="./js/aadya-core.js"></script>


<script>

"use strict";


let cls =
  AADYA.getClass();

let data =
  null;

let subjects =
  {};


const $ =
  id =>
    document.getElementById(id);


const esc =
  AADYA.esc;


/* =====================================================
   SUBJECT DROPDOWN
===================================================== */

function renderSubjects(
  selected
){

  const allSubjects =
    AADYA
      .classData(
        data,
        cls
      )
      ?.subjects ||
    {};


  subjects =
    allSubjects;


  const select =
    $("subjectSelect");


  select.innerHTML =
    '<option value="">विषय चुनें…</option>' +

    Object.entries(
      allSubjects
    )
    .map(
      function(entry){

        const key =
          entry[0];

        const subject =
          entry[1];

        return (

          '<option value="' +
          esc(key) +
          '">' +

          esc(
            subject.name ||
            key
          ) +

          '</option>'

        );

      }
    )
    .join("");


  if(
    selected &&
    allSubjects[selected]
  ){

    select.value =
      selected;

    renderSubject(
      selected
    );

  }

}


/* =====================================================
   RENDER SUBJECT
===================================================== */

function renderSubject(
  key
){

  const subject =
    subjects[key];


  if(!subject){

    $("content").innerHTML =
      '<div class="empty">' +
      'विषय चुनिए।' +
      '</div>';

    return;

  }


  let html =

    '<div class="subjectHeading">' +

    AADYA.icon(key) +
    ' ' +

    esc(
      subject.name ||
      key
    ) +

    '</div>';


  const chapters =
    subject.chapters ||
    [];


  chapters.forEach(
    function(chapter){

      html +=

        '<section class="chapter">' +

        '<div class="chHead">' +

        '<div class="chTitle">' +

        'अध्याय ' +

        esc(
          chapter.number
        ) +

        ' — ' +

        esc(
          chapter.title ||
          ""
        ) +

        '</div>';


      if(
        chapter.source
      ){

        html +=

          '<span class="badge">' +

          (
            chapter.source ===
            "textbook"

              ?

            "📖 पाठ्यपुस्तक आधारित"

              :

            "✨ AADYA विशेष पाठ"

          ) +

          '</span>';

      }


      html +=

        '</div>';


      const lessons =
        chapter.lessons ||
        [];


      if(
        !lessons.length
      ){

        html +=

          '<div class="empty">' +

          'इस अध्याय के Lessons ' +
          'जल्द उपलब्ध होंगे।' +

          '</div>';

      }


      lessons.forEach(
        function(lesson){

          const done =
            AADYA.isDone(
              lesson.file
            );


          html +=

            '<div ' +

            'class="lesson" ' +

            'data-file="' +

            esc(
              lesson.file ||
              ""
            ) +

            '">' +

            '<div class="num">' +

            esc(
              lesson.number
            ) +

            '</div>' +

            '<div class="lt">' +

            '<div>' +

            esc(
              lesson.title ||
              (
                "पाठ " +
                lesson.number
              )
            ) +

            '</div>' +

            (
              done

                ?

              '<div class="done">' +
              '✅ पूरा किया' +
              '</div>'

                :

              ''

            ) +

            '</div>' +

            '<div class="arrow">' +
            '›' +
            '</div>' +

            '</div>';

        }
      );


      html +=
        '</section>';

    }
  );


  $("content").innerHTML =
    html ||

    '<div class="empty">' +
    'इस विषय में अभी Lessons उपलब्ध नहीं हैं।' +
    '</div>';


  $("content")
    .querySelectorAll(
      ".lesson"
    )
    .forEach(
      function(item){

        item.onclick =
          function(){

            const file =
              item.dataset.file;

            if(file){

              AADYA.goLesson(
                file
              );

            }

          };

      }
    );

}


/* =====================================================
   DROPDOWN CHANGE
===================================================== */

$("subjectSelect")
  .onchange =
  function(event){

    const key =
      event.target.value;


    if(key){

      history.replaceState(
        null,
        "",
        "./subjects.html?class=" +
        cls +
        "&subject=" +
        encodeURIComponent(
          key
        )
      );


      renderSubject(
        key
      );

    }
    else{

      $("content").innerHTML =
        '<div class="empty">' +
        'ऊपर से कोई विषय चुनिए।' +
        '</div>';

    }

  };


/* =====================================================
   INIT
===================================================== */

async function init(){

  try{

    data =
      await AADYA.loadCurriculum(
        cls
      );


    $("sub").textContent =
      "कक्षा " +
      cls +
      " · विषय चुनें";


    const selected =
      new URLSearchParams(
        location.search
      ).get("subject");


    renderSubjects(
      selected
    );


  }catch(error){

    console.error(
      error
    );


    $("content").innerHTML =
      '<div class="empty">' +
      '⚠️ Curriculum लोड नहीं हो पाया।' +
      '</div>';

  }

}


init();

</script>

</body>

</html>
